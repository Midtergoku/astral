<style>
  body { display: flex; min-height: 100vh; margin: 0; }
  /* ── O PAINEL DO NEGOCIO (09/10/2026, roadmap 3.17 / NEG-04) ───────────────
     Tela do DONO, nao do concurseiro: numeros grandes, legiveis de relance.
     Tudo vem de painel_de_negocio() -- o servidor confere se e o administrador
     e devolve SO numeros (nenhum nome, e-mail ou id). A origem vem da URL que
     trouxe a pessoa: dado nao confiavel, sempre por esc(). */
  .periodo { display: flex; gap: var(--e2); flex-wrap: wrap; margin-bottom: var(--e4); }
  .periodo button {
    background: transparent; border: 1px solid var(--linha); color: var(--texto-2);
    border-radius: var(--r-p); padding: .5rem .9rem; min-height: 40px; cursor: pointer;
    font-family: var(--display); font-weight: 600; font-size: .8rem;
  }
  .periodo button[aria-pressed="true"] { border-color: var(--latao); color: var(--latao-c); }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--e3); margin-bottom: var(--e4); }
  .numero { background: var(--casco); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3); }
  .numero dt { font-size: .75rem; color: var(--texto-2); text-transform: uppercase; letter-spacing: .06em; }
  .numero dd { margin: .3rem 0 0; font-family: var(--dado); font-size: 1.75rem; color: var(--papel); }
  .numero small { display: block; font-size: .75rem; color: var(--texto-2); margin-top: .2rem; }
  .bloco { background: var(--casco); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3) var(--e4); margin-bottom: var(--e4); }
  .bloco h2 { font-family: var(--display); font-size: var(--t-md); margin: 0 0 var(--e3); color: var(--papel); }
  .bloco p.nota { font-size: var(--t-sm); color: var(--texto-2); margin: var(--e2) 0 0; line-height: 1.5; }
  .etapa { display: grid; grid-template-columns: 11rem 1fr 6.5rem; gap: var(--e2); align-items: center; margin: .45rem 0; font-size: var(--t-sm); }
  .etapa .barra { height: 12px; background: var(--casco-2); border-radius: var(--r-p); overflow: hidden; }
  .etapa .barra span { display: block; height: 100%; background: var(--latao); }
  .etapa .valor { font-family: var(--dado); text-align: right; color: var(--texto); }
  table.origens { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
  table.origens th, table.origens td { text-align: right; padding: .45rem .5rem; border-bottom: 1px solid var(--linha); }
  table.origens th:first-child, table.origens td:first-child { text-align: left; }
  table.origens th { color: var(--texto-2); font-weight: 600; }
  table.origens td { font-family: var(--dado); }
  table.origens td:first-child { font-family: var(--corpo); word-break: break-word; }
  .dias { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
  .dias span { flex: 1; background: var(--oliva); border-radius: 2px 2px 0 0; min-height: 2px; }
  .dias-eixo { display: flex; justify-content: space-between; font-size: .75rem; color: var(--texto-2); margin-top: .3rem; font-family: var(--dado); }
  .alerta { border-left: 3px solid var(--brasa); padding: .5rem .75rem; margin: .4rem 0; font-size: var(--t-sm); background: color-mix(in srgb, var(--brasa) 8%, transparent); }
  .tudo-bem { color: var(--oliva-c); font-size: var(--t-sm); }
  .negado { text-align: center; padding: var(--e6) var(--e3); }
  .tabela-rola { overflow-x: auto; }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
    .etapa { grid-template-columns: 1fr 5.5rem; }
    .etapa .barra { grid-column: 1 / -1; grid-row: 2; }
  }
</style>

<script type="module">
  import { supabase, esc, exigirSessao, fazerLogout, nomeDoUsuario, relatar }
    from './assets/js/astral.js?v=bb42703d';

  const $ = (id) => document.getElementById(id);
  const ETAPAS = [['cadastro', 'Cadastrou'], ['edital', 'Subiu o edital'], ['rotina', 'Respondeu a rotina'], ['primeira_sessao', '1ª sessão de estudo']];
  const PERIODOS = [[7, '7 dias'], [30, '30 dias'], [90, '90 dias'], [0, 'Desde o começo']];
  const FUNCOES = { 'processar-edital': 'Leituras de edital', 'buscar-recursos': 'Guias de professores', 'gerar-questoes': 'Questões geradas' };
  const n = (v) => Number(v || 0).toLocaleString('pt-BR');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  let periodo = 30;

  function desenhar(p) {
    const f = p.funil || {};
    const base = Number(f.cadastro || 0);
    const qual = periodo ? `nos últimos ${periodo} dias` : 'desde o começo';
    const planos = Object.entries(p.planos || {}).map(([k, v]) => `${esc(k)} ${n(v)}`).join(' · ') || '—';
    const dias = p.cadastros_por_dia || [];
    const maiorDia = Math.max(1, ...dias.map((d) => d.n));
    const op = p.operacao || {};
    const alertas = op.alertas || [];
    const ia = Object.entries(p.ia || {});

    $('conteudo').innerHTML = `
      <div class="periodo" role="group" aria-label="Período">
        ${PERIODOS.map(([d, t]) => `<button type="button" data-dias="${d}" aria-pressed="${d === periodo}">${t}</button>`).join('')}
      </div>

      <dl class="numeros">
        <div class="numero"><dt>Contas</dt><dd>${n(p.contas)}</dd><small>sem as contas de teste</small></div>
        <div class="numero"><dt>Novas</dt><dd>${n(p.novas)}</dd><small>${qual}</small></div>
        <div class="numero"><dt>Estudaram</dt><dd>${n(p.ativas_7)}</dd><small>nos últimos 7 dias (${n(p.ativas_30)} em 30)</small></div>
        <div class="numero"><dt>Lista de espera</dt><dd>${n(p.lista_espera)}</dd><small>planos: ${planos}</small></div>
      </dl>

      <section class="bloco">
        <h2>O funil — quem se cadastrou ${qual}</h2>
        ${ETAPAS.map(([k, t]) => {
          const v = Number(f[k] || 0);
          return `<div class="etapa"><span>${t}</span><span class="barra"><span style="width:${pct(v, base)}%"></span></span>
            <span class="valor">${n(v)} · ${pct(v, base)}%</span></div>`;
        }).join('')}
        <p class="nota">Cada etapa é marcada pelo servidor, uma vez por pessoa. A porcentagem é sobre quem se cadastrou no período.</p>
      </section>

      <section class="bloco">
        <h2>De onde vieram</h2>
        ${(p.origens || []).length ? `<div class="tabela-rola"><table class="origens">
          <thead><tr><th scope="col">Origem</th>${ETAPAS.map(([, t]) => `<th scope="col">${t}</th>`).join('')}</tr></thead>
          <tbody>${p.origens.map((o) => `<tr><td>${esc(o.origem)}</td>${ETAPAS.map(([k]) => `<td>${n((o.etapas || {})[k])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>` : '<p class="nota">Ninguém se cadastrou neste período.</p>'}
        <p class="nota">A origem é o <code>utm_source</code> do link, ou o site que trouxe a pessoa. "Direto" = digitou o endereço.</p>
      </section>

      <section class="bloco">
        <h2>Cadastros por dia</h2>
        <div class="dias" role="img" aria-label="Cadastros por dia: ${dias.reduce((s, d) => s + d.n, 0)} no total">
          ${dias.map((d) => `<span style="height:${Math.round((d.n / maiorDia) * 100)}%" title="${esc(d.dia)}: ${d.n}"></span>`).join('')}
        </div>
        <div class="dias-eixo"><span>${esc(dias[0]?.dia || '')}</span><span>${esc(dias[dias.length - 1]?.dia || '')}</span></div>
      </section>

      <section class="bloco">
        <h2>Inteligência artificial</h2>
        ${ia.length ? ia.map(([k, v]) => `<div class="etapa"><span>${esc(FUNCOES[k] || k)}</span><span></span><span class="valor">${n(v)}</span></div>`).join('')
          : `<p class="nota">Nenhuma chamada à IA ${qual}.</p>`}
        <p class="nota">${n(p.editais_guardados)} edital(is) já lido(s) e guardado(s) — quem sobe o mesmo PDF não gasta de novo.
          Faturamento: <strong>ainda não há pagamento no Astral</strong> (entra com o Mercado Pago).</p>
      </section>

      <section class="bloco">
        <h2>Operação</h2>
        ${alertas.length ? alertas.map((a) => `<div class="alerta">${esc(a.texto)}</div>`).join('')
          : '<p class="tudo-bem">Nenhum alerta do vigia agora.</p>'}
        <p class="nota">Banco: ${esc(op.banco_mb)} MB de 500 · arquivos: ${esc(op.arquivos_mb ?? '—')} MB ·
          erros nos navegadores (24 h): ${n(op.erros_navegador_24h)}. Os alertas também chegam por e-mail.</p>
      </section>`;

    document.querySelectorAll('[data-dias]').forEach((b) => b.addEventListener('click', () => {
      periodo = Number(b.dataset.dias);
      carregar();
    }));
  }

  async function carregar() {
    const { data, error } = await supabase.rpc('painel_de_negocio', { p_dias: periodo });
    if (error) {
      relatar(error, 'painel/carregar');
      $('conteudo').innerHTML = '<div class="bloco"><p class="nota">Não consegui carregar o painel agora. Recarregue a página em instantes.</p></div>';
      return;
    }
    desenhar(data || {});
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    await nomeDoUsuario(sessao);
    // A tela so evita mostrar um painel vazio: quem decide e o servidor
    // (painel_de_negocio confere sou_administrador por auth.uid()).
    const { data: souAdmin } = await supabase.rpc('sou_administrador');
    if (!souAdmin) {
      $('conteudo').innerHTML = `<div class="card negado">
        <div class="section-title">Esta página não é para você</div>
        <div class="vazio-texto">Aqui ficam os números do negócio, e só quem administra o Astral os vê.
        Para estudar, vá ao <a href="dashboard.html">Dashboard</a>.</div>
      </div>`;
      return;
    }
    await carregar();
  })();

  document.getElementById('btn-sair')?.addEventListener('click', fazerLogout);
</script>
