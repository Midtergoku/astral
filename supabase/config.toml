# Declaracao das edge functions do Astral.
#
# Antes so 2 das 4 estavam aqui, e as outras duas viviam apenas como deploy na
# nuvem, sem representacao no repositorio.
#
# Sobre verify_jwt: ele NAO substitui a autenticacao feita dentro da funcao.
# Medido em 30/07/2026 -- o gateway aceita qualquer chave valida do projeto,
# inclusive a publishable key, que esta no codigo-fonte de todas as paginas.
# Fica ligado como camada extra; a identidade de verdade e conferida em
# _shared/comum.ts, que recusa explicitamente as chaves do projeto.

[functions.processar-edital]
enabled = true
verify_jwt = true
entrypoint = "./functions/processar-edital/index.ts"

[functions.gerar-questoes]
enabled = true
verify_jwt = true
entrypoint = "./functions/gerar-questoes/index.ts"

[functions.buscar-recursos]
enabled = true
verify_jwt = true
entrypoint = "./functions/buscar-recursos/index.ts"

# Quota do usuario -- leitura pura, para a tela mostrar quanto resta do dia.
# Nao gasta quota nem credito da Anthropic.
[functions.minha-quota]
enabled = true
verify_jwt = true
entrypoint = "./functions/minha-quota/index.ts"

# Exclusao de conta (LGPD). Exige JWT de usuario -- a identidade e conferida
# de novo dentro da funcao, como nas demais.
[functions.excluir-conta]
enabled = true
verify_jwt = true
entrypoint = "./functions/excluir-conta/index.ts"

# Chamada pelo webhook do banco quando entra linha em lista_espera, entao nao
# ha JWT de usuario. A protecao e o cabecalho x-astral-webhook-secret, que so
# passa a ser exigido quando WEBHOOK_SECRET existir nos secrets. Ver CLAUDE.md 8.7.
[functions.notificar-cadastro]
enabled = true
verify_jwt = false
import_map = "./functions/notificar-cadastro/deno.json"
entrypoint = "./functions/notificar-cadastro/index.ts"
