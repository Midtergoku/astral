<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  /* ── O TAF (30/09/2026, item 10) ────────────────────────────────────────
     Ficha de treino: cada prova e um cartao com o indice do edital, a melhor
     marca e a regua ate o indice. Aqui so se desenha -- o XP de preparo
     fisico e calculado no servidor (meu_taf, migration 20260930140000). */
  .taf-aviso {
    background: var(--casco-2); border: 1px solid var(--linha); border-left: 3px solid var(--latao);
    border-radius: var(--r-p); padding: var(--e3); margin-bottom: var(--e4);
    font-size: var(--t-sm); color: var(--texto-2); line-height: 1.5;
  }
  .taf-aviso b { color: var(--texto); }
  .taf-aviso .taf-botoes { margin-top: var(--e2); }
  .taf-resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e3); margin-bottom: var(--e4); }
  .taf-num { background: var(--casco); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3); }
  .taf-num-valor { font-family: var(--dado); font-weight: 700; font-size: var(--t-xl); color: var(--latao-c); line-height: 1; }
  .taf-num-rot { font-family: var(--dado); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--texto-3); margin-top: .4rem; }
  .taf-provas { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: var(--e3); }
  .taf-prova { background: var(--casco); border: 1px solid var(--linha); border-radius: var(--r-g); padding: var(--e3); display: grid; gap: var(--e2); }
  .taf-prova.apta { border-color: color-mix(in srgb, var(--oliva-c) 55%, transparent); }
  .taf-prova-topo { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e2); }
  .taf-prova-nome { font-family: var(--display); font-weight: 700; color: var(--texto); }
  .taf-selo { font-family: var(--dado); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-3); }
  .taf-prova.apta .taf-selo { color: var(--oliva-c); }
  .taf-linha { display: flex; justify-content: space-between; font-size: var(--t-sm); color: var(--texto-2); }
  .taf-linha b { font-family: var(--dado); color: var(--texto); font-weight: 600; }
  .taf-regua { height: 6px; background: var(--casco-2); border-radius: var(--r-p); overflow: hidden; }
  .taf-regua > div { height: 100%; background: var(--latao); transform-origin: left; }
  .taf-prova.apta .taf-regua > div { background: var(--oliva-c); }
  .taf-serie { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
  .taf-serie span { flex: 1; background: color-mix(in srgb, var(--latao) 45%, transparent); border-radius: var(--r-p); min-height: 2px; }
  .taf-form { display: flex; gap: var(--e2); }
  .taf-form[hidden] { display: none; }        /* senao o display:flex anula o hidden */
  .taf-form input { flex: 1; min-width: 0; background: var(--breu); border: 1px solid var(--linha); color: var(--texto);
    border-radius: var(--r-p); padding: .55rem .6rem; font-family: var(--dado); font-size: var(--t-sm); min-height: 44px; }
  .taf-btn { background: var(--latao); color: var(--breu); border: none; border-radius: var(--r-p); padding: .55rem .9rem;
    font-family: var(--display); font-weight: 700; font-size: var(--t-sm); cursor: pointer; min-height: 44px; }
  .taf-btn.fantasma { background: transparent; color: var(--latao-c); border: 1px solid var(--linha); }
  .taf-meta { font-size: var(--t-xs); color: var(--texto-3); }
  .taf-meta button { background: none; border: none; color: var(--latao-c); cursor: pointer; font-size: var(--t-xs); padding: .4rem 0; margin-block: -.4rem; text-decoration: underline; }   /* 14 px de altura -> 27 (04/10, UX-08) */
  .taf-escolha { display: flex; flex-wrap: wrap; gap: var(--e2); margin: var(--e2) 0 0; }
  .taf-escolha label { display: inline-flex; align-items: center; gap: .35rem; font-size: var(--t-sm); color: var(--texto-2);
    border: 1px solid var(--linha); border-radius: var(--r-p); padding: .4rem .6rem; cursor: pointer; min-height: 40px; }
  .taf-rodape { font-size: .78rem; color: var(--texto-3); line-height: 1.45; border-top: 1px solid var(--linha); padding-top: var(--e3); margin-top: var(--e5); }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
  }
  @media (max-width: 520px) {
    .taf-resumo { grid-template-columns: 1fr 1fr; }
  }
</style>

<script type="module">
  import { supabase, esc, att, exigirSessao, fazerLogout, nomeDoUsuario, toast, relatar }
    from './assets/js/astral.js?v=74ba4be2';
  import { carregarProgresso } from './assets/js/estado.js?v=25e433fd';
  import { PROVAS, provasDoTreino, metaDe, situacao, formatar } from './assets/js/taf.js?v=e63bab9e';

  let uid = null;
  let cfg = {};          // progresso.taf: { sexo, semTaf, treinarMesmoAssim, provas, metas }
  let edital = null;     // progresso.edital (o TAF lido do edital mora em edital.taf)
  let resumo = { xp: 0, dias_treinados: 0, provas: {} };

  const $ = (id) => document.getElementById(id);

  async function salvarCfg() {
    const { data, error } = await supabase.from('progresso').update({ taf: cfg }).eq('usuario_id', uid).select('usuario_id');
    if (!error && data?.length) return;
    // Conta sem progresso ainda (nunca subiu edital): cria a linha so com o TAF.
    const ins = await supabase.from('progresso').insert({ usuario_id: uid, taf: cfg });
    if (ins.error) { relatar(ins.error, 'taf/salvar'); toast('Não consegui salvar. Tente de novo.', 'error'); }
  }

  async function carregarResumo() {
    const { data, error } = await supabase.rpc('meu_taf');
    if (error) { relatar(error, 'taf/resumo'); return; }
    resumo = data || resumo;
  }

  function render() {
    const conteudo = $('conteudo');
    const taf = edital?.taf || null;
    const partes = [];

    // 1. O concurso nao tem TAF
    if (taf && taf.existe === false && !cfg.treinarMesmoAssim) {
      conteudo.innerHTML = `
        <div class="taf-aviso">
          <b>O edital de ${esc(edital?.nome || 'seu concurso')} não prevê TAF.</b><br>
          Pode treinar mesmo assim: conta para o seu preparo físico, separado do XP de estudo.
          <div class="taf-botoes"><button class="taf-btn fantasma" id="treinar-assim">Treinar mesmo assim</button></div>
        </div>`;
      $('treinar-assim').addEventListener('click', async () => { cfg.treinarMesmoAssim = true; await salvarCfg(); render(); });
      return;
    }

    // 2. O sexo decide o indice
    if (!cfg.sexo) {
      partes.push(`
        <div class="taf-aviso">
          <b>Os índices do TAF mudam entre masculino e feminino.</b> Qual tabela vale para você?
          <div class="taf-escolha">
            <label><input type="radio" name="sexo" value="m"> Masculino</label>
            <label><input type="radio" name="sexo" value="f"> Feminino</label>
          </div>
        </div>`);
    }

    // 3. De onde vem o indice
    if (!taf || taf.existe == null || !(taf.provas || []).length) {
      partes.push(`
        <div class="taf-aviso">
          O edital ${taf && taf.existe === true ? 'cita o TAF, mas não trouxe os índices' : 'não informou o TAF (ou foi lido antes desta função existir)'}.
          Digite em cada prova o <b>índice do seu edital</b> — o Astral não inventa índice.
          <div class="taf-escolha" id="escolha-provas">
            ${Object.entries(PROVAS).map(([id, p]) => `
              <label><input type="checkbox" value="${att(id)}" ${provasDoTreino(cfg, taf).includes(id) ? 'checked' : ''}> ${esc(p.nome)}</label>`).join('')}
          </div>
        </div>`);
    }

    // 4. O resumo
    const provas = provasDoTreino(cfg, taf);
    const aptas = provas.filter((id) => situacao(id, resumo.provas?.[id]?.melhor, metaDe(id, cfg, taf)).apta).length;
    partes.push(`
      <div class="taf-resumo">
        <div class="taf-num"><div class="taf-num-valor">${Number(resumo.xp) || 0}</div><div class="taf-num-rot">XP de preparo físico</div></div>
        <div class="taf-num"><div class="taf-num-valor">${Number(resumo.dias_treinados) || 0}</div><div class="taf-num-rot">dias treinados</div></div>
        <div class="taf-num"><div class="taf-num-valor">${aptas}/${provas.length}</div><div class="taf-num-rot">provas no índice</div></div>
      </div>`);

    // 5. As provas
    partes.push(`<div class="taf-provas">${provas.map((id) => {
      const p = PROVAS[id];
      const r = resumo.provas?.[id] || {};
      const meta = metaDe(id, cfg, taf);
      const s = situacao(id, r.melhor, meta);
      const serie = (r.serie || []).map((x) => Number(x.valor));
      const maior = Math.max(1, ...serie);
      return `
        <div class="taf-prova${s.apta ? ' apta' : ''}" data-prova="${att(id)}">
          <div class="taf-prova-topo">
            <span class="taf-prova-nome">${esc(p.nome)}</span>
            <span class="taf-selo">${s.apta ? 'no índice' : meta ? `${s.pct}% do índice` : 'sem índice'}</span>
          </div>
          <div class="taf-linha"><span>Melhor marca</span><b>${r.melhor != null ? esc(formatar(id, r.melhor)) : '—'}</b></div>
          <div class="taf-linha"><span>Índice</span><b>${meta ? esc(formatar(id, meta)) : '—'}</b></div>
          ${meta ? `<div class="taf-regua"><div style="transform:scaleX(${Math.min(1, s.pct / 100)})"></div></div>` : ''}
          ${serie.length > 1 ? `<div class="taf-serie" title="Últimas marcas">${serie.map((v) => `<span style="height:${Math.round((p.menorMelhor ? (Math.min(...serie) / v) : (v / maior)) * 100)}%"></span>`).join('')}</div>` : ''}
          <div class="taf-meta">${meta && (taf?.provas || []).length && cfg.metas?.[id] == null ? 'Índice do seu edital.' : ''}
            <button type="button" data-meta="${att(id)}">${meta ? 'Mudar o índice' : 'Digitar o índice do edital'}</button></div>
          <form class="taf-form" data-meta-form="${att(id)}" hidden>
            <input type="number" inputmode="decimal" step="${p.decimal ? '0.1' : '1'}" min="${p.min}" max="${p.max}" value="${meta ?? ''}" placeholder="${esc(p.sufixo)}" aria-label="Índice em ${esc(p.sufixo)}" required>
            <button class="taf-btn fantasma" type="submit">Salvar índice</button>
          </form>
          <form class="taf-form" data-registrar="${att(id)}">
            <input type="number" inputmode="decimal" step="${p.decimal ? '0.1' : '1'}" min="${p.min}" max="${p.max}" placeholder="${esc(p.sufixo)}" aria-label="Nova marca em ${esc(p.sufixo)}" autocomplete="off" required>
            <button class="taf-btn" type="submit">Registrar</button>
          </form>
        </div>`;
    }).join('')}</div>`);

    partes.push(`<div class="taf-rodape">O XP do TAF é do preparo físico e não mexe na sua patente, que mede o estudo.
      Cada prova vale 10 XP por dia em que você registra uma marca — treinar em dias diferentes vale mais que repetir no mesmo dia.
      Na dúvida, vale o índice do edital oficial.</div>`);

    conteudo.innerHTML = partes.join('');

    conteudo.querySelectorAll('input[name="sexo"]').forEach((el) => el.addEventListener('change', async () => {
      cfg.sexo = el.value; await salvarCfg(); render();
    }));
    conteudo.querySelectorAll('#escolha-provas input').forEach((el) => el.addEventListener('change', async () => {
      cfg.provas = [...conteudo.querySelectorAll('#escolha-provas input:checked')].map((x) => x.value);
      await salvarCfg(); render();
    }));
    conteudo.querySelectorAll('[data-meta]').forEach((b) => b.addEventListener('click', () => {
      const f = conteudo.querySelector(`[data-meta-form="${CSS.escape(b.dataset.meta)}"]`);
      if (f) { f.hidden = !f.hidden; if (!f.hidden) f.querySelector('input').focus(); }
    }));
    conteudo.querySelectorAll('[data-meta-form]').forEach((f) => f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = f.dataset.metaForm, p = PROVAS[id];
      const n = Number(String(f.querySelector('input').value).replace(',', '.'));
      if (!(n >= p.min && n <= p.max)) { toast(`Use um valor entre ${p.min} e ${p.max} ${p.sufixo}.`, 'error'); return; }
      cfg.metas = { ...(cfg.metas || {}), [id]: n };
      await salvarCfg(); render();
    }));
    conteudo.querySelectorAll('[data-registrar]').forEach((f) => f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = f.dataset.registrar, p = PROVAS[id];
      const n = Number(String(f.querySelector('input').value).replace(',', '.'));
      if (!(n >= p.min && n <= p.max)) { toast(`Marca entre ${p.min} e ${p.max} ${p.sufixo}.`, 'error'); return; }
      const xpAntes = Number(resumo.xp) || 0;
      const { error } = await supabase.from('taf_registros').insert({ prova: id, valor: n });
      if (error) { relatar(error, 'taf/registrar'); toast(error.message?.includes('limite') ? 'Limite de marcas por hoje.' : 'Não consegui registrar. Tente de novo.', 'error'); return; }
      await carregarResumo();
      const ganhou = (Number(resumo.xp) || 0) - xpAntes;
      toast(ganhou > 0 ? `Marca registrada. +${ganhou} XP de preparo físico.` : 'Marca registrada.');
      render();
    }));
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    uid = sessao.user.id;
    await nomeDoUsuario(sessao);
    const p = await carregarProgresso(uid);
    edital = p?.edital || null;
    const { data } = await supabase.from('progresso').select('taf').eq('usuario_id', uid).maybeSingle();
