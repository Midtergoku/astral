<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  /* ── O QUADRO DE OPERAÇÕES ────────────────────────────────────────────────
     A imagem que ele mandou como exemplo era uma árvore de talentos de jogo de
     fantasia, e ele pediu explicitamente para NÃO ser daquele jeito. O que se
     mantém é a ESTRUTURA (ramos paralelos, degraus, convergência); o que muda
     é tudo o mais.

     A referência aqui é a mesa onde se planeja uma campanha: fundo de mapa,
     frentes que avançam em paralelo, objetivos ligados por linha. Hexágono em
     vez de círculo porque hexágono é a forma de grade de mapa tático — círculo
     é a forma de qualquer jogo. */

  .quadro {
    display: flex;
    gap: var(--e3);
    align-items: flex-end;        /* todas as frentes partem do chão */
    overflow-x: auto;
    padding: var(--e4) var(--e2) var(--e5);
    /* A grade do mapa, fraca o bastante para não competir com os nós. */
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--linha) 40%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--linha) 40%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid var(--linha);
    border-radius: var(--r-g);
  }

  .frente {
    display: flex;
    flex-direction: column-reverse;   /* o degrau 1 fica EMBAIXO */
    align-items: center;
    gap: 0;
    min-width: 8.5rem;
    flex: 1 0 auto;
  }

  .frente-cabeca {
    order: 1;                          /* com column-reverse, vai para o topo */
    text-align: center;
    padding: 0 var(--e1) var(--e3);
    max-width: 10rem;
  }

  .frente-nome {
    font-family: var(--display); font-weight: 800;
    font-size: var(--t-xs); letter-spacing: .14em; text-transform: uppercase;
    color: var(--texto-2); line-height: 1.25;
  }

  .frente-conta {
    font-family: var(--dado); font-size: .68rem;
    color: var(--texto-3); font-variant-numeric: tabular-nums; margin-top: .15rem;
  }

  .frente.completa .frente-nome { color: var(--latao-c); }

  /* ── O NÓ ─────────────────────────────────────────────────────────────── */
  .no {
    position: relative;
    width: 3rem; height: 3.4rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--casco);
    border: 1px solid var(--linha);
    /* Hexágono: grade de mapa tático. */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    cursor: help;
    flex-shrink: 0;
  }

  /* A ligação com o degrau de baixo. Fica acesa só quando OS DOIS estão
     conquistados -- é o que transforma pontos soltos em caminho percorrido. */
  .elo {
    width: 2px; height: 1.15rem;
    background: var(--linha);
    flex-shrink: 0;
  }

  .elo.aceso { background: var(--latao); }

  .no-grau {
    font-family: var(--dado); font-weight: 700;
    font-size: .8rem; color: var(--texto-3);
    font-variant-numeric: tabular-nums;
  }

  /* Conquistado: ganha a cor do metal na borda e um fundo fraco dela. */
  .no.feito {
    background: color-mix(in srgb, var(--metal) 16%, var(--casco));
    border-color: var(--metal);
  }

  .no.feito .no-grau { color: var(--metal); }

  /* O degrau ATUAL -- onde a frente parou. É o único com movimento, e é
     discreto de propósito: é sinalização, não festa. */
  .no.atual {
    border-color: var(--latao-c);
    animation: pulsarNo 2.4s ease-in-out infinite;
  }

  @keyframes pulsarNo {
    0%, 100% { opacity: 1; }
    50%      { opacity: .55; }
  }

  .no.oculta .no-grau { color: var(--texto-3); }

  @media (hover: hover) and (pointer: fine) {
    .no:hover { border-color: var(--latao-c); }
  }

  /* ── A LEGENDA DO NÓ, ao passar o mouse ou tocar ──────────────────────── */
  .no-info {
    position: absolute; bottom: calc(100% + .4rem); left: 50%;
    transform: translateX(-50%);
    width: 13rem; z-index: 20;
    background: var(--casco-2); border: 1px solid var(--linha);
    border-top: 2px solid var(--metal);
    border-radius: var(--r-p); padding: .6rem .7rem;
    text-align: left; pointer-events: none;
    opacity: 0; transition: opacity var(--d-dica) var(--saida);
  }

  /* 🔴 `:focus` e nao `:focus-visible`: NO CELULAR NAO EXISTE HOVER.
     A primeira versao so mostrava a legenda no hover, e o resultado no
     telefone seria uma tela de hexagonos com numeros e nenhuma forma de
     descobrir o que sao. Com `:focus`, tocar o no revela -- e o `tabindex`
     que ja estava la para o teclado serve para isso tambem. */
  .no:hover .no-info, .no:focus .no-info { opacity: 1; }

  .no-info-nome {
    font-family: var(--display); font-weight: 700;
    font-size: .82rem; color: var(--texto); line-height: 1.2; margin-bottom: .2rem;
  }

  .no-info-desc { font-size: .72rem; color: var(--texto-3); line-height: 1.35; }

  .no-info-metal {
    font-family: var(--dado); font-size: .58rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--metal); margin-bottom: .25rem;
  }

  /* ── O RESUMO ─────────────────────────────────────────────────────────── */
  .quadro-resumo {
    display: flex; flex-wrap: wrap; gap: var(--e4);
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--latao);
    border-radius: var(--r-p); padding: var(--e3); margin-bottom: var(--e3);
  }

  .resumo-item { display: grid; gap: .1rem; }

  .resumo-rot {
    font-family: var(--dado); font-size: .6rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-3);
  }

  .resumo-valor {
    font-family: var(--dado); font-weight: 700; font-size: var(--t-lg);
    color: var(--texto); font-variant-numeric: tabular-nums; line-height: 1;
  }

  .legenda {
    display: flex; flex-wrap: wrap; gap: var(--e3);
    font-family: var(--dado); font-size: .62rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--texto-3);
    margin-top: var(--e3);
  }

  .legenda span { display: inline-flex; align-items: center; gap: .35rem; }

  .legenda i {
    width: .6rem; height: .7rem; display: inline-block;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  @media (prefers-reduced-motion: reduce) {
    .no.atual { animation: none; }
  }

  @media (max-width: 768px) {
    /* No telefone a legenda vira uma barra no rodape, em vez de um balao de
       13rem que nao cabe numa tela de 360px e sairia pela lateral. */
    .no-info {
      position: fixed; bottom: 1rem; left: 1rem; right: 1rem;
      top: auto; width: auto; transform: none;
      border-top-width: 3px;
    }

    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
    .quadro { padding: var(--e3) var(--e1) var(--e4); }
    .frente { min-width: 7rem; }
  }
</style>

<script type="module">
  import { supabase, esc, att, exigirSessao, fazerLogout, nomeDoUsuario, relatar }
    from './assets/js/astral.js?v=bfdb6e4b';
  import { carregarProgresso } from './assets/js/estado.js?v=5dab0815';
  import { aplicarDivisa } from './assets/js/divisa.js?v=01156cb1';

  const METAL_COR = {
    bronze: 'var(--brasa)', prata: 'var(--texto-2)',
    ouro: 'var(--latao)', platina: 'var(--papel)',
  };

  function noHTML(no, ehAtual) {
    const cor = METAL_COR[no.metal] || 'var(--linha)';
    const nome = no.oculta ? '???' : no.nome;
    const desc = no.oculta ? 'Condecoração secreta.' : no.descricao;
    const classes = ['no'];
    if (no.conquistada) classes.push('feito');
    if (ehAtual) classes.push('atual');
    if (no.oculta) classes.push('oculta');
    return `
      <div class="${classes.join(' ')}" style="--metal:${att(cor)}" tabindex="0"
           aria-label="${att(nome)} — ${no.conquistada ? 'conquistada' : 'não conquistada'}">
        <span class="no-grau">${no.conquistada ? '◆' : no.degrau}</span>
        <span class="no-info">
          <span class="no-info-metal">${esc(no.metalInfo?.nome || '')}</span>
          <span class="no-info-nome">${esc(nome)}</span>
          <span class="no-info-desc">${esc(desc)}</span>
        </span>
      </div>`;
  }

  function render(quadro) {
    const alvo = document.getElementById('conteudo');
    const r = quadro.resumo;

    alvo.innerHTML = `
      <div class="quadro-resumo">
        <div class="resumo-item">
          <span class="resumo-rot">Condecorações</span>
          <span class="resumo-valor">${r.conquistadas} / ${r.total}</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-rot">Frentes abertas</span>
          <span class="resumo-valor">${r.frentes}</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-rot">Frentes completas</span>
          <span class="resumo-valor">${r.frentesCompletas} / ${r.frentes}</span>
        </div>
      </div>

      <div class="quadro">
        ${quadro.frentes.map((f) => `
          <div class="frente${f.completa ? ' completa' : ''}">
            <div class="frente-cabeca">
              <div class="frente-nome">${esc(f.nome)}</div>
              <div class="frente-conta">${f.feitos} / ${f.total}</div>
            </div>
            ${f.nós.map((no, i) => (i > 0
              ? `<div class="elo${no.conquistada && f.nós[i - 1].conquistada ? ' aceso' : ''}"></div>`
              : '') + noHTML(no, f.atual?.id === no.id)).join('')}
          </div>`).join('')}
      </div>

      <div class="legenda">
        <span><i style="background:var(--brasa)"></i> Bronze</span>
        <span><i style="background:var(--texto-2)"></i> Prata</span>
        <span><i style="background:var(--latao)"></i> Ouro</span>
        <span><i style="background:var(--papel)"></i> Platina</span>
        <span><i style="background:var(--casco);border:1px solid var(--latao-c)"></i> Próximo degrau</span>
        <span>??? Secreta</span>
      </div>`;
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    const uid = sessao.user.id;
    await nomeDoUsuario(sessao);

    const dados = await carregarProgresso(uid);
    aplicarDivisa({
      xp: dados.xp, edital: dados.edital?.nome || dados.edital || '',
      forca: dados.edital?.forca || null,
      patenteInicial: dados.edital?.patenteInicial || null,
      materias: dados.materias, tagEscolhida: dados.tagEscolhida,
    }, esc);

    const { data: fatos, error } = await supabase.rpc('fatos_do_usuario');
    if (error || !fatos) {
      document.getElementById('conteudo').innerHTML =
        '<div class="card"><div class="vazio-texto">Não consegui carregar o quadro agora. Tente recarregar a página.</div></div>';
      if (error) relatar(error, 'arvore/fatos');
      return;
    }

    const [{ conferir }, { montarQuadro }] = await Promise.all([
      import('./assets/js/condecoracoes.js?v=2bfaf79d'),
      import('./assets/js/arvore.js?v=0b7c685b'),
    ]);
    render(montarQuadro(conferir(fatos).condecoracoes));
  })();

  window.fazerLogout = fazerLogout;
</script>
