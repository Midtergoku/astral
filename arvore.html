<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  /* ── O QUADRO DE OPERAÇÕES ────────────────────────────────────────────────
     A imagem que ele mandou como exemplo era uma árvore de talentos de jogo de
     fantasia, e ele pediu explicitamente para NÃO ser daquele jeito. O que se
     mantém é a ESTRUTURA (ramos paralelos, degraus, convergência); o que muda
     é tudo o mais.

     A referência aqui é a mesa onde se planeja uma campanha: fundo de mapa,
     frentes que avançam em paralelo, objetivos ligados por linha. Hexágono em
     vez de círculo porque hexágono é a forma de grade de mapa tático — círculo
     é a forma de qualquer jogo. */

  .quadro {
    display: flex;
    gap: var(--e3);
    align-items: flex-end;        /* todas as frentes partem do chão */
    /* 29/09/2026: sem rolagem lateral -- ele pediu "nao precisa da barrinha
       para arrastar para o lado, apenas centralize". As 8 frentes cabem no
       computador; no celular elas quebram em linhas (flex-wrap). */
    justify-content: center;
    flex-wrap: wrap;
    row-gap: var(--e5);
    padding: var(--e4) var(--e2) var(--e5);
    /* A grade do mapa, fraca o bastante para não competir com os nós. */
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--linha) 40%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--linha) 40%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid var(--linha);
    border-radius: var(--r-g);
  }

  .frente {
    display: flex;
    flex-direction: column-reverse;   /* o degrau 1 fica EMBAIXO */
    align-items: center;
    gap: 0;
    min-width: 6.4rem;
    /* base pequena e crescer: as 8 frentes cabem numa linha no computador.
       Com base de 8,5rem a oitava (Comando) caia sozinha para a linha de baixo. */
    flex: 1 1 6.4rem;
    max-width: 10rem;
  }

  .frente-cabeca {
    order: 1;                          /* com column-reverse, vai para o topo */
    text-align: center;
    padding: 0 var(--e1) var(--e3);
    max-width: 10rem;
  }

  .frente-nome {
    font-family: var(--display); font-weight: 800;
    font-size: var(--t-xs); letter-spacing: .14em; text-transform: uppercase;
    color: var(--texto-2); line-height: 1.25;
  }

  .frente-conta {
    font-family: var(--dado); font-size: .68rem;
    color: var(--texto-3); font-variant-numeric: tabular-nums; margin-top: .15rem;
  }

  .frente.completa .frente-nome { color: var(--latao-c); }

  /* ── O NÓ: uma insígnia (28/09/2026) ─────────────────────────────────────
     Ele: "achei muito simples os simbolos, parece que foi feito no paint".
     Tinha razao, e a causa era tecnica: o hexagono era um QUADRADO recortado
     por clip-path, e o recorte come a borda -- so sobravam os tracos de cima e
     de baixo. E o centro era um losango de texto, igual para tudo.

     Agora cada no e um SVG: aro de metal com brilho (degradê do metal claro ao
     escuro), centro esmaltado escuro e o EMBLEMA DA FRENTE -- como as
     insignias de verdade, que sao metal e esmalte. Nao conquistado: aro
     apagado e o numero do degrau. O proximo degrau: aro tracejado de latao
     e o numero em latao. */
  .no {
    position: relative;
    width: 3.3rem; height: 3.7rem;
    display: grid; place-items: center;
    cursor: help; flex-shrink: 0; outline: none;
  }
  .no svg.insignia { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .insignia .aro   { fill: var(--casco); stroke: var(--linha); stroke-width: 1.5; }
  .insignia .face  { fill: var(--breu); stroke: none; }
  .insignia .brilho { fill: none; stroke: none; }
  .insignia .emblema { fill: none; stroke: var(--texto-3); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }

  .no-grau {
    position: relative;
    font-family: var(--dado); font-weight: 700;
    font-size: .8rem; color: var(--texto-3);
    font-variant-numeric: tabular-nums;
  }

  /* Conquistado: metal e esmalte. */
  .no.feito .aro { fill: var(--grad); stroke: color-mix(in srgb, var(--metal) 55%, var(--breu)); stroke-width: 1; }
  .no.feito .face { fill: color-mix(in srgb, var(--metal) 10%, var(--breu)); stroke: color-mix(in srgb, var(--metal) 45%, var(--breu)); stroke-width: .8; }
  .no.feito .brilho { stroke: color-mix(in srgb, var(--papel) 50%, transparent); stroke-width: .9; }
  .no.feito .emblema { stroke: var(--metal-c); opacity: 1; }
  .no.feito .no-grau { display: none; }
  .no.feito { filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)); }

  /* A ligação com o degrau de baixo. Fica acesa só quando OS DOIS estão
     conquistados -- é o que transforma pontos soltos em caminho percorrido. */
  .elo {
    width: 2px; height: 1rem;
    background: var(--linha);
    flex-shrink: 0;
  }
  .elo.aceso { background: linear-gradient(var(--latao-c), var(--latao)); }

  /* O degrau ATUAL -- onde a frente parou. O unico com movimento, discreto. */
  .no.atual .aro { stroke: var(--latao-c); stroke-dasharray: 3 2.4; stroke-width: 1.4; }
  /* Sem o emblema por baixo: numero sobre emblema apagado ficava embolado. */
  .no.atual .emblema { opacity: 0; }
  .no.atual .no-grau { color: var(--latao-c); }
  .no.atual svg { animation: pulsarNo 2.4s ease-in-out infinite; }
  @keyframes pulsarNo { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

  .no.oculta:not(.feito) .no-grau { color: var(--texto-3); }

  @media (hover: hover) and (pointer: fine) {
    .no:not(.feito):hover .aro { stroke: var(--latao-c); }
    .no.feito:hover { filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)) brightness(1.12); }
  }
  .no:focus-visible .aro { stroke: var(--latao-c); stroke-width: 2; }

  /* 🔴 29/09/2026: o balao ficava ATRAS da insignia de cima. A sombra (filter)
     da insignia conquistada e a animacao do degrau atual criam uma camada
     propria para cada no -- e o no seguinte no HTML e pintado por cima do
     balao do anterior. O no em uso sobe para a camada mais alta. */
  .no:hover, .no:focus, .no:focus-within { z-index: 50; }

  /* O emblema da frente, ao lado do nome, no topo da coluna. */
  .frente-emblema { width: 1.3rem; height: 1.3rem; margin: 0 auto .35rem; display: block;
    fill: none; stroke: var(--texto-3); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .frente.completa .frente-emblema { stroke: var(--latao-c); }

  /* ── A LEGENDA DO NÓ, ao passar o mouse ou tocar ──────────────────────── */
  .no-info {
    position: absolute; bottom: calc(100% + .4rem); left: 50%;
    transform: translateX(-50%);
    width: 13rem; z-index: 20;
    background: var(--casco-2); border: 1px solid var(--linha);
    border-top: 2px solid var(--metal);
    border-radius: var(--r-p); padding: .6rem .7rem;
    text-align: left; pointer-events: none;
    opacity: 0; transition: opacity var(--d-dica) var(--saida);
  }

  /* 🔴 `:focus` e nao `:focus-visible`: NO CELULAR NAO EXISTE HOVER.
     A primeira versao so mostrava a legenda no hover, e o resultado no
     telefone seria uma tela de hexagonos com numeros e nenhuma forma de
     descobrir o que sao. Com `:focus`, tocar o no revela -- e o `tabindex`
     que ja estava la para o teclado serve para isso tambem. */
  .no:hover .no-info, .no:focus .no-info { opacity: 1; }

  .no-info-nome {
    font-family: var(--display); font-weight: 700;
    font-size: .82rem; color: var(--texto); line-height: 1.2; margin-bottom: .2rem;
  }

  .no-info-desc { font-size: .72rem; color: var(--texto-3); line-height: 1.35; }

  .no-info-metal {
    font-family: var(--dado); font-size: .58rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--metal-c, var(--metal)); margin-bottom: .25rem;   /* a clara: a base do bronze da 2,9:1 (04/10, UX-02) */
  }

  /* ── O RESUMO ─────────────────────────────────────────────────────────── */
  .quadro-resumo {
    display: flex; flex-wrap: wrap; gap: var(--e4);
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--latao);
    border-radius: var(--r-p); padding: var(--e3); margin-bottom: var(--e3);
  }

  .resumo-item { display: grid; gap: .1rem; }

  .resumo-rot {
    font-family: var(--dado); font-size: .6rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-3);
  }

  .resumo-valor {
    font-family: var(--dado); font-weight: 700; font-size: var(--t-lg);
    color: var(--texto); font-variant-numeric: tabular-nums; line-height: 1;
  }

  .legenda {
    display: flex; flex-wrap: wrap; gap: var(--e3);
    font-family: var(--dado); font-size: .62rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--texto-3);
    margin-top: var(--e3);
  }

  .legenda span { display: inline-flex; align-items: center; gap: .35rem; }

  .legenda svg { width: .8rem; height: .9rem; }

  @media (prefers-reduced-motion: reduce) {
    .no.atual svg { animation: none; }
  }

  @media (max-width: 768px) {
    /* No telefone a legenda vira uma barra no rodape, em vez de um balao de
       13rem que nao cabe numa tela de 360px e sairia pela lateral. */
    .no-info {
      position: fixed; bottom: 1rem; left: 1rem; right: 1rem;
      top: auto; width: auto; transform: none;
      border-top-width: 3px;
    }

    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
    .quadro { padding: var(--e3) var(--e1) var(--e4); }
    .frente { min-width: 7rem; }
  }
</style>

<script type="module">
  import { supabase, esc, att, exigirSessao, fazerLogout, nomeDoUsuario, relatar }
    from './assets/js/astral.js?v=6073012e';
  import { carregarProgresso, carregarEstatisticas } from './assets/js/estado.js?v=ab647345';
  import { aplicarDivisa } from './assets/js/divisa.js?v=3ebe4901';

  /* Cada metal: a cor base e a clara (brilho e emblema). O degradê de cada
     um e definido UMA vez, no <defs> do quadro. */
  const METAL = {
    bronze:  { cor: 'var(--brasa)',   clara: 'var(--brasa-c)' },
    prata:   { cor: 'var(--texto-2)', clara: 'var(--texto)' },
    ouro:    { cor: 'var(--latao)',   clara: 'var(--latao-c)' },
    platina: { cor: 'color-mix(in srgb, var(--papel) 78%, var(--texto-2))', clara: 'var(--papel)' },
  };

  /* O emblema de cada frente, em traco (24 x 24). */
  const EMBLEMA = {
    tempo:    '<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>',
    marcha:   '<path d="M6 10l6-5 6 5M6 15l6-5 6 5M6 20l6-5 6 5"/>',
    presenca: '<path d="M6 21V3M6 4h11l-2.5 4L17 12H6"/>',
    folego:   '<path d="M2.5 12h4.5l2-5 4 10 2.2-5H21.5"/>',
    volume:   '<circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
    terreno:  '<path d="M2.5 19.5 9 9l4 6 3-4 5.5 8.5z"/><path d="M9 9l1.4 2.2"/>',
    vigilia:  '<path d="M15.5 3.5a8 8 0 1 0 5 12.4 6.5 6.5 0 0 1-5-12.4z"/><path d="M19 4.5v3M17.5 6h3"/>',
    comando:  '<path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/>',
  };

  // Hexagono de ponta para cima, 48 x 54: o aro e a face (esmalte) por dentro.
  const ARO  = '24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25';
  const FACE = '24,7 41.5,17 41.5,37 24,47 6.5,37 6.5,17';
  const BRILHO = 'M8.5 16.2 24 7.3 39.5 16.2';

  function defsDosMetais() {
    return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      ${Object.entries(METAL).map(([k, m]) => `
        <linearGradient id="metal-${k}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color:${m.clara}"/>
          <stop offset=".5" style="stop-color:${m.cor}"/>
          <stop offset="1" style="stop-color:color-mix(in srgb, ${m.cor} 55%, var(--breu))"/>
        </linearGradient>`).join('')}
    </defs></svg>`;
  }

  function noHTML(no, ehAtual, frente) {
    const m = METAL[no.metal] || { cor: 'var(--linha)', clara: 'var(--texto-2)' };
    const cor = m.cor;
    const nome = no.oculta ? '???' : no.nome;
    const desc = no.oculta ? 'Condecoração secreta.' : no.descricao;
    const classes = ['no'];
    if (no.conquistada) classes.push('feito');
    if (ehAtual) classes.push('atual');
    if (no.oculta) classes.push('oculta');
    return `
      <div class="${classes.join(' ')}" style="--metal:${att(cor)};--metal-c:${att(m.clara)};--grad:url(#metal-${att(no.metal || 'ouro')})" tabindex="0"
           aria-label="${att(nome)} — ${no.conquistada ? 'conquistada' : 'não conquistada'}">
        <svg class="insignia" viewBox="0 0 48 54" aria-hidden="true">
          <polygon class="aro" points="${ARO}"/>
          <polygon class="face" points="${FACE}"/>
          <path class="brilho" d="${BRILHO}"/>
          <g class="emblema" transform="translate(13.2 15.8) scale(.9)">${no.oculta && !no.conquistada ? '' : (EMBLEMA[frente] || EMBLEMA.comando)}</g>
        </svg>
        <span class="no-grau">${no.oculta && !no.conquistada ? '?' : no.degrau}</span>
        <span class="no-info">
          <span class="no-info-metal">${esc(no.metalInfo?.nome || '')}</span>
          <span class="no-info-nome">${esc(nome)}</span>
          <span class="no-info-desc">${esc(desc)}</span>
        </span>
      </div>`;
  }

  function render(quadro) {
    const alvo = document.getElementById('conteudo');
    const r = quadro.resumo;

    alvo.innerHTML = `
      <div class="quadro-resumo">
        <div class="resumo-item">
          <span class="resumo-rot">Condecorações</span>
          <span class="resumo-valor">${r.conquistadas} / ${r.total}</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-rot">Frentes abertas</span>
          <span class="resumo-valor">${r.frentes}</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-rot">Frentes completas</span>
          <span class="resumo-valor">${r.frentesCompletas} / ${r.frentes}</span>
        </div>
      </div>

      ${defsDosMetais()}
      <div class="quadro">
        ${quadro.frentes.map((f) => `
          <div class="frente${f.completa ? ' completa' : ''}">
            <div class="frente-cabeca">
              <svg class="frente-emblema" viewBox="0 0 24 24" aria-hidden="true">${EMBLEMA[f.id] || EMBLEMA.comando}</svg>
              <div class="frente-nome">${esc(f.nome)}</div>
              <div class="frente-conta">${f.feitos} / ${f.total}</div>
            </div>
            ${f.nós.map((no, i) => (i > 0
              ? `<div class="elo${no.conquistada && f.nós[i - 1].conquistada ? ' aceso' : ''}"></div>`
              : '') + noHTML(no, f.atual?.id === no.id, f.id)).join('')}
          </div>`).join('')}
      </div>

      <div class="legenda">
        <span><svg viewBox="0 0 48 54" aria-hidden="true"><polygon points="24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25" style="fill:url(#metal-bronze);stroke:none;stroke-width:3"/></svg> Bronze</span>
        <span><svg viewBox="0 0 48 54" aria-hidden="true"><polygon points="24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25" style="fill:url(#metal-prata);stroke:none;stroke-width:3"/></svg> Prata</span>
        <span><svg viewBox="0 0 48 54" aria-hidden="true"><polygon points="24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25" style="fill:url(#metal-ouro);stroke:none;stroke-width:3"/></svg> Ouro</span>
        <span><svg viewBox="0 0 48 54" aria-hidden="true"><polygon points="24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25" style="fill:url(#metal-platina);stroke:none;stroke-width:3"/></svg> Platina</span>
        <span><svg viewBox="0 0 48 54" aria-hidden="true"><polygon points="24,1.5 46.5,14.25 46.5,39.75 24,52.5 1.5,39.75 1.5,14.25" style="fill:var(--casco);stroke:var(--latao-c);stroke-width:3;stroke-dasharray:5 4"/></svg> Próximo degrau</span>
        <span>??? Secreta</span>
      </div>`;
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    const uid = sessao.user.id;
    await nomeDoUsuario(sessao);

    const dados = await carregarProgresso(uid);
    aplicarDivisa({
      xp: dados.xp, edital: dados.edital?.nome || dados.edital || '',
      forca: dados.edital?.forca || null,
      patenteInicial: dados.edital?.patenteInicial || null,
      materias: dados.materias, tagEscolhida: dados.tagEscolhida,
    }, esc);

    // 01/10/2026: os fatos vem da fonte unica de estatisticas (assets/js/estatisticas.js).
    const { data: fatos, error } = await carregarEstatisticas().then((d) => ({ data: d?.fatos ?? null }), (e) => ({ error: e }));
    if (error || !fatos) {
      document.getElementById('conteudo').innerHTML =
        '<div class="card"><div class="vazio-texto">Não consegui carregar o quadro agora. Tente recarregar a página.</div></div>';
      if (error) relatar(error, 'arvore/fatos');
      return;
    }

    const [{ conferir }, { montarQuadro }] = await Promise.all([
      import('./assets/js/condecoracoes.js?v=5c58a996'),
      import('./assets/js/arvore.js?v=43166932'),
    ]);
    /* 30/09/2026 (auditoria, item 11): o Quadro contava SEM as conquistas ja
       gravadas -- 39 aqui, 42 no painel. Conquista nao se desconquista: as
       gravadas entram, como no painel (carregarRPG). */
    const { data: gravadas } = await supabase.rpc('sincronizar_conquistas');
    render(montarQuadro(conferir(fatos, gravadas || null).condecoracoes));
  })();

  window.fazerLogout = fazerLogout;
</script>
<script type="module" src="/assets/js/menu.js?v=16951915"></script>
</body>
</html>
