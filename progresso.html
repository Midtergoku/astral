<style>

/* ── MAIN ── */

/* ── GRID E CARDS ── */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

.card.stat-purple { border-top: 2px solid var(--purple); }

.card.stat-green  { border-top: 2px solid var(--green);  }

.card.stat-gold   { border-top: 2px solid var(--gold);   }

.section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

.section-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: var(--t-md);
      color: var(--white);
    }

/* ── PROGRESSO POR MATÉRIA ── */
    .materia-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

.materia-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--surface2);
      padding: 1.25rem;
      border-radius: var(--r-g);
      border: 1px solid var(--border);
    }

.materia-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

.materia-nome {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
    }

.materia-pct {
      font-size: 0.9rem;
      color: var(--purple-lt);
      font-weight: 700;
    }

.mat-bar {
      background: var(--border);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

.mat-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--purple), var(--purple-lt));
      transition: width 0.6s ease;
    }

.materia-footer {
      display: flex;
      align-items: center;
      margin-top: 0.4rem;
    }

/* ── TAGS DE STATUS ── */
    .status-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
    }

.tag-iniciado  { background: rgba(107,107,128,0.15); color: var(--muted); }

.tag-progresso { background: color-mix(in srgb, var(--latao) 15%, transparent); color: var(--purple-lt); }

.tag-quase-la  { background: color-mix(in srgb, var(--latao-c) 15%, transparent); color: var(--gold); }

.tag-dominado  { background: color-mix(in srgb, var(--oliva-c) 15%, transparent); color: var(--green); }

.tag-nenhum    { background: rgba(107,107,128,0.1); color: var(--muted); opacity: 0.6; }

.btn-upload:hover { opacity: 0.87; transform: translateY(-1px); }

@media (max-width: 1100px) {
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }

@media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; padding: 1.25rem; }
      .grid-3 { grid-template-columns: 1fr; }
    }

/* 03/10/2026 (auditoria CRO-02, roadmap 2.3): aqui havia o botao
   "Rebalancear cronograma" e a janela de sugestoes. O botao gravava um
   cronograma que o painel nunca lia -- dizia "rebalanceado!" e nada mudava.
   O cronograma ja se ajusta sozinho toda segunda (decisao dele, 30/09); o
   botao virou a explicacao disso, com o caminho para ver a semana. */
.btn-tentar { margin-top: var(--e3); min-height: 44px; padding: 10px 18px; border-radius: var(--r-p); border: 1px solid var(--latao); background: var(--latao); color: var(--breu); font: inherit; font-weight: 600; cursor: pointer; }
.nota-ajuste {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--texto-2);
  font-family: var(--corpo);
  font-size: var(--t-sm);
  text-decoration: none;
  padding: 0.5rem 0;
}
.nota-ajuste b { color: var(--latao-c); font-weight: 600; }
@media (hover: hover) { .nota-ajuste:hover b { text-decoration: underline; } }

/* animacao de entrada do .main removida: o elemento tem
     view-transition-name e quem o anima e o navegador. Ter as duas fazia
     a tela piscar na troca de pagina. */

/* ── DIÁRIO DE CAMPANHA (R7) ───────────────────────────────────────────
   Linha do tempo com um fio vertical: cada dia é um ponto no fio. A forma
   importa aqui — uma lista de cartões soltos seria um relatório; o fio é o
   que faz virar história, porque mostra que os dias se ligam. */
    .diario-lista {
      display: grid;
      gap: 0;
      border-left: 1px solid var(--linha);
      margin-left: 0.4rem;
      padding-left: 1.4rem;
    }

.diario-dia { position: relative; padding: 0.9rem 0 1rem; }

.diario-dia + .diario-dia { border-top: 1px solid color-mix(in srgb, var(--linha) 55%, transparent); }

/* O ponto no fio. Quem tem marco ganha ponto de latão e maior — é o que
   deixa a pessoa achar os dias importantes correndo o olho. */
    .diario-dia::before {
      content: '';
      position: absolute;
      left: -1.78rem;
      top: 1.25rem;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--linha);
      border: 2px solid var(--breu);
    }

.diario-dia.marcado::before {
      background: var(--latao);
      width: 9px; height: 9px;
      left: -1.84rem;
    }

.diario-topo {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.2rem;
    }

.diario-data {
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--texto);
    }

.diario-linha {
      font-family: var(--dado);
      font-size: var(--t-xs);
      color: var(--texto-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

.diario-resumo { font-size: 0.84rem; color: var(--texto-2); line-height: 1.4; }

.diario-marco {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      margin-top: 0.45rem;
      font-size: 0.82rem;
      color: var(--latao-c);
      line-height: 1.35;
    }

.diario-marco::before {
      content: '◆';
      font-size: 0.6rem;
      color: var(--latao);
      flex-shrink: 0;
    }

/* 30/09/2026: a revisao espacada no dia em que a materia foi estudada. */
.diario-revisao {
      display: flex; align-items: baseline; gap: 0.45rem;
      margin-top: 0.45rem; font-size: 0.82rem; line-height: 1.35;
      color: var(--brasa-c);
    }
.diario-revisao::before { content: '↻'; font-size: 0.8rem; flex-shrink: 0; }
.diario-revisao.feita { color: var(--oliva-c); }

.diario-vazio {
      color: var(--muted);
      font-size: 0.86rem;
      padding: 1.5rem 0;
    }

@media (max-width: 768px) {
      .diario-topo { flex-direction: column; gap: 0.15rem; }
    }

/* ── GRAFICOS EM PE (28/09/2026) ─────────────────────────────────────────────
   Ele: "os graficos eu nao gostei, acho que eu queria um estilo de grafico
   melhor e em pe". Eram barras deitadas, uma por linha, com etiqueta.
   Agora sao colunas: uma serie so, uma cor so (latao), sem legenda -- o
   titulo diz o que e. Valor no topo de cada coluna, grade recessiva, e o
   detalhe aparece ao passar o mouse ou focar com o teclado. */
.grafico { margin-bottom: var(--e4); }
/* 09/10/2026 (roadmap 3.27): as materias do edital, estudada ou nao, e os assuntos de cada uma */
.edital-lista { list-style: none; margin: var(--e3) 0 0; padding: 0; display: grid; gap: var(--e2); }
.edital-materia { border: 1px solid var(--linha); border-radius: var(--r-p); background: var(--casco-2); }
.edital-materia > summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem;
  align-items: center; padding: .7rem .8rem; min-height: 44px;
}
.edital-materia > summary::-webkit-details-marker { display: none; }
.edital-materia .nome { font-family: var(--display); font-weight: 700; font-size: .92rem; color: var(--texto); min-width: 0; overflow-wrap: anywhere; }
.edital-materia .pct { font-family: var(--dado); font-size: var(--t-sm); color: var(--latao-c); font-variant-numeric: tabular-nums; }
.edital-materia .info { grid-column: 2 / 4; font-size: var(--t-xs); color: var(--texto-3); }
.marca-estudo { width: 12px; height: 12px; border-radius: var(--r-p); border: 2px solid var(--linha); flex-shrink: 0; }
.marca-estudo.ok { background: var(--latao); border-color: var(--latao); }
.edital-assuntos { list-style: none; margin: 0; padding: 0 .8rem .7rem 2.2rem; display: grid; gap: .35rem; }
.edital-assuntos li { display: flex; align-items: baseline; gap: .55rem; font-size: var(--t-sm); color: var(--texto-2); }
.edital-assuntos li .marca-estudo { width: 9px; height: 9px; align-self: center; }
.edital-assuntos li.visto { color: var(--texto); }
.edital-assuntos .conta { margin-left: auto; font-family: var(--dado); font-size: var(--t-xs); color: var(--texto-3); white-space: nowrap; }
.edital-sem { margin: 0; padding: 0 .8rem .7rem 2.2rem; font-size: var(--t-xs); color: var(--texto-3); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grafico-topo { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3); flex-wrap: wrap; }
.grafico-sub { font-size: .82rem; color: var(--texto-3); margin-top: .2rem; }
/* padding em cima: a rolagem lateral CORTA o que passa do topo -- o rotulo
   "100%" do eixo e o valor de uma coluna cheia sumiam. */
.gb-rolagem { overflow-x: auto; margin-top: var(--e3); padding: 1.6rem 0 .25rem; }
.gb { min-width: calc(var(--n) * 3.6rem + 2.6rem); }
.gb-plano { position: relative; height: 15rem; margin-left: 2.6rem; border-bottom: 1px solid var(--linha); }
.gb-grade {
  position: absolute; left: 0; right: 0; height: 0;
  border-top: 1px solid color-mix(in srgb, var(--linha) 55%, transparent);
}
.gb-grade span {
  position: absolute; right: calc(100% + .5rem); top: -.5rem;
  font-family: var(--dado); font-size: .66rem; color: var(--texto-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.gb-guia {
  position: absolute; left: 0; right: 0; height: 0; z-index: 1;
  border-top: 1px dashed color-mix(in srgb, var(--latao-c) 70%, transparent);
}
.gb-guia span {
  position: absolute; right: 0; top: -1.15rem;
  font-family: var(--dado); font-size: .66rem; color: var(--latao-c); white-space: nowrap;
}
.gb-colunas { position: absolute; inset: 0; display: flex; align-items: flex-end; }
.gb-col {
  position: relative; flex: 1; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  outline: none;
}
.gb-valor {
  font-family: var(--dado); font-size: .72rem; color: var(--texto-2);
  font-variant-numeric: tabular-nums; margin-bottom: .3rem;
  /* 30/09/2026 (auditoria, item 25): o "64%" de uma barra perto de 70 ficava
     embaixo da linha tracejada. O rotulo passa por cima dela, com fundo. */
  position: relative; z-index: 2; background: var(--casco); padding: 0 .25rem; border-radius: var(--r-p);
}
.gb-barra {
  width: min(2.6rem, 62%); height: var(--h); min-height: 2px;
  background: var(--latao); border-radius: var(--r-p) var(--r-p) 0 0;
  transform-origin: bottom;
  animation: gb-sobe 460ms var(--saida) backwards;
  animation-delay: calc(var(--i) * 40ms);
  transition: background-color var(--d-dica) var(--saida);
}
.gb-barra.forte { background: var(--latao-c); }
.gb-barra.fraca { background: color-mix(in srgb, var(--latao) 55%, var(--casco-2)); }
@keyframes gb-sobe { from { transform: scaleY(.04); opacity: .4; } to { transform: none; opacity: 1; } }
.gb-dica {
  position: absolute; bottom: calc(var(--h) + 2.2rem); left: 50%; z-index: 3;
  transform: translate(-50%, 4px); opacity: 0; pointer-events: none;
  background: var(--casco-2); border: 1px solid var(--linha); border-radius: var(--r-p);
  padding: .5rem .65rem; min-width: 9rem; text-align: left;
  font-size: .76rem; line-height: 1.45; color: var(--texto-2);
  box-shadow: 0 12px 28px -14px rgba(0,0,0,.9);
  transition: opacity var(--d-dica) var(--saida), transform var(--d-dica) var(--saida);
}
.gb-dica b { display: block; font-family: var(--display); color: var(--papel); font-size: .82rem; margin-bottom: .15rem; }
.gb-col:focus-visible .gb-dica { opacity: 1; transform: translate(-50%, 0); }
.gb-col:focus-visible .gb-barra { background: var(--latao-c); }
@media (hover: hover) and (pointer: fine) {
  .gb-col:hover .gb-dica { opacity: 1; transform: translate(-50%, 0); }
  .gb-col:hover .gb-barra { background: var(--latao-c); }
}
.gb-rotulos { display: flex; margin-left: 2.6rem; margin-top: .5rem; }
.gb-rotulo { flex: 1; min-width: 0; text-align: center; padding: 0 .15rem; }
.gb-rotulo span { display: block; font-size: .74rem; color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-rotulo small { display: block; font-family: var(--dado); font-size: .64rem; color: var(--texto-3); margin-top: .1rem; }
.gb-tabela { margin-top: var(--e3); }
.gb-tabela summary { cursor: pointer; font-size: .8rem; color: var(--texto-3); padding-block: .4rem; margin-block: -.4rem;   /* area de toque >= 24 px sem mexer na pagina (04/10, UX-08) */ }
.gb-tabela table { width: 100%; border-collapse: collapse; margin-top: var(--e2); font-size: .84rem; }
.gb-tabela th { text-align: left; font-family: var(--dado); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-3); font-weight: 400; padding: .4rem .3rem; border-bottom: 1px solid var(--linha); }
.gb-tabela td { padding: .5rem .3rem; border-bottom: 1px solid color-mix(in srgb, var(--linha) 55%, transparent); color: var(--texto-2); }
.gb-tabela td.medida { font-size: var(--t-xs); color: var(--texto-3); line-height: 1.35; }
/* A tabela ganhou a coluna "como foi medido": no celular ela rola, nao espreme. */
.gb-tabela { overflow-x: auto; }
.gb-tabela table { min-width: 34rem; }
.gb-tabela td.num { font-family: var(--dado); text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  .gb-barra { animation: none; }
  .gb-dica { transition: none; }
}
</style>

      Minha conta
    </a>
    <button class="btn-logout" onclick="fazerLogout()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
<div class="topbar">
  <div>
    <div class="page-title">Cobertura do edital</div>
    <div class="page-sub">Seu avanço matéria por matéria</div>
      <div class="topbar-right"><span class="divisa-topo" data-divisa></span></div>
  </div>
  <a class="nota-ajuste" href="cronograma.html">

  </a>
</div>

  <div id="content-area">
    <!-- Renderizado pelo JS -->
  </div>

  <!-- ── DIÁRIO DE CAMPANHA (R7) ────────────────────────────────────────
       Fica aqui, e não no dashboard, porque é leitura: o dashboard responde
       "o que faço agora" e esta página responde "de onde eu vim". São modos
       de atenção diferentes, e misturar os dois estraga os dois. -->
  <div id="diario" style="margin-top:2.5rem" hidden>
    <div class="section-header" style="display:flex;align-items:baseline;justify-content:space-between;gap:1rem;">
      <div>
        <div class="section-title">Diário de campanha</div>
        <div style="font-size:0.82rem;color:var(--muted);" id="diario-sub"></div>
      </div>
    </div>
    <div class="diario-lista" id="diario-lista"></div>
  </div>

</main>

<script type="module">
  import { supabase, esc, att, escJs, urlSegura, exigirSessao, fazerLogout, nomeDoUsuario, chamarIA, toast, relatar, pintarSeloDoPlano }
    from './assets/js/astral.js?v=224dc907';
  import { carregarProgresso, carregarEstatisticas, ultimasSemanas, progressoIndisponivel } from './assets/js/estado.js?v=ab647345';
  import { duracao, duracaoSeg, duracaoHoras } from './assets/js/formato.js?v=98782d1d';

  let estado = {
    usuario: null,
    perfil: null,
    materias: [],
    edital: null,
  };

  async function init() {
    const session = await exigirSessao();
    if (!session) return;

    estado.usuario = session.user;

    // Busca perfil.
    // O erro NAO pode ser ignorado: sem perfil, ehCompleto() devolve false e a
    // tela mostra FREE para quem e beta ou pro. O servidor continua sendo o
    // portao de verdade, entao nao ha furo de acesso -- mas o usuario ve o
    // plano errado e nao entende por que. Antes de 15/09/2026 isso falhava em
    // silencio: nem toast, nem linha em erros_cliente.
    const { data: perfil, error: erroPerfil } = await supabase
      .from('perfis')
      .select('*')
      .eq('id', session.user.id)
      .single();

    if (erroPerfil) {
      relatar(erroPerfil, 'carregar perfil');
      toast('Não consegui carregar o seu plano agora. A tela pode mostrar o plano errado até recarregar.', 'error');
    }

    estado.perfil = perfil;

    // Progresso vem da conta. Guardo o objeto inteiro porque o rebalanceamento
    // reescreve o cronograma e precisa devolver tudo, nao so a parte alterada.
    estado.progresso = await carregarProgresso(session.user.id);
    /* 03/10/2026 (auditoria UX-01): o progresso nao veio -- antes a tela ficava
       so com o aviso de plano e nada mais. Agora diz o que houve e que nada
       se perdeu, sem desenhar matérias zeradas. */
    if (progressoIndisponivel(session.user.id)) {
      document.getElementById('content-area').innerHTML = `<div class="card" role="alert"><div class="section-title">Não consegui carregar os seus dados agora</div>
        <p class="section-sub">Eles estão guardados na sua conta — nada se perdeu. Pode ser a sua internet ou o servidor por um instante.</p>
        <button type="button" class="btn-tentar" onclick="location.reload()">Tentar de novo</button></div>`;
      return;
    }
    estado.materias  = estado.progresso.materias;
    estado.edital    = estado.progresso.edital;

    renderUI();

    /* O diário busca sozinho e não segura a tela: se falhar, o progresso por
       matéria — que é o que a pessoa veio ver — já está desenhado. */
    desenharDiario(session.user.id).catch((e) => relatar(e, 'progresso/diario'));
  }

  /* ── O DIÁRIO DE CAMPANHA ───────────────────────────────────────────────
     Lê as sessões cruas e deixa o `diario.js` narrar. A leitura é direta da
     tabela porque a RLS já filtra por quem está logado, e porque o diário
     precisa das sessões UMA A UMA — os agregados do servidor não servem aqui:
     é justamente a sequência dos dias que vira a história. */
  async function desenharDiario(uid) {
    const caixa = document.getElementById('diario');
    if (!caixa) return;

    /* 01/10/2026: da FONTE UNICA de estatisticas (assets/js/estatisticas.js):
       as sessoes dos ultimos 400 dias, cada uma com o dia ja calculado no
       servidor. Antes era uma consulta propria de 120 dias / 500 sessoes -- e
       os marcos ("primeira vez em...", recordes) eram recontados so dentro
       dessa janela. O diario continua mostrando os 30 dias de estudo mais
       recentes. */
    let est;
    try { est = await carregarEstatisticas(); }
    catch (error) { relatar(error, 'progresso/diario'); return; }
    const data = est?.sessoes || [];
    desenharSemanas(est);
    desenharMateriasDoEdital();
    if (!data.length) return;              // sem histórico, sem diário

    const [{ montarDiario, resumoDoDiario }, { revisoesDeHoje }] = await Promise.all([
      import('./assets/js/diario.js?v=0fd41147'),
      import('./assets/js/revisao.js?v=8dc9030c'),
    ]);
    const dias = montarDiario(data, 30);
    if (!dias.length) return;

    /* 30/09/2026 -- a revisao espacada, ligada ao diario como ele pediu: o dia
       em que a materia foi estudada ganha a linha "revisar hoje" (1, 7 e 30
       dias depois). Mesma regra do cartao do painel: assets/js/revisao.js. */
    const revisoes = revisoesDeHoje(data, est?.hoje?.dia);
    const revisaoNoDia = new Map();
    for (const rv of revisoes) {
      if (!revisaoNoDia.has(rv.estudadaEm)) revisaoNoDia.set(rv.estudadaEm, []);
      revisaoNoDia.get(rv.estudadaEm).push(rv);
    }

    const r = resumoDoDiario(dias);
    document.getElementById('diario-sub').textContent =
      // 30/09/2026 (auditoria, item 15): sao os ULTIMOS 30 DIAS DE ESTUDO, nao os
      // ultimos 30 dias do calendario -- a Disciplina usa a outra janela.
      `${r.dias} ${r.dias === 1 ? 'dia de estudo' : 'dias de estudo'} (os mais recentes) · ${duracaoHoras(r.horas)}`
      + (r.marcos ? ` · ${r.marcos} ${r.marcos === 1 ? 'marco' : 'marcos'}` : '')
      + (revisoes.length ? ` · ${revisoes.filter((x) => !x.feita).length} ${revisoes.filter((x) => !x.feita).length === 1 ? 'revisão' : 'revisões'} para hoje` : '');

    document.getElementById('diario-lista').innerHTML = dias.map((d) => `
      <div class="diario-dia${d.marcos.length ? ' marcado' : ''}">
        <div class="diario-topo">
          <span class="diario-data">${esc(d.titulo)}</span>
          <span class="diario-linha">${esc(d.linha)}</span>
        </div>
        <div class="diario-resumo">${esc(d.resumo)}</div>
        ${d.marcos.map((m) => `<div class="diario-marco">${esc(m.texto)}</div>`).join('')}
        ${(revisaoNoDia.get(d.dia) || []).map((rv) => `<div class="diario-revisao${rv.feita ? ' feita' : ''}">${rv.feita ? `${esc(rv.materia)}: revisada hoje ✓` : `Revisar ${esc(rv.materia)} hoje — ${rv.haDias === 1 ? 'foi ontem' : `faz ${rv.haDias} dias`}`}</div>`).join('')}
      </div>`).join('');

    caixa.hidden = false;
  }


  /* ── BARRAS EM PE ─────────────────────────────────────────────────────────
     Uma peca so para os dois graficos da pagina. `itens`: { rotulo, sub,
     valor (0..max), texto (o que vai no topo), dica (html ja escapado),
     tom: 'forte' | 'fraca' | '' }. `guia`: linha tracejada de referencia. */
  function barrasEmPe({ itens, max, marcas, formatoMarca, guia }) {
    const pct = (v) => Math.max(0, Math.min(100, (v / (max || 1)) * 100));
    return `
      <div class="gb-rolagem">
        <div class="gb" style="--n:${itens.length}">
          <div class="gb-plano">
            ${marcas.map((m) => `<div class="gb-grade" style="bottom:${pct(m)}%"><span>${formatoMarca(m)}</span></div>`).join('')}
            ${guia ? `<div class="gb-guia" style="bottom:${pct(guia.valor)}%"><span>${esc(guia.texto)}</span></div>` : ''}
            <div class="gb-colunas">
              ${itens.map((it, i) => `
                <div class="gb-col" tabindex="0" style="--h:${pct(it.valor)}%;--i:${i}" aria-label="${att(it.rotulo)}: ${att(it.texto)}">
                  <div class="gb-dica" role="tooltip">${it.dica}</div>
                  <div class="gb-valor">${esc(it.texto)}</div>
                  <div class="gb-barra ${it.tom || ''}"></div>
                </div>`).join('')}
            </div>
          </div>
          <div class="gb-rotulos">
            ${itens.map((it) => `<div class="gb-rotulo" title="${att(it.rotulo)}"><span>${esc(it.rotulo)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`).join('')}
          </div>
        </div>
      </div>`;
  }

  const SITUACAO = (p) => p >= 90 ? 'Dominado' : p >= 70 ? 'Quase lá' : p >= 30 ? 'Em progresso' : p > 0 ? 'Iniciado' : 'Não iniciado';

  /* 30/09/2026: o dominio e MEDIDO pelo servidor (migration 20260930120000).
     A pessoa tem de poder ver de onde saiu cada numero -- senao ele e so mais
     uma barra. Devolve texto puro; quem chama escapa. */
  const horasTxt = duracao;                  // 01/10/2026: formato unico (assets/js/formato.js)
  function comoMedido(m) {
    const d = m?.medida;
    if (!d) return '';
    if (d.fonte === 'estudo') return `Só pelo estudo, até 70% (o Banco ainda não tem questões desta matéria) · ${horasTxt(d.minutos)} estudadas`;
    const partes = [`${d.de_primeira} de ${d.respondidas} acertadas de primeira no Banco`, `${horasTxt(d.minutos)} de estudo`];
    if (d.alvo && d.respondidas < d.alvo) partes.push(`responda mais ${d.alvo - d.respondidas} para a medida valer inteira`);
    return partes.join(' · ');
  }
  const hm = duracaoSeg;                     // 01/10/2026: formato unico (era "90h00")

  /* Horas por semana, das 8 ultimas -- das sessoes gravadas no servidor. */
  /* 09/10/2026 (roadmap 3.27, pedido dele): "uma lista das materias para sinalizar se ja foram
     estudadas ou nao (...) com as materias e as submaterias dela". Submateria = os ASSUNTOS que
     o Banco tem para a materia. Estudada = tem tempo de estudo ou questao respondida; assunto
     visto = respondeu ao menos uma questao dele. So contagens vem do servidor (materias_estudadas). */
  async function desenharMateriasDoEdital() {
    const caixa = document.getElementById('g-edital');
    if (!caixa) return;
    const { data, error } = await supabase.rpc('materias_estudadas');
    if (error) { relatar(error, 'progresso/materias_estudadas'); return; }
    if (!Array.isArray(data) || !data.length) return;
    const estudada = (m) => (m.minutos || 0) > 0 || (m.respondidas || 0) > 0;
    const feitas = data.filter(estudada).length;
    const marca = (ok, rotulo) => `<span class="marca-estudo${ok ? ' ok' : ''}" aria-hidden="true"></span><span class="vh">${rotulo}</span>`;
    caixa.innerHTML = `
      <div class="section-header" style="margin-bottom:0">
        <div>
          <div class="section-title">Matérias do edital</div>
          <div class="grafico-sub"><strong>${feitas} de ${data.length}</strong> ${data.length === 1 ? 'matéria já estudada' : 'matérias já estudadas'}. Toque numa matéria para ver os assuntos dela no Banco.</div>
        </div>
      </div>
      <ul class="edital-lista">${data.map((m) => {
        const ok = estudada(m);
        const assuntos = Array.isArray(m.assuntos) ? m.assuntos : [];
        const vistos = assuntos.filter((a) => a.respondidas > 0).length;
        const partes = ok
          ? [m.minutos > 0 ? hm(m.minutos * 60) : null, m.respondidas > 0 ? `${m.respondidas} ${m.respondidas === 1 ? 'questão' : 'questões'}` : null]
          : ['ainda não estudada'];
        if (assuntos.length) partes.push(`${vistos} de ${assuntos.length} assuntos`);
        const dentro = assuntos.length
          ? `<ul class="edital-assuntos">${assuntos.map((a) => `<li class="${a.respondidas > 0 ? 'visto' : ''}">
              ${marca(a.respondidas > 0, a.respondidas > 0 ? 'assunto já visto' : 'assunto ainda não visto')}<span>${esc(a.nome)}</span>
              <span class="conta">${a.respondidas > 0 ? `${a.respondidas} de ${a.acervo}` : `${a.acervo} no Banco`}</span></li>`).join('')}</ul>`
          : '<p class="edital-sem">Esta matéria ainda não tem questões no Banco: o progresso dela vem do tempo de estudo.</p>';
        return `<li><details class="edital-materia">
          <summary>${marca(ok, ok ? 'estudada' : 'ainda não estudada')}<span class="nome">${esc(m.nome)}</span>
            <span class="pct">${Math.round(Number(m.dominio) || 0)}%</span>
            <span class="info">${partes.filter(Boolean).map(esc).join(' · ')}</span></summary>
          ${dentro}</details></li>`;
      }).join('')}</ul>`;
    caixa.hidden = false;
  }

  function desenharSemanas(est) {
    const caixa = document.getElementById('g-semanas');
    if (!caixa) return;
    // 01/10/2026: as 8 semanas (segunda a domingo) vem da fonte unica, pelo dia
    // de cada sessao calculado no servidor -- antes, pela meia-noite do aparelho.
    // semanas[7] e a semana atual; semanas[0], sete semanas antes.
    const semanas = ultimasSemanas(est, 8);
    if (!semanas.some((w) => w.seg > 0)) return;
    const maxH = Math.max(1, Math.ceil(Math.max(...semanas.map((w) => w.seg / 3600)) / 2) * 2);
    const marcas = [0, maxH / 2, maxH];
    const ddmm = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    const total = semanas.reduce((a, w) => a + w.seg, 0);
    caixa.innerHTML = `
      <div class="grafico-topo">
        <div>
          <div class="section-title">Horas por semana</div>
          <div class="grafico-sub">As últimas 8 semanas · ${hm(total)} no total · a coluna clara é a semana atual</div>
        </div>
      </div>
      ${barrasEmPe({
        max: maxH, marcas, formatoMarca: (m) => `${m}h`,
        itens: semanas.map((w, k) => ({
          rotulo: k === 7 ? 'esta semana' : ddmm(w.ini),
          valor: w.seg / 3600,
          texto: w.seg ? hm(w.seg) : '—',
          tom: k === 7 ? 'forte' : '',
          dica: `<b>Semana de ${ddmm(w.ini)}</b>${hm(w.seg)} de estudo<br>${w.n} ${w.n === 1 ? 'sessão' : 'sessões'}`,
        })),
      })}`;
    caixa.hidden = false;
  }

  function getStatusTag(pct) {
    if (pct >= 90) return `<span class="status-tag tag-dominado">Dominado</span>`;
    if (pct >= 70) return `<span class="status-tag tag-quase-la">Quase lá</span>`;
    if (pct >= 30) return `<span class="status-tag tag-progresso">Em progresso</span>`;
    if (pct > 0)   return `<span class="status-tag tag-iniciado">Iniciado</span>`;
    return `<span class="status-tag tag-nenhum">Não iniciado</span>`;
  }

  function renderUI() {
    const nome = estado.perfil?.nome
      || estado.usuario?.user_metadata?.full_name
      || estado.usuario?.email?.split('@')[0]
      || 'Concurseiro';

    const primeiroNome = nome.split(' ')[0];
    const elName = document.getElementById('user-name');
    const elAvatar = document.getElementById('user-avatar');
    if(elName) elName.textContent = primeiroNome;
    if(elAvatar) elAvatar.textContent = primeiroNome[0].toUpperCase();

    // Plano: num lugar so (assets/js/astral.js, 01/10/2026).
    pintarSeloDoPlano(estado.perfil);

    const contentArea = document.getElementById('content-area');

    if (!estado.edital || !estado.materias.length) {
      contentArea.innerHTML = `
        <div style="position:relative; margin-top:1rem;">
          <div style="filter:blur(4px);pointer-events:none;opacity:0.3;">
            <div class="grid-3" style="margin-bottom:2rem;">
              <div class="card stat-purple"><div class="card-label">Total de matérias</div><div class="card-value">12</div></div>
              <div class="card stat-gold"><div class="card-label">Mais de 50%</div><div class="card-value">4</div></div>
              <div class="card stat-green"><div class="card-label">Média geral</div><div class="card-value">28%</div></div>
            </div>
            <div class="card">
              <div class="materia-list">
                <div class="materia-row"><div class="materia-label"><span class="materia-nome">Português</span><span class="materia-pct">40%</span></div><div class="mat-bar"><div class="mat-fill" style="width:40%"></div></div><div class="materia-footer"><span class="status-tag tag-progresso">Em progresso</span></div></div>
                <div class="materia-row"><div class="materia-label"><span class="materia-nome">Matemática</span><span class="materia-pct">20%</span></div><div class="mat-bar"><div class="mat-fill" style="width:20%"></div></div><div class="materia-footer"><span class="status-tag tag-iniciado">Iniciado</span></div></div>
              </div>
            </div>
          </div>
          <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
            <div style="font-size:2rem;margin-bottom:1rem;"><i data-icone="grafico"></i></div>
            <div style="font-family:var(--display);font-weight:700;font-size:var(--t-lg);color:var(--white);margin-bottom:0.5rem;">Suba seu edital para ver seu progresso</div>
            <div style="color:var(--muted);font-size:0.9rem;max-width:300px;line-height:1.5;">Volte ao Dashboard e faça o upload do seu edital para liberar esta página.</div>
            <button class="btn-upload" style="margin-top:1.5rem;" onclick="window.location.href='dashboard.html'">Ir para o Dashboard</button>
          </div>
        </div>
      `;
      return;
    }

    const totalMaterias = estado.materias.length;
    /* 30/09/2026 (auditoria, itens 6 e 23): o cartao dizia "Mais de 50%" e
       contava >= 50 (Legislacao em 50 entrava). Agora o texto diz o que conta.
       E a media ganha a versao PONDERADA pelo peso do edital -- o produto
       inteiro gira em torno de peso, e a media simples trata 5% e 20% igual. */
    const dom = (m) => Number(m.progresso) || 0;
    const matMais50 = estado.materias.filter(m => dom(m) >= 50).length;
    const somaProgresso = estado.materias.reduce((acc, m) => acc + dom(m), 0);
    const media = totalMaterias > 0 ? Math.round(somaProgresso / totalMaterias) : 0;
    const somaPeso = estado.materias.reduce((acc, m) => acc + (Number(m.peso) || 0), 0);
    const ponderada = somaPeso > 0
      ? Math.round(estado.materias.reduce((acc, m) => acc + dom(m) * (Number(m.peso) || 0), 0) / somaPeso)
      : media;

    contentArea.innerHTML = `
      <!-- STATS -->
      <div class="grid-3" style="margin-bottom:2.5rem;">
        <div class="card stat-purple">
          <div class="card-label">Total de matérias</div>
          <div class="card-value">${totalMaterias}</div>
          <div class="card-sub">do seu edital</div>
        </div>
        <div class="card stat-gold">
          <div class="card-label">50% ou mais</div>
          <div class="card-value">${matMais50}</div>
          <div class="card-sub">matérias avançadas</div>
        </div>
        <div class="card stat-green">
          <div class="card-label">Domínio pelo peso</div>
          <div class="card-value">${ponderada}%</div>
          <div class="card-sub">a mesma conta da Doutrina e das medalhas · média simples: ${media}%</div>
        </div>
      </div>

      <!-- DOMINIO POR MATERIA -- em pe, pedido dele em 28/09/2026 -->
      <section class="card grafico">
        <div class="grafico-topo">
          <div>
            <div class="section-title">Domínio por matéria</div>
            <div class="grafico-sub">Medido pelas questões do Banco que você acerta de primeira (60%) e pelo seu tempo de estudo (40%). Na ordem de peso no edital; acima de 70%, a matéria vira tag de especialista.</div>
          </div>
        </div>
        ${barrasEmPe({
          max: 100, marcas: [0, 25, 50, 75, 100], formatoMarca: (m) => `${m}%`,
          guia: { valor: 70, texto: '70% · tag' },
          itens: [...estado.materias].sort((a, b) => (Number(b.peso) || 0) - (Number(a.peso) || 0)).map((m) => ({
            rotulo: m.nome,
            sub: m.peso ? `peso ${m.peso}%` : '',
            valor: Number(m.progresso) || 0,
            texto: `${Number(m.progresso) || 0}%`,
            tom: (Number(m.progresso) || 0) >= 70 ? 'forte' : '',
            dica: `<b>${esc(m.nome)}</b>Domínio ${Number(m.progresso) || 0}%<br>Peso no edital ${Number(m.peso) || 0}%<br>${SITUACAO(Number(m.progresso) || 0)}${comoMedido(m) ? `<br>${esc(comoMedido(m))}` : ''}`,
          })),
        })}
        <details class="gb-tabela">
          <summary>Ver em tabela</summary>
          <table>
            <thead><tr><th>Matéria</th><th style="text-align:right">Peso</th><th style="text-align:right">Domínio</th><th>Situação</th><th>Como foi medido</th></tr></thead>
            <tbody>
              ${[...estado.materias].sort((a, b) => (Number(b.peso) || 0) - (Number(a.peso) || 0)).map((m) => `
                <tr><td>${esc(m.nome)}</td><td class="num">${Number(m.peso) || 0}%</td><td class="num">${Number(m.progresso) || 0}%</td><td>${getStatusTag(Number(m.progresso) || 0)}</td><td class="medida">${esc(comoMedido(m))}</td></tr>`).join('')}
            </tbody>
          </table>
        </details>
      </section>

      <!-- HORAS POR SEMANA -- preenchido quando as sessoes chegam -->
      <section class="card grafico" id="g-semanas" hidden></section>

      <!-- 09/10/2026 (roadmap 3.27, pedido dele): as materias do edital e os assuntos -->
      <section class="card grafico" id="g-edital" hidden></section>
    `;

    // Animations after render
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && window.Motion) {
      const { animate, stagger } = window.Motion;
      const statCards = document.querySelectorAll('.grid-3 .card');
      const matRows = document.querySelectorAll('.materia-row');
      
      if (statCards.length) {
        statCards.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(16px)'; });
        animate(statCards, { opacity: [0, 1], transform: ['translateY(16px)', 'translateY(0)'] }, { duration: 0.45, delay: stagger(0.1) });
      }
      
      if (matRows.length) {
        matRows.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; });
        animate(matRows, { opacity: [0, 1], transform: ['translateY(10px)', 'translateY(0)'] }, { duration: 0.4, delay: stagger(0.05, { start: 0.2 }) });
      }
    }
  }

  // ── LOGOUT ──
  window.fazerLogout = fazerLogout;

  // ── START ──
  init();

</script>
