<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  .semana {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    gap: var(--e3);
    margin-top: var(--e4);
  }

  .dia { display: flex; flex-direction: column; gap: var(--e2); }
  .dia-cabeca {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--e2); margin-bottom: var(--e1);
  }
  .dia-nome {
    font-family: var(--display); font-weight: 800;
    font-size: var(--t-sm); letter-spacing: .1em; text-transform: uppercase;
    color: var(--texto-2);
  }
  .dia-data {
    font-family: var(--dado); font-size: var(--t-xs);
    color: var(--texto-3); font-variant-numeric: tabular-nums;
  }
  .dia.hoje .dia-nome { color: var(--latao-c); }

  .sessao {
    display: flex; align-items: center; gap: var(--e2);
    background: var(--casco); border: 1px solid var(--linha);
    border-left: 3px solid var(--oliva);
    border-radius: var(--r-p); padding: .7rem .85rem;
    transition: transform 220ms var(--saida), border-color 220ms ease,
                box-shadow 220ms var(--saida);
  }
  .sessao.pesada { border-left-color: var(--latao); }
  @media (hover: hover) and (pointer: fine) {
    .sessao:hover {
      transform: translateX(3px);
      border-color: rgba(192,138,46,.4);
      box-shadow: 0 8px 20px -14px rgba(0,0,0,.8);
    }
  }
  .sessao-materia {
    flex: 1; font-size: var(--t-sm); color: var(--texto);
    line-height: 1.35;
  }
  .sessao-tempo {
    font-family: var(--dado); font-size: var(--t-xs);
    color: var(--texto-3); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .sessao-xp {
    font-family: var(--dado); font-size: var(--t-xs); font-weight: 700;
    color: var(--latao-c); white-space: nowrap;
  }

  .dia.descanso .sessao {
    border-left-color: var(--linha);
    color: var(--texto-3);
    justify-content: center;
    font-style: italic;
  }

  .resumo {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1px; background: var(--linha);
    border: 1px solid var(--linha); border-radius: var(--r-p);
    overflow: hidden; margin-top: var(--e3);
  }
  .resumo > div { background: var(--casco-2); padding: var(--e3); }
  .resumo dt {
    font-family: var(--dado); font-size: var(--t-xs); letter-spacing: .12em;
    text-transform: uppercase; color: var(--texto-3); margin-bottom: var(--e1);
    font-weight: 700;
  }
  .resumo dd {
    margin: 0; font-family: var(--dado); font-size: var(--t-xl);
    font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums;
  }

  .vazio {
    text-align: center; padding: var(--e5) var(--e3);
    color: var(--texto-2);
  }
  .vazio .titulo {
    font-family: var(--display); font-weight: 700;
    font-size: var(--t-lg); color: var(--texto); margin-bottom: var(--e2);
  }

  @media (max-width: 768px) {
    .semana { grid-template-columns: 1fr; }
  }
</style>

<script type="module">
  import { supabase, esc, exigirSessao, fazerLogout, nomeDoUsuario, nomeDoPlano }
    from './assets/js/astral.js?v=bd892079';
  import { carregarProgresso } from './assets/js/estado.js?v=d8945e86';

  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  /* Monta a semana a partir dos PESOS do edital.
     Regra: a materia mais pesada aparece mais vezes. Nada de IA aqui -- e conta
     simples, roda no navegador e nao gasta credito nenhum.
     Domingo fica de descanso de proposito: cronograma sem folga e cronograma
     que a pessoa abandona na segunda semana. */
  function montarSemana(materias) {
    if (!materias || !materias.length) return null;

    const ordenadas = [...materias].sort((a, b) => (b.peso || 1) - (a.peso || 1));
    const semana = [];

    for (let d = 0; d < 7; d++) {
      if (d === 0) { semana.push({ descanso: true, sessoes: [] }); continue; }

      const sessoes = [];
      // 2 a 3 sessoes por dia, girando a lista para variar sem ficar aleatorio
      const quantas = Math.min(3, ordenadas.length);
      for (let s = 0; s < quantas; s++) {
        const m = ordenadas[((d - 1) * quantas + s) % ordenadas.length];
        const peso = m.peso || 1;
        sessoes.push({
          materia: m.nome,
          tempo: Math.max(30, Math.round(peso * 2)),
          xp: Math.round(peso * 5),
          pesada: peso >= (ordenadas[0].peso || 1) * 0.8,
        });
      }
      semana.push({ descanso: false, sessoes });
    }
    return semana;
  }

  function datasDaSemana() {
    const hoje = new Date();
    const domingo = new Date(hoje);
    domingo.setDate(hoje.getDate() - hoje.getDay());
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(domingo);
      d.setDate(domingo.getDate() + i);
      return d;
    });
  }

  function render(semana) {
    const alvo = document.getElementById('conteudo');

    if (!semana) {
      alvo.innerHTML = `
        <div class="card">
          <div class="vazio">
            <div class="titulo">Seu cronograma aparece aqui</div>
            <p>Suba o PDF do seu edital e o Astral monta a semana a partir dos pesos de cada matéria.</p>
            <a class="btn btn-roxo" href="edital.html" style="margin-top:1rem">
              Enviar meu edital
            </a>
          </div>
        </div>`;
      return;
    }

    const datas = datasDaSemana();
    const hojeIdx = new Date().getDay();

    const totalMin = semana.reduce((t, d) => t + d.sessoes.reduce((s, x) => s + x.tempo, 0), 0);
    const totalXp  = semana.reduce((t, d) => t + d.sessoes.reduce((s, x) => s + x.xp, 0), 0);
    const totalSes = semana.reduce((t, d) => t + d.sessoes.length, 0);

    alvo.innerHTML = `
      <div class="card">
        <div class="section-title">Esta semana</div>
        <p class="section-sub">Domingo é descanso — cronograma sem folga é cronograma abandonado.</p>
        <dl class="resumo">
          <div><dt>Sessões</dt><dd>${totalSes}</dd></div>
          <div><dt>Tempo total</dt><dd>${Math.floor(totalMin / 60)}h${String(totalMin % 60).padStart(2, '0')}</dd></div>
          <div><dt>XP possível</dt><dd>${totalXp}</dd></div>
        </dl>
      </div>

      <div class="semana cascata">
        ${semana.map((dia, i) => `
          <section class="dia ${i === hojeIdx ? 'hoje' : ''} ${dia.descanso ? 'descanso' : ''}">
            <div class="dia-cabeca">
              <span class="dia-nome">${DIAS[i]}${i === hojeIdx ? ' · hoje' : ''}</span>
              <span class="dia-data">${String(datas[i].getDate()).padStart(2, '0')}/${String(datas[i].getMonth() + 1).padStart(2, '0')}</span>
            </div>
            ${dia.descanso
              ? '<div class="sessao">descanso</div>'
              : dia.sessoes.map(s => `
                  <div class="sessao ${s.pesada ? 'pesada' : ''}">
                    <span class="sessao-materia">${esc(s.materia)}</span>
                    <span class="sessao-tempo">${s.tempo} min</span>
                    <span class="sessao-xp">+${s.xp}</span>
                  </div>`).join('')}
          </section>`).join('')}
      </div>`;
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    const uid = sessao.user.id;

    /* nome: fonte unica em assets/js/divisa.js */
    /* inicial: fonte unica em assets/js/divisa.js */

    const dados = await carregarProgresso(uid);
    const plano = dados?.perfil?.tipo_plano || 'free';
    { const _p = document.getElementById('user-plan'); if (_p) _p.textContent = nomeDoPlano(plano).toUpperCase(); }

    render(montarSemana(dados?.materias));
  })();

  document.getElementById('btn-sair').addEventListener('click', fazerLogout);
</script>
