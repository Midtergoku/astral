<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  /* ── CRONOGRAMA, refeito em 28/09/2026 ────────────────────────────────────
     Ele: "nao gostei de nada aqui, achei a tabela toda fora de simetria".
     A grade antiga era auto-fit de 15rem: 4 colunas numa linha e 3 na outra,
     cada dia com 3 cartoes iguais. Agora e uma GRADE HORARIA de verdade:
     7 colunas iguais, segunda a domingo, e cada bloco com altura
     proporcional ao tempo -- 50 minutos parecem maiores que 25. */

  .painel {
    display: flex; justify-content: space-between; align-items: center;
    gap: var(--e3); flex-wrap: wrap;
  }
  .painel-rotulo {
    font-family: var(--dado); font-size: var(--t-xs); letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
  }
  .painel-rotina {
    font-family: var(--display); font-weight: 700; font-size: var(--t-md);
    color: var(--papel); margin-top: .2rem;
  }
  .painel-acoes { display: flex; gap: var(--e2); flex-wrap: wrap; }
  /* 09/10/2026 (roadmap 3.26): o rebalanceamento -- liga/desliga, "agora" e o aviso de segunda */
  .rebal {
    margin-top: var(--e3); padding-top: var(--e3); border-top: 1px solid var(--linha);
    display: flex; justify-content: space-between; align-items: center; gap: var(--e3); flex-wrap: wrap;
  }
  .rebal-texto { margin: 0; font-size: var(--t-sm); color: var(--texto-2); line-height: 1.5; max-width: 62ch; }
  .rebal-chave { display: inline-flex; align-items: center; gap: .45rem; min-height: 24px; cursor: pointer;
                 font-size: var(--t-sm); color: var(--texto); }
  .rebal-chave input { width: 18px; height: 18px; accent-color: var(--latao); }
  /* 09/10/2026 (roadmap 3.14): os avisos da semana -- prova, semana editada, rotina corrigida */
  .aviso-crono {
    margin-top: var(--e3); padding: .75rem .9rem; border-radius: var(--r-p);
    border: 1px solid color-mix(in srgb, var(--latao) 45%, var(--linha));
    background: color-mix(in srgb, var(--latao) 8%, transparent);
    display: flex; justify-content: space-between; align-items: center; gap: var(--e3); flex-wrap: wrap;
  }
  .aviso-crono.alerta { border-color: color-mix(in srgb, var(--brasa) 55%, var(--linha));
                        background: color-mix(in srgb, var(--brasa) 8%, transparent); }
  .aviso-crono p { margin: 0; font-size: var(--t-sm); color: var(--texto); line-height: 1.5; max-width: 66ch; }
  .aviso-crono a { color: var(--latao-c); text-decoration: underline; text-underline-offset: 2px; }
  .folga.prova { border-style: solid; border-color: color-mix(in srgb, var(--latao) 55%, var(--linha));
                 color: var(--latao-c); background: color-mix(in srgb, var(--latao) 8%, transparent); }
  .acao {
    background: transparent; border: 1px solid var(--linha); color: var(--texto);
    border-radius: var(--r-p); padding: .55rem .9rem; cursor: pointer;
    font-family: var(--display); font-weight: 600; font-size: .8rem;
    transition: border-color var(--d-dica) var(--saida), color var(--d-dica) var(--saida), background-color var(--d-dica) var(--saida);
  }
  .acao.forte { background: var(--latao); border-color: var(--latao); color: var(--breu); font-weight: 800; }
  .acao.perigo { color: var(--brasa-c); }
  @media (hover: hover) and (pointer: fine) {
    .acao:not(.forte):hover { border-color: var(--latao); color: var(--latao-c); }
  }

  .resumo {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px; background: var(--linha);
    border: 1px solid var(--linha); border-radius: var(--r-p);
    overflow: hidden; margin: var(--e3) 0 0;
  }
  .resumo > div { background: var(--casco-2); padding: .85rem var(--e3); }
  .resumo dt {
    font-family: var(--dado); font-size: .68rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
  }
  .resumo dd {
    margin: .2rem 0 0; font-family: var(--dado); font-size: var(--t-xl);
    font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums;
  }
  .resumo dd.ouro { color: var(--latao-c); }

  .grade {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: .5rem; margin-top: var(--e4); align-items: stretch;
  }
  .dia {
    display: flex; flex-direction: column; gap: .4rem; min-width: 0;
    padding: .5rem; border-radius: var(--r-g);
    background: color-mix(in srgb, var(--casco) 45%, transparent);
    border: 1px solid transparent;
  }
  .dia.hoje { border-color: color-mix(in srgb, var(--latao) 55%, transparent); background: color-mix(in srgb, var(--latao) 6%, var(--casco)); }
  /* 08/10/2026 (3.10b, Lighthouse): era opacidade .5 no bloco inteiro -- o texto caia abaixo de 4,5:1.
     O dia que passou apaga o ENFEITE (fundo, borda, a cor do XP) e o texto segue legivel. */
  .dia.passou .bloco:not(.feito) { background: transparent; border-style: dashed; border-left-color: var(--linha); }
  .dia.passou .bloco:not(.feito) .bloco-materia { color: var(--texto-2); }
  .dia.passou .bloco:not(.feito) .bloco-xp { color: var(--texto-3); }
  .dia.passou .folga { opacity: .6; }   /* a folga nao tem texto: so o hachurado */
  .dia-cabeca { padding: .15rem .2rem .45rem; border-bottom: 1px solid var(--linha); margin-bottom: .1rem; }
  .dia-nome {
    font-family: var(--display); font-weight: 800; font-size: .78rem;
    letter-spacing: .12em; text-transform: uppercase; color: var(--texto-2);
    display: flex; justify-content: space-between; gap: .3rem;
  }
  .dia.hoje .dia-nome { color: var(--latao-c); }
  .dia-data, .dia-total {
    font-family: var(--dado); font-size: .68rem; color: var(--texto-3);
    font-variant-numeric: tabular-nums; letter-spacing: 0; font-weight: 400;
  }
  .dia-total { margin-top: .15rem; }

  .bloco {
    position: relative;
    min-height: calc(var(--min, 30) * 1.25px + 1.5rem);
    display: flex; flex-direction: column; justify-content: space-between; gap: .3rem;
    background: var(--casco); border: 1px solid var(--linha);
    border-left: 3px solid var(--oliva);
    border-radius: var(--r-p); padding: .5rem .55rem;
  }
  .bloco.prioridade { border-left-color: var(--latao); }
  .bloco.feito { border-left-color: var(--oliva-c); background: color-mix(in srgb, var(--oliva) 14%, var(--casco)); }
  .bloco-materia {
    font-size: .82rem; color: var(--texto); line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .bloco-pe {
    display: flex; justify-content: space-between; align-items: baseline; gap: .3rem;
    font-family: var(--dado); font-size: .68rem; font-variant-numeric: tabular-nums;
  }
  .bloco-tempo { color: var(--texto-3); }
  .bloco-xp { color: var(--latao-c); font-weight: 700; }
  .bloco.feito .bloco-xp { color: var(--oliva-c); }

  .folga {
    flex: 1; min-height: 6rem; border-radius: var(--r-p);
    border: 1px dashed var(--linha);
    background: repeating-linear-gradient(135deg, transparent 0 7px,
                color-mix(in srgb, var(--linha) 45%, transparent) 7px 8px);
    display: grid; place-items: center;
    font-family: var(--dado); font-size: .7rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
  }

  /* Edicao da semana */
  .editando .bloco { padding-right: 1.6rem; }
  .bloco select {
    width: 100%; background: var(--breu); color: var(--texto);
    border: 1px solid var(--linha); border-radius: var(--r-p);
    font-family: var(--corpo); font-size: .78rem; padding: .25rem;
  }
  .bloco select.min { font-family: var(--dado); font-size: .7rem; }
  .tirar {
    position: absolute; top: .3rem; right: .3rem;
    width: 1.3rem; height: 1.3rem; display: grid; place-items: center;
    background: none; border: 1px solid var(--linha); border-radius: var(--r-p);
    color: var(--texto-3); cursor: pointer; font-size: .7rem; line-height: 1;
  }
  .por {
    border: 1px dashed var(--linha); background: none; color: var(--texto-3);
    border-radius: var(--r-p); padding: .45rem; cursor: pointer;
    font-family: var(--display); font-size: .75rem; font-weight: 600;
  }
  @media (hover: hover) and (pointer: fine) {
    .tirar:hover { color: var(--brasa-c); border-color: var(--brasa-c); }
    .por:hover { color: var(--latao-c); border-color: var(--latao); }
  }
  .barra-edicao {
    position: sticky; bottom: 1rem; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: var(--e3); flex-wrap: wrap;
    margin-top: var(--e3); padding: .75rem 1rem; border-radius: var(--r-g);
    background: var(--casco); border: 1px solid var(--latao);
    box-shadow: 0 16px 40px -20px rgba(0,0,0,.9);
  }
  .barra-edicao span { font-size: var(--t-sm); color: var(--texto-2); }

  /* Tempo por materia */
  .porMateria { margin-top: var(--e4); }
  .pm-linha {
    display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) 4.5rem;
    align-items: center; gap: var(--e3); padding: .45rem 0;
    border-bottom: 1px solid color-mix(in srgb, var(--linha) 60%, transparent);
    font-size: var(--t-sm);
  }
  .pm-barra { height: 6px; background: var(--casco-2); border-radius: var(--r-p); overflow: hidden; }
  .pm-barra span { display: block; height: 100%; background: var(--latao); }
  .pm-min { font-family: var(--dado); text-align: right; color: var(--texto-2); font-variant-numeric: tabular-nums; }

  .vazio { text-align: center; padding: var(--e5) var(--e3); color: var(--texto-2); }
  .vazio .titulo { font-family: var(--display); font-weight: 700; font-size: var(--t-lg); color: var(--texto); margin-bottom: var(--e2); }

  @media (max-width: 1100px) and (min-width: 769px) {
    .bloco-pe { flex-direction: column; gap: 0; }
  }
  @media (max-width: 768px) {
    .grade { grid-template-columns: 1fr; }
    .dia { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); column-gap: .6rem; align-items: start; }
    .dia-cabeca { grid-row: span 20; border-bottom: none; border-right: 1px solid var(--linha); padding-right: .4rem; }
    /* 30/09/2026: as 20 linhas do span acima sao quase todas vazias, mas cada
       uma levava o espaco entre linhas -- ~19 vaos de .4rem sob cada dia no
       celular. Sem espaco de grade; o respiro vai no proprio bloco. */
    .dia { row-gap: 0; }
    .dia > :not(.dia-cabeca):not(:last-child) { margin-bottom: .4rem; }
    .dia-nome { flex-direction: column; }
    .bloco { min-height: 0; }
    .folga { min-height: 2.6rem; }
    .resumo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pm-linha { grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) 3.5rem; }
    /* Sem isto a sidebar (fixed, 240px) fica POR CIMA do conteudo no celular:
       240 de 360px cobertos. O botao de menu do astral.js traz ela de volta. */
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
  }
</style>

<script type="module">
  import { supabase, esc, att, exigirSessao, fazerLogout, nomeDoUsuario, pintarSeloDoPlano, toast }
    from './assets/js/astral.js?v=08ecd54f';
  import { carregarProgresso, sessoesDeHoje, salvarRotina } from './assets/js/estado.js?v=ab647345';
  import { duracao, hojeSP, diaDaSemanaSP } from './assets/js/formato.js?v=98782d1d';
  import { montarSemana, blocosDeHoje, resumoDaRotina, normalizarRotina, xpDoBloco, DIAS, DIAS_CURTOS,
           provaNaSemana, foraDaSemanaEditada, incluirNaSemanaEditada, correcoesDaRotina }
    from './assets/js/cronograma.js?v=eafbde2d';
  import { perguntarRotina } from './assets/js/rotina.js?v=42fdf445';
  import { necessidadeDe } from './assets/js/plano.js?v=74a57c33';

  // Segunda primeiro: e assim que se planeja uma semana de estudo.
  const ORDEM = [1, 2, 3, 4, 5, 6, 0];
  const MINUTOS = [20, 25, 30, 40, 45, 50, 60, 90, 120];

  let uid = null, materias = [], rotina = null, hoje = [], edital = null;
  let rascunho = null;          // a semana sendo editada; null = fora da edicao

  const hm = duracao;                        // 01/10/2026: formato unico (era "2h00")

  function datasDaSemana() {
    // 04/10/2026 (NUM-05): a semana de Sao Paulo, o mesmo "hoje" do resto do site
    const [a, m, d] = hojeSP().split('-').map(Number);
    const seg = new Date(a, m - 1, d - ((diaDaSemanaSP() + 6) % 7));
    // Posicao i na ordem segunda..domingo = i dias depois da segunda.
    return Array.from({ length: 7 }, (_, i) => new Date(seg.getFullYear(), seg.getMonth(), seg.getDate() + i));
  }

  function render() {
    const alvo = document.getElementById('conteudo');
    if (!materias.length) {
      alvo.innerHTML = `
        <div class="card"><div class="vazio">
          <div class="titulo">Seu cronograma aparece aqui</div>
          <p>Envie o PDF do seu edital no Dashboard e o Astral monta a semana na sua rotina, pelos pesos de cada matéria.</p>
          <a class="btn btn-roxo" href="dashboard.html" style="margin-top:1rem">Ir para o Dashboard</a>
        </div></div>`;
      return;
    }

    const semana = rascunho
      ? rascunho.map((blocos, dia) => ({ dia, estuda: blocos.length > 0, blocos: blocos.map((b) => ({ ...b, xp: xpDoBloco(b.minutos) })) }))
      : montarSemana(materias, rotina, { prova: edital?.dataProva });
    const agora = new Date();
    const hojeIdx = diaDaSemanaSP(agora);
    const feitosHoje = blocosDeHoje(semana, hoje, agora);
    const datas = datasDaSemana();

    // As 3 materias que mais precisam de tempo ganham a borda de latao.
    const prioridade = new Set([...materias].sort((a, b) => necessidadeDe(b) - necessidadeDe(a)).slice(0, 3).map((m) => m.nome));

    const blocos = semana.flatMap((d) => d.blocos);
    const totalMin = blocos.reduce((s, b) => s + b.minutos, 0);
    const totalXp = blocos.reduce((s, b) => s + b.xp, 0);
    const dias = semana.filter((d) => d.blocos.length).length;

    const porMateria = {};
    for (const b of blocos) porMateria[b.materia] = (porMateria[b.materia] || 0) + b.minutos;
    const pm = Object.entries(porMateria).sort((a, b) => b[1] - a[1]);
    // 03/10/2026 (CRO-01): rotina curta revezando -- a frase "toda materia
    // aparece" so e dita quando e verdade NESTA semana.
    const foraDaSemana = materias.map((m) => m.nome).filter((n) => n && !(n in porMateria));
    const maiorPm = Math.max(1, ...pm.map((x) => x[1]));

    const posHoje = (hojeIdx + 6) % 7;   // posicao de hoje na ordem segunda..domingo

    alvo.innerHTML = `
      <div class="card">
        <div class="painel">
          <div>
            <div class="painel-rotulo">Sua rotina</div>
            <div class="painel-rotina">${esc(resumoDaRotina(rotina))}</div>
          </div>
          <div class="painel-acoes">
            ${rascunho ? '' : `
              <button class="acao" id="ajustar" type="button">Ajustar rotina</button>
              <button class="acao" id="editar" type="button">Editar semana</button>`}
          </div>
        </div>
        ${rascunho ? '' : rebalHTML()}
        ${rascunho ? '' : avisosHTML()}
        <dl class="resumo">
          <div><dt>Sessões</dt><dd>${blocos.length}</dd></div>
          <div><dt>Tempo</dt><dd>${hm(totalMin)}</dd></div>
          <div><dt>Dias de estudo</dt><dd>${dias}</dd></div>
          <div><dt>XP possível</dt><dd class="ouro">${totalXp}<small style="font-size:.55em;opacity:.7"> + bônus</small></dd></div>
        </dl>
      </div>

      <div class="grade ${rascunho ? 'editando' : ''}">
        ${ORDEM.map((d, pos) => {
          const dia = semana[d];
          const min = dia.blocos.reduce((s, b) => s + b.minutos, 0);
          const ehHoje = d === hojeIdx;
          const lista = ehHoje ? feitosHoje : dia.blocos;
          return `
          <section class="dia ${ehHoje ? 'hoje' : ''} ${pos < posHoje ? 'passou' : ''}" aria-label="${DIAS[d]}">
            <div class="dia-cabeca">
              <div class="dia-nome"><span>${DIAS_CURTOS[d]}${ehHoje ? ' · hoje' : ''}</span>
                <span class="dia-data">${String(datas[pos].getDate()).padStart(2, '0')}/${String(datas[pos].getMonth() + 1).padStart(2, '0')}</span></div>
              <div class="dia-total">${min ? hm(min) : '—'}</div>
            </div>
            ${lista.length ? lista.map((b, i) => rascunho ? `
              <div class="bloco" style="--min:${b.minutos}">
                <select data-dia="${d}" data-i="${i}" data-campo="materia" aria-label="Matéria">
                  ${materias.map((m) => `<option value="${att(m.nome)}" ${m.nome === b.materia ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}
                </select>
                <select class="min" data-dia="${d}" data-i="${i}" data-campo="minutos" aria-label="Minutos">
                  ${[...new Set([...MINUTOS, b.minutos])].sort((x, y) => x - y).map((v) => `<option value="${v}" ${v === b.minutos ? 'selected' : ''}>${v} min</option>`).join('')}
                </select>
                <button class="tirar" type="button" data-tirar="${d}" data-i="${i}" aria-label="Tirar este bloco">✕</button>
              </div>` : `
              <div class="bloco ${prioridade.has(b.materia) ? 'prioridade' : ''} ${b.feito ? 'feito' : ''}" style="--min:${b.minutos}">
                <div class="bloco-materia">${esc(b.materia)}</div>
                <div class="bloco-pe"><span class="bloco-tempo">${b.minutos} min</span>
                  <span class="bloco-xp">${b.feito ? 'feito' : `+${b.xp}`}</span></div>
              </div>`).join('')
              : (rascunho ? '' : dia.prova
                  ? `<div class="folga prova">${dia.prova === 'dia' ? 'dia da prova' : 'depois da prova'}</div>`
                  : '<div class="folga">folga</div>')}
            ${rascunho ? `<button class="por" type="button" data-por="${d}">+ bloco</button>` : ''}
          </section>`;
        }).join('')}
      </div>

      ${rascunho ? `
        <div class="barra-edicao">
          <span>Editando a semana. As mudanças valem até você ajustar a rotina de novo.</span>
          <div class="painel-acoes">
            <button class="acao perigo" id="automatico" type="button">Voltar ao automático</button>
            <button class="acao" id="cancelar" type="button">Cancelar</button>
            <button class="acao forte" id="salvar" type="button">Salvar semana</button>
          </div>
        </div>` : ''}

      <div class="card porMateria">
        <div class="section-title">Tempo por matéria na semana</div>
        <p class="section-sub">Proporcional ao peso no edital e ao quanto ainda falta dominar. ${foraDaSemana.length && !rascunho && semana.some((d) => d.retaFinal || d.prova)
          ? `Perto da prova, ficam fora as que você ainda não estudou: ${foraDaSemana.map(esc).join(', ')}.`
          : foraDaSemana.length && normalizarRotina(rotina).semana && !rascunho
          ? `Na sua semana ajustada à mão, ficaram fora: ${foraDaSemana.map(esc).join(', ')}.`
          : foraDaSemana.length
          ? `Sua rotina tem ${blocos.length} ${blocos.length === 1 ? 'bloco' : 'blocos'} na semana e o edital ${materias.length} matérias: elas se revezam, e cada uma volta em poucas semanas. Fora desta semana: ${foraDaSemana.map(esc).join(', ')}.`
          : 'Toda matéria aparece pelo menos uma vez.'}</p>
        ${pm.map(([m, v]) => `
          <div class="pm-linha">
            <span>${esc(m)}</span>
            <span class="pm-barra"><span style="width:${Math.round(v / maiorPm * 100)}%"></span></span>
            <span class="pm-min">${hm(v)}</span>
          </div>`).join('')}
      </div>`;

    ligar(semana);
  }

  function ligar(semana) {
    const $ = (id) => document.getElementById(id);
    $('ajustar')?.addEventListener('click', async () => {
      const r = await perguntarRotina({ atual: rotina, materias: materias.length });
      if (!r) return;
      await gravar(r, 'Rotina ajustada. A semana foi montada de novo.');
    });
    $('editar')?.addEventListener('click', () => {
      rascunho = semana.map((d) => d.blocos.map((b) => ({ materia: b.materia, minutos: b.minutos })));
      render();
    });
    $('cancelar')?.addEventListener('click', () => { rascunho = null; render(); });
    $('rebal-auto')?.addEventListener('change', async (e) => {
      const auto = e.target.checked;
      await rebalancear({ auto }, auto
        ? 'Rebalanceamento automático ligado: toda segunda, sozinho.'
        : 'Rebalanceamento automático desligado: a semana só muda quando você pedir.');
    });
    $('rebal-agora')?.addEventListener('click', () => rebalancear({}, 'Cronograma rebalanceado pelo seu domínio de agora.'));
    $('automatico')?.addEventListener('click', async () => {
      // 09/10/2026 (CRO-04): apagava a semana editada com um clique, sem perguntar
      if (!confirm('Voltar ao automático apaga a semana que você ajustou à mão, e o Astral monta a semana de novo pela sua rotina. Continuar?')) return;
      rascunho = null;
      await gravar({ ...normalizarRotina(rotina), semana: null }, 'De volta ao cronograma automático.');
    });
    $('incluir-faltando')?.addEventListener('click', async () => {
      const semanaNova = incluirNaSemanaEditada(materias, rotina);
      await gravar({ ...normalizarRotina(rotina), semana: semanaNova }, 'Matérias incluídas na sua semana. Confira os dias e ajuste se quiser.');
    });
    $('salvar')?.addEventListener('click', async () => {
      const semanaNova = rascunho;
      rascunho = null;
      await gravar({ ...normalizarRotina(rotina), semana: semanaNova }, 'Semana salva do seu jeito.');
    });
    document.querySelectorAll('.grade select').forEach((el) => el.addEventListener('change', () => {
      const b = rascunho[Number(el.dataset.dia)][Number(el.dataset.i)];
      b[el.dataset.campo] = el.dataset.campo === 'minutos' ? Number(el.value) : el.value;
      render();
    }));
    document.querySelectorAll('[data-tirar]').forEach((el) => el.addEventListener('click', () => {
      rascunho[Number(el.dataset.tirar)].splice(Number(el.dataset.i), 1);
      render();
    }));
    document.querySelectorAll('[data-por]').forEach((el) => el.addEventListener('click', () => {
      const d = Number(el.dataset.por);
      const usadas = new Set(rascunho[d].map((b) => b.materia));
      const proxima = [...materias].sort((a, b) => necessidadeDe(b) - necessidadeDe(a)).find((m) => !usadas.has(m.nome)) || materias[0];
      rascunho[d].push({ materia: proxima.nome, minutos: normalizarRotina(rotina).bloco });
      render();
    }));
  }

  /* 09/10/2026 (roadmap 3.26, pedido dele): o rebalanceamento.
     A semana usa o RETRATO do dominio (medida.semana). Automatico: o retrato e tirado toda
     segunda (ou no ultimo "Rebalancear agora", se for depois). Desligado: so quando a pessoa
     pede. Quem decide o corte e o servidor (corte_do_rebalanceio); aqui so se grava a escolha
     em rotina.rebalanceio = { auto, em } e se relê as materias com o retrato novo. */
  function rebalHTML() {
    const rb = rotina?.rebalanceio || {};
    const auto = rb.auto !== false;
    const quando = rb.em ? new Date(rb.em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : null;
    const texto = auto
      ? `Toda segunda o cronograma se rebalanceia sozinho pelo seu domínio: a matéria mais fraca ganha mais tempo.${quando ? ` Último ajuste feito por você: ${quando}.` : ''}`
      : `O rebalanceamento automático está desligado: a semana só muda quando você tocar em <strong>Rebalancear agora</strong>.${quando ? ` Último ajuste: ${quando}.` : ''}`;
    return `
        <div class="rebal">
          <p class="rebal-texto">${texto}</p>
          <div class="painel-acoes">
            <label class="rebal-chave"><input type="checkbox" id="rebal-auto"${auto ? ' checked' : ''}> Rebalancear sozinho toda segunda</label>
            <button class="acao" id="rebal-agora" type="button">Rebalancear agora</button>
          </div>
        </div>`;
  }

  /* 09/10/2026 (roadmap 3.14 -- CRO-03, CRO-04, CRO-05): o que a semana precisa dizer.
     A prova (reta final, dia da prova, prova que ja passou), a semana editada a mao que
     ficou sem materia do edital, e a rotina que tinha valor invalido e foi trocada. */
  function avisosHTML() {
    const avisos = [];
    const dataBR = (iso) => iso.split('-').reverse().join('/');
    const p = provaNaSemana(edital?.dataProva);
    if (p?.passouAntes) {
      avisos.push({ texto: `A prova do seu edital foi em <strong>${dataBR(p.data)}</strong>. Vai prestar outro concurso? `
        + `<a href="dashboard.html#edital-faixa">Suba o edital novo no painel</a> — XP, patente e condecorações vão junto. `
        + 'Se a data estiver errada, corrija no mesmo lugar.' });
    } else if (p && (p.retaFinal || p.nestaSemana)) {
      const estudou = materias.some((m) => (Number(m.progresso) || 0) > 0);
      let t = `<strong>Reta final:</strong> a prova é em ${dataBR(p.data)}. `;
      if (p.retaFinal) {
        t += estudou
          ? 'Nos 7 dias antes dela, o cronograma só traz matérias que você já estudou — é hora de reforçar, não de abrir frente nova. '
          : 'Nenhuma matéria tem domínio ainda, então a semana segue com todas — priorize questões das de maior peso. ';
      }
      if (p.nestaSemana) t += 'No dia da prova e depois dela, a semana fica sem sessões.';
      avisos.push({ texto: t });
    }
    const fora = foraDaSemanaEditada(materias, rotina);
    if (fora.length) {
      avisos.push({ alerta: true, botao: '<button class="acao" id="incluir-faltando" type="button">Incluir na semana</button>',
        texto: `Sua semana foi ajustada à mão e não tem ${fora.length === 1 ? 'esta matéria' : 'estas matérias'} do seu edital: `
          + `<strong>${fora.map(esc).join(', ')}</strong>.` });
    }
    const corrigido = correcoesDaRotina(rotina);
    if (corrigido.length) {
      avisos.push({ alerta: true, texto: `Parte da sua rotina estava fora do que o Astral aceita (${corrigido.map(esc).join(', ')}) `
        + 'e foi trocada pelo padrão. Confira em <strong>Ajustar rotina</strong>.' });
    }
    return avisos.map((a) => `
        <div class="aviso-crono${a.alerta ? ' alerta' : ''}" role="note">
          <p>${a.texto}</p>${a.botao || ''}
        </div>`).join('');
  }

  async function rebalancear(muda, mensagem) {
    const atual = rotina?.rebalanceio || {};
    // desligar "congela" o plano no dominio de agora; ligar ou "agora" tira o retrato agora
    const rb = { auto: muda.auto ?? (atual.auto !== false), em: new Date().toISOString() };
    try {
      await salvarRotina(uid, { ...normalizarRotina(rotina), ...(rotina || {}), rebalanceio: rb,
        respondidoEm: rotina?.respondidoEm || new Date().toISOString() });
      rotina = { ...(rotina || {}), rebalanceio: rb };
      // o servidor recalculou o retrato na mesma gravacao: rele as materias
      const dados = await carregarProgresso(uid);
      materias = (dados?.materias || []).filter((m) => m && m.nome);
      toast(mensagem);
    } catch (e) {
      toast(e.message, 'error');
    }
    render();
  }

  async function gravar(nova, mensagem) {
    try {
      // a escolha do rebalanceamento NAO se perde ao ajustar a rotina ou editar a semana
      await salvarRotina(uid, { ...nova, rebalanceio: nova.rebalanceio ?? rotina?.rebalanceio,
        respondidoEm: nova.respondidoEm || rotina?.respondidoEm || new Date().toISOString() });
      rotina = { ...nova, rebalanceio: nova.rebalanceio ?? rotina?.rebalanceio };
      toast(mensagem);
    } catch (e) {
      toast(e.message, 'error');
    }
    render();
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    uid = sessao.user.id;

    const dados = await carregarProgresso(uid);
    // Plano: num lugar so (assets/js/astral.js, 01/10/2026).
    pintarSeloDoPlano(dados?.perfil);

    materias = (dados?.materias || []).filter((m) => m && m.nome);
    rotina = dados?.rotina || null;
    edital = dados?.edital || null;
    hoje = await sessoesDeHoje(uid);
    render();
  })();

  document.getElementById('btn-sair').addEventListener('click', fazerLogout);
</script>
