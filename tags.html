<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  .vitrine {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
    gap: var(--e3);
    margin-top: var(--e4);
  }

  /* Cada tag e um botao: a tela inteira existe para ESCOLHER, entao
     nada aqui e apenas decorativo. */
  .peca {
    text-align: left;
    background: var(--casco);
    border: 1px solid var(--linha);
    border-radius: var(--r-g);
    padding: var(--e3);
    cursor: pointer;
    display: grid; gap: var(--e2);
    transition: transform 240ms var(--saida), border-color 240ms ease,
                box-shadow 240ms var(--saida);
  }
  .peca[aria-pressed="true"] {
    border-color: var(--latao);
    box-shadow: 0 0 0 1px var(--latao), 0 14px 34px -20px rgba(0,0,0,.8);
  }
  @media (hover: hover) and (pointer: fine) {
    .peca:hover { transform: translateY(-3px); border-color: rgba(192,138,46,.45); }
  }
  .peca-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--e2); }
  .peca-origem {
    font-family: var(--dado); font-size: var(--t-xs);
    color: var(--texto-3); letter-spacing: .06em;
  }
  .peca-dominio {
    font-family: var(--dado); font-size: var(--t-xs); font-weight: 700;
    color: var(--latao-c); font-variant-numeric: tabular-nums;
  }
  .peca-estado {
    font-family: var(--dado); font-size: .62rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
  }
  .peca[aria-pressed="true"] .peca-estado { color: var(--latao-c); }

  .vitrine-atual {
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--latao); border-radius: var(--r-p);
    padding: var(--e3); display: flex; align-items: center;
    gap: var(--e3); flex-wrap: wrap; margin-bottom: var(--e4);
  }
  .vitrine-atual .rot {
    font-family: var(--dado); font-size: var(--t-xs); letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
  }

  @media (max-width: 768px) { .vitrine { grid-template-columns: 1fr; } }
</style>

<main class="main">

      <h1 class="page-title">Minhas tags</h1>
      <p class="page-sub">Tudo que você conquistou fica guardado. Escolha qual vai na sua divisa.</p>
    </div>
  </div>

  <div id="conteudo">
    <div class="esqueleto-linha media"></div>
    <div class="esqueleto-linha curta"></div>
    <div class="vitrine">
      <div class="esqueleto-bloco"></div><div class="esqueleto-bloco"></div><div class="esqueleto-bloco"></div>
    </div>
  </div>
</main>

<script type="module">
  import { supabase, esc, exigirSessao, fazerLogout, nomeDoUsuario, toast }
    from './assets/js/astral.js';
  import { carregarProgresso, salvarProgresso } from './assets/js/estado.js';
  import { tagsConquistadas, tagVestida, divisaHTML, nivelDe } from './assets/js/divisa.js';
  import { icone } from './assets/js/icones.js';

  let estado = null;
  let uid = null;

  function render() {
    const alvo = document.getElementById('conteudo');
    const minhas = tagsConquistadas(estado.materias);
    const vestida = tagVestida(estado.materias, estado.tagEscolhida);

    if (!minhas.length) {
      alvo.innerHTML = `
        <div class="card">
          <div class="vazio">
            <div class="vazio-fantasma"><div></div><div></div><div></div></div>
            <div class="vazio-conteudo">
              <span class="vazio-icone">${icone('medalha', 24)}</span>
              <p class="vazio-titulo">Sua primeira tag ainda está por vir</p>
              <p class="vazio-texto">Tags são especialidades. Você ganha a primeira ao chegar a
                <strong>70% de domínio</strong> em qualquer matéria do seu edital — e ela fica sua para sempre.</p>
              <a class="btn btn-roxo" href="progresso.html">Ver meu progresso</a>
            </div>
          </div>
        </div>`;
      return;
    }

    const n = nivelDe(estado.xp, estado.edital?.nome || estado.edital || '');

    alvo.innerHTML = `
      <div class="vitrine-atual">
        <span class="rot">na sua divisa</span>
        ${divisaHTML({ xp: estado.xp, edital: estado.edital?.nome || estado.edital || '',
                       materias: estado.materias, tagEscolhida: estado.tagEscolhida }, esc)}
      </div>

      <p class="page-sub" style="margin-bottom:0">
        Você tem <strong>${minhas.length}</strong> ${minhas.length === 1 ? 'tag conquistada' : 'tags conquistadas'}.
        Clique numa para vesti-la.
      </p>

      <div class="vitrine cascata">
        ${minhas.map((t) => `
          <button type="button" class="peca" data-tag="${esc(t.nome)}"
                  aria-pressed="${t.nome === vestida?.nome ? 'true' : 'false'}">
            <div class="peca-topo">
              <span class="divisa"><span class="nivel">${esc(n.nome)}</span><span class="tag">${esc(t.nome)}</span></span>
            </div>
            <div class="peca-topo">
              <span class="peca-origem">${esc(t.materia)}</span>
              <span class="peca-dominio">${t.dominio}%</span>
            </div>
            <span class="peca-estado">${t.nome === vestida?.nome ? '● vestindo' : 'vestir esta'}</span>
          </button>`).join('')}
      </div>`;

    /* addEventListener, nunca onclick inline: o nome da matéria vem do edital,
       que é dado NÃO CONFIÁVEL (regra 4 do CLAUDE.md). */
    alvo.querySelectorAll('.peca').forEach((b) => {
      b.addEventListener('click', () => escolher(b.getAttribute('data-tag')));
    });
  }

  async function escolher(nome) {
    if (estado.tagEscolhida === nome) return;
    estado.tagEscolhida = nome;
    render();
    // a divisa da barra lateral muda na hora, sem esperar o banco
    document.querySelectorAll('[data-divisa]').forEach((el) => {
      el.innerHTML = divisaHTML({ xp: estado.xp, edital: estado.edital?.nome || estado.edital || '',
                                  materias: estado.materias, tagEscolhida: nome }, esc);
    });
    try {
      await salvarProgresso(uid, estado, { imediato: true });
      toast(`Agora você veste ${nome}.`, 'success');
    } catch (e) {
      toast('Não consegui salvar sua escolha. Tente de novo.', 'error');
    }
  }

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    uid = sessao.user.id;

    const nome = await nomeDoUsuario(sessao);
    document.getElementById('user-name').textContent = nome;
    document.getElementById('user-avatar').textContent = nome.charAt(0).toUpperCase();

    estado = await carregarProgresso(uid);
    render();
  })();

  document.getElementById('btn-sair').addEventListener('click', fazerLogout);
</script>
