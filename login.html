<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/css/base.css?v=6ef652ee"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astral — Entrar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--corpo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--white);
      text-decoration: none;
    }
    .logo span { color: var(--purple); }

    .back-link {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
    }

    main::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(192,138,46,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2.25rem;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .card h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.6rem;
      color: var(--white);
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .card p.subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
      color: var(--text);
      font-family: var(--corpo);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 1.25rem;
    }
    .btn-google:hover { border-color: var(--purple-lt); }

    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-family: var(--corpo);
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(192,138,46,0.15);
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }
    .forgot-link:hover { color: var(--purple-lt); }

    .btn-primary {
      width: 100%;
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 6px;
      font-family: var(--corpo);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(192,138,46,0.35);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: rgba(224,112,90,0.08);
      border: 1px solid rgba(224,112,90,0.25);
      color: var(--red);
      border-radius: 3px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .ok-msg {
      background: rgba(140,160,107,0.08);
      border: 1px solid rgba(140,160,107,0.25);
      color: var(--green);
      border-radius: 3px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      /* A mensagem de "esqueci a senha" tem paragrafo. Como ela e inserida com
         textContent (para nao permitir HTML), a quebra so aparece com isto. */
      white-space: pre-line;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      nav { padding: 1rem 1.25rem; }
      main { padding: 2rem 1rem; }
      .card { padding: 1.5rem; border-radius: 6px; }
      .card h1 { font-size: 1.35rem; }
    }

    .bottom-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .bottom-link a {
      color: var(--purple-lt);
      text-decoration: none;
      font-weight: 500;
    }
    .bottom-link a:hover { text-decoration: underline; }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
<script src="/assets/js/movimento.js?v=0396e37b"></script>

<body>

<nav>
  <a href="index.html" class="logo">Ast<span>r</span>al</a>
  <a href="index.html" class="back-link">← Voltar ao início</a>
</nav>

<main>
  <div class="card">
    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Entre na sua conta para acessar seu plano de estudos.</p>

    <!-- Google -->
    <button class="btn-google" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>

    <div class="divider"><span>ou</span></div>

    <!-- Erro -->
    <div class="error-msg" id="error-msg"></div>
    <div class="ok-msg" id="ok-msg"></div>

    <!-- Form email/senha -->
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <a href="#" class="forgot-link" onclick="esqueceuSenha(event)">Esqueci minha senha</a>

    <!-- Fica vazio enquanto HCAPTCHA_SITEKEY estiver em branco (ver astral.js). -->
    <div id="caixa-captcha" style="margin-bottom:1rem;"></div>

    <button class="btn-primary" id="btn-login" onclick="loginEmail()">
      Entrar</button>

    <div class="bottom-link">
      Não tem conta? <a href="criar-conta.html">Criar conta grátis</a>
    </div>
  </div>
</main>

<footer>© 2026 Astral · Feito para concurseiros militares</footer>

<script type="module">
  import { supabase, esc, att, escJs, urlSegura, exigirSessao, fazerLogout, nomeDoUsuario, chamarIA, toast,
           segundosBloqueado, registrarFalha, limparFreio, emPortugues,
           montarCaptcha, tokenCaptcha, resetarCaptcha, olhinhoDeSenha }
    from './assets/js/astral.js?v=cafed2bd';

  olhinhoDeSenha('senha');

  // null enquanto o captcha estiver desligado -- e ai tokenCaptcha() devolve
  // undefined, que o supabase-js simplesmente ignora.
  let widgetCaptcha = null;
  montarCaptcha('caixa-captcha').then(id => { widgetCaptcha = id; });

  // Se o usuario chegou aqui pelo link de redefinicao de senha, o token vem no
  // fragmento da URL. Mandamos para a pagina certa ANTES de qualquer coisa --
  // senao o supabase-js troca o token por uma sessao, a linha abaixo vê sessao
  // valida e joga a pessoa no dashboard sem nunca pedir a senha nova. Era
  // exatamente isso que acontecia antes de redefinir-senha.html existir.
  if (/type=recovery/.test(window.location.hash) || /[?&]code=/.test(window.location.search)) {
    window.location.replace('redefinir-senha.html' + window.location.search + window.location.hash);
  }

  // Se já estiver logado, vai pro dashboard
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = 'dashboard.html';

  function mostrarErro(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('ok-msg').style.display = 'none';
  }

  function mostrarOk(msg) {
    const el = document.getElementById('ok-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
  }

  function esconderErro() {
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('ok-msg').style.display = 'none';
  }

  window.loginGoogle = async function() {
    esconderErro();
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/dashboard.html' }
    });
    if (error) mostrarErro('Erro ao entrar com Google. Tente novamente.');
  }

  window.loginEmail = async function() {
    esconderErro();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btn-login');

    if (!email || !email.includes('@')) { mostrarErro('Informe um e-mail válido.'); return; }
    if (!senha) { mostrarErro('Informe sua senha.'); return; }

    // Freio local depois de 5 erros seguidos, com espera crescente. Medido:
    // o Supabase sozinho só recusa a partir da 32ª tentativa, e por IP.
    const espera = segundosBloqueado(email);
    if (espera > 0) {
      mostrarErro(`Muitas tentativas seguidas. Espere ${emPortugues(espera)} antes de tentar de novo.`);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password: senha,
      options: { captchaToken: tokenCaptcha(widgetCaptcha) },
    });

    // O token do captcha e de uso unico: sem resetar, a segunda tentativa
    // falha mesmo com a senha certa.
    if (error) resetarCaptcha(widgetCaptcha);

    if (error) {
      const bloqueio = registrarFalha(email);
      if (bloqueio > 0) {
        mostrarErro(`Senha errada 5 vezes seguidas. Por segurança, espere ${emPortugues(bloqueio)}. ` +
                    `Se não lembra a senha, use "Esqueci minha senha".`);
        btn.disabled = false;
        btn.innerHTML = 'Entrar →';
        return;
      }
    }

    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('invalid login')) {
        mostrarErro('E-mail ou senha incorretos. Tente novamente.');
      } else if (m.includes('email not confirmed')) {
        mostrarErro('Confirme seu e-mail antes de entrar. Verifique a caixa de entrada e o spam.');
      } else if (m.includes('email_provider_disabled') || m.includes('email logins are disabled')) {
        // Estado real do projeto ate 30/07/2026. Sem esta mensagem o usuario
        // via "Erro ao entrar" e ficava tentando a senha de novo, sem chance.
        mostrarErro('O login por e-mail ainda não está ativo. Entre com o Google por enquanto.');
      } else if (m.includes('rate limit') || m.includes('too many')) {
        mostrarErro('Muitas tentativas. Espere alguns minutos e tente de novo.');
      } else {
        mostrarErro('Erro ao entrar. Tente novamente.');
      }
      btn.disabled = false;
      btn.innerHTML = 'Entrar →';
      return;
    }

    limparFreio(email);
    window.location.href = 'dashboard.html';
  }

  window.esqueceuSenha = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email || !email.includes('@')) {
      mostrarErro('Digite seu e-mail no campo acima e clique em "Esqueci minha senha" de novo.');
      return;
    }

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      // Apontava para a propria login.html, que nao sabia o que fazer com o
      // token -- o usuario acabava logado sem nunca trocar a senha.
      redirectTo: window.location.origin + '/redefinir-senha.html',
      captchaToken: tokenCaptcha(widgetCaptcha),
    });
    if (error) resetarCaptcha(widgetCaptcha);

    if (error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('rate limit') || m.includes('too many')) {
        mostrarErro('Já enviamos um e-mail há pouco. Espere alguns minutos antes de pedir outro.');
      } else if (m.includes('email_provider_disabled')) {
        mostrarErro('O login por e-mail ainda não está ativo. Entre com o Google por enquanto.');
      } else {
        mostrarErro('Não consegui enviar o e-mail. Tente de novo em alguns minutos.');
      }
      return;
    }

    // Mensagem deliberadamente igual quer o e-mail exista ou nao: dizer "esse
    // e-mail nao tem conta" entrega para um curioso quem e cadastrado aqui.
    //
    // O aviso do beta e honestidade obrigatoria, nao enfeite: o SMTP padrao do
    // Supabase so entrega para endereco da organizacao (CLAUDE.md 13.4), entao
    // para um concurseiro de verdade esse e-mail NAO CHEGA. Sem este aviso a
    // pessoa fica esperando um e-mail que nunca vem e perde a conta em
    // silencio. Remover quando houver SMTP proprio.
    mostrarOk(
      'Se existir uma conta com esse e-mail, o link de redefinição chega em instantes. ' +
      'Confira também o spam.\n\n' +
      '<i data-icone="aviso"></i> Durante o beta o envio de e-mails ainda é limitado. Se o link não chegar em ' +
      '10 minutos, fale com o Lucas no WhatsApp — ele libera seu acesso na hora. ' +
      'Entrar com o Google nunca depende de e-mail.'
    );
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.loginEmail();
  });
</script>
<script>
(function() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const { animate, stagger } = window.Motion;

  // ── CARD: fade + translateY ──
  const card = document.querySelector('main .card');
  if (card) {
    card.style.opacity = '0'; card.style.transform = 'translateY(24px)';
    animate(card, { opacity: [0, 1], transform: ['translateY(24px)', 'translateY(0)'] }, { duration: 0.5, easing: 'ease-out', delay: 0.05 });
  }

  // ── FORM FIELDS: stagger ──
  const formGroups = document.querySelectorAll('.card .form-group');
  formGroups.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(12px)'; });
  if (formGroups.length) {
    animate(formGroups, { opacity: [0, 1], transform: ['translateY(12px)', 'translateY(0)'] }, { duration: 0.4, easing: 'ease-out', delay: stagger(0.06, { start: 0.3 }) });
  }

  // ── PRIMARY BUTTON: fade in last ──
  const btn = document.querySelector('.btn-primary');
  if (btn) {
    btn.style.opacity = '0';
    animate(btn, { opacity: [0, 1] }, { duration: 0.4, easing: 'ease-out', delay: 0.55 });
  }
})();
</script>
