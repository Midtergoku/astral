<style>
  body { display: flex; min-height: 100vh; margin: 0; }

  /* ── O BANCO DE QUESTÕES ──────────────────────────────────────────────────
     Questões de provas militares antigas, que são documento público. NÃO é a
     mesma coisa que a geração por IA de `questoes.html`, que segue desligada
     desde 31/07 por causa de custo: aqui não há chamada paga nenhuma, o que é
     exatamente o motivo de este caminho existir.

     🔴 A tela não decide nada sobre plano. Ela pede ao servidor e desenha o
     que voltar. O portão free/pro mora dentro de `sortear_questoes` -- se
     morasse aqui, bastaria abrir o console para derrubá-lo. */

  .filtros {
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--latao); border-radius: var(--r-p);
    padding: var(--e3); margin-bottom: var(--e4);
  }

  .filtros-linha { display: flex; gap: var(--e3); flex-wrap: wrap; align-items: flex-end; }

  .filtro { display: flex; flex-direction: column; gap: .25rem; }

  .filtro label {
    font-family: var(--dado); font-size: .58rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-3);
  }

  .filtro select {
    background: var(--breu); border: 1px solid var(--linha); color: var(--texto);
    border-radius: var(--r-p); padding: .5rem .6rem; font-family: var(--corpo);
    font-size: .85rem; min-height: 44px; min-width: 10rem;
  }

  .filtro select:focus { outline: 2px solid var(--latao); outline-offset: 1px; }

  .filtro select:disabled { opacity: .45; }

  .cota {
    display: flex; gap: var(--e3); align-items: baseline; flex-wrap: wrap;
    margin-top: var(--e3); padding-top: var(--e2);
    border-top: 1px solid var(--linha); font-size: .8rem; color: var(--texto-3);
  }

  .cota-num {
    font-family: var(--dado); font-weight: 700; color: var(--latao-c);
    font-variant-numeric: tabular-nums;
  }

  /* ── A questão ──────────────────────────────────────────────────────────── */
  .questao {
    background: var(--casco); border: 1px solid var(--linha);
    border-radius: var(--r-g); padding: var(--e4); margin-bottom: var(--e3);
  }

  .questao-topo {
    display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap;
    margin-bottom: var(--e3); padding-bottom: var(--e2);
    border-bottom: 1px solid var(--linha);
  }

  .selo {
    font-family: var(--dado); font-size: .58rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--texto-3);
    border: 1px solid var(--linha); border-radius: var(--r-p); padding: .12rem .4rem;
  }

  .selo.assunto { color: var(--latao-c); border-color: color-mix(in srgb, var(--latao) 45%, transparent); }

  .questao-enunciado {
    font-size: .95rem; line-height: 1.6; margin-bottom: var(--e3);
    text-wrap: pretty;
  }

  .alts { display: grid; gap: .4rem; }
  /* 03/10/2026 (roadmap 3.4): questao como imagem do caderno oficial */
  .questao-imagem { display: block; margin-bottom: var(--e1); }
  .questao-imagem img { display: block; width: 100%; height: auto; border-radius: var(--r-p); }
  .questao-imagem-nota { font-size: var(--t-xs); color: var(--texto-3); margin: 0 0 var(--e3); }
  .questao:has(.alt.so-letra) .alts { grid-template-columns: repeat(auto-fit, minmax(3.5rem, 1fr)); }
  .alt.so-letra { justify-content: center; min-height: 44px; }

  .alt {
    display: flex; gap: .6rem; align-items: flex-start; width: 100%;
    background: var(--breu); border: 1px solid var(--linha);
    border-radius: var(--r-p); padding: .7rem .8rem; min-height: 44px;
    color: var(--texto); font-family: var(--corpo); font-size: .88rem;
    line-height: 1.45; text-align: left; cursor: pointer;
    transition: border-color var(--d-toque) var(--saida), background var(--d-toque) var(--saida);
  }

  @media (hover: hover) {
    .alt:not(:disabled):hover { border-color: var(--latao); }
  }

  .alt:focus-visible { outline: 2px solid var(--latao); outline-offset: 1px; }

  .alt-letra {
    font-family: var(--dado); font-weight: 700; color: var(--texto-3);
    min-width: 1.1rem;
  }

  /* Depois de responder: cor E palavra. Quem não distingue verde de vermelho
     lê o rótulo -- cor sozinha não é informação. */
  .alt.certa {
    border-color: var(--oliva-c);
    background: color-mix(in srgb, var(--oliva) 14%, transparent);
  }

  .alt.certa .alt-letra { color: var(--oliva-c); }

  .alt.errada {
    border-color: var(--brasa-c);
    background: color-mix(in srgb, var(--brasa) 12%, transparent);
  }

  .alt.errada .alt-letra { color: var(--brasa-c); }

  .alt:disabled { cursor: default; }

  .veredito {
    font-family: var(--dado); font-size: .62rem; letter-spacing: .14em;
    text-transform: uppercase; margin-left: auto; white-space: nowrap;
  }

  .veredito.boa { color: var(--oliva-c); }

  .veredito.ma { color: var(--brasa-c); }
  /* 03/10/2026 (BAN-02): avisar que a questao tem erro. Discreto de proposito:
     e para quem achou o erro, nao um convite a cada questao. */
  .reportar { margin-top: var(--e3); font-size: var(--t-xs); color: var(--texto-3); }
  .reportar-abrir { background: none; border: none; padding: 0; color: var(--texto-3); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .reportar-motivos { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e2); }
  .reportar-motivos button { background: var(--casco-2); border: 1px solid var(--linha); color: var(--texto-2); border-radius: var(--r-p); padding: 6px 10px; font: inherit; font-size: var(--t-xs); cursor: pointer; min-height: 32px; }
  @media (hover: hover) { .reportar-abrir:hover, .reportar-motivos button:hover { color: var(--texto); } }

  /* A explicacao do gabarito. Aparece so DEPOIS de responder -- antes seria
     entregar a resposta. Fica recolhida atras de um resumo curto para nao
     poluir a tela de quem so quer emendar uma questao na outra, que foi a
     ressalva dele: "se voce achar que vai ficar muito poluido, nao precisa". */
  /* ── O TEXTO DE APOIO (Cebraspe e afins) ──────────────────────────────
     O item "A transferencia da policia marca uma mudanca de paradigma" nao se
     julga sem o texto que vem antes. Recolhido quando e longo, para nao
     empurrar a afirmacao para baixo da dobra; aberto quando e so o comando. */
  .apoio {
    background: var(--breu); border: 1px solid var(--linha);
    border-radius: var(--r-p); padding: .6rem .8rem; margin-bottom: var(--e3);
    font-size: .84rem; line-height: 1.6; color: var(--texto-2);
  }
  .apoio summary {
    cursor: pointer; list-style: none; padding-block: .4rem; margin-block: -.4rem;   /* area de toque >= 24 px sem mexer na pagina (04/10, UX-08) */
    font-family: var(--dado); font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--latao-c);
  }
  .apoio summary::-webkit-details-marker { display: none; }
  .apoio summary::before { content: '▸ '; }
  .apoio[open] summary::before { content: '▾ '; }
  .apoio-texto { margin-top: .5rem; white-space: pre-wrap; max-height: 22rem; overflow-y: auto; }

  /* Certo/Errado: dois botoes lado a lado, grandes -- e uma decisao binaria,
     e botao pequeno com letra "c)" faria parecer alternativa de multipla. */
  .alts.ce { grid-template-columns: 1fr 1fr; }
  .alts.ce .alt { justify-content: center; font-family: var(--display); font-weight: 700;
                  font-size: .95rem; letter-spacing: .04em; min-height: 52px; }

  .explicacao {
    margin-top: var(--e3);
    border-left: 2px solid var(--oliva-c);
    background: color-mix(in srgb, var(--oliva) 8%, transparent);
    border-radius: var(--r-p);
    padding: .6rem .8rem;
    font-size: .84rem; line-height: 1.55; color: var(--texto-2);
  }

  .explicacao summary {
    cursor: pointer; list-style: none;
    font-family: var(--dado); font-size: .62rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--oliva-c);
  }

  .explicacao summary::-webkit-details-marker { display: none; }

  .explicacao summary::before { content: '▸ '; }

  .explicacao[open] summary::before { content: '▾ '; }

  .explicacao-texto { margin-top: .5rem; white-space: pre-wrap; }

  .placar-final {
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--latao); border-radius: var(--r-p);
    padding: var(--e4); margin-bottom: var(--e3);
  }

  .placar-final-num {
    font-family: var(--dado); font-weight: 700; font-size: var(--t-2xl);
    color: var(--latao-c); line-height: 1; font-variant-numeric: tabular-nums;
  }

  .convite {
    border: 1px solid color-mix(in srgb, var(--latao) 40%, transparent);
    border-radius: var(--r-p); padding: var(--e3); margin-top: var(--e3);
    font-size: .84rem; color: var(--texto-2); line-height: 1.5;
  }


  /* ── AS DUAS ABAS ────────────────────────────────────────────────────────
     "Acervo" são as provas que nós conferimos. "Minhas questões" é o material
     que a própria pessoa sobe — e os dois NUNCA se misturam. O que ela sobe
     pode ser apostila comprada ou PDF de cursinho: publicar isso por engano
     seria distribuir o que não é nosso.

     Por isso as duas abas têm cores de borda diferentes, e a de baixo diz
     "só você vê" em letra grande. A separação tem de ser óbvia na tela,
     não só no banco de dados. */
  .abas {
    display: flex; gap: 0; border-bottom: 1px solid var(--linha);
    margin-bottom: var(--e4);
  }

  .aba {
    background: none; border: none; cursor: pointer;
    padding: .7rem var(--e3); margin-bottom: -1px;
    font-family: var(--display); font-weight: 700; font-size: .84rem;
    color: var(--texto-3); border-bottom: 2px solid transparent;
    transition: color var(--d-dica) var(--saida), border-color var(--d-dica) var(--saida);
    min-height: 44px;
  }

  .aba.ativa { color: var(--latao-c); border-bottom-color: var(--latao); }

  @media (hover: hover) and (pointer: fine) {
    .aba:not(.ativa):hover { color: var(--texto-2); }
  }

  .aba-conta {
    font-family: var(--dado); font-size: .68rem; color: var(--texto-3);
    margin-left: .35rem;
  }

  /* A área de subir PDF, na aba particular. */
  .minha-bancada {
    background: var(--casco-2); border: 1px solid var(--linha);
    border-left: 3px solid var(--oliva-c); border-radius: var(--r-p);
    padding: var(--e3); margin-bottom: var(--e4);
  }

  .so-voce {
    display: inline-flex; align-items: center; gap: .35rem;
    font-family: var(--dado); font-size: .6rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--oliva-c);
    border: 1px solid color-mix(in srgb, var(--oliva) 50%, transparent);
    border-radius: var(--r-p); padding: .15rem .45rem; margin-bottom: var(--e2);
  }

  .solta-minha {
    border: 2px dashed var(--linha); border-radius: var(--r-g);
    padding: var(--e4) var(--e3); text-align: center; margin-top: var(--e3);
    transition: border-color var(--d-toque) var(--saida), background var(--d-toque) var(--saida);
  }

  .solta-minha.por-cima {
    border-color: var(--oliva-c);
    background: color-mix(in srgb, var(--oliva) 10%, transparent);
  }

  body.arrastando-arquivo::after {
    content: 'Solte o PDF em qualquer lugar';
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--breu) 82%, transparent);
    border: 3px dashed var(--oliva-c);
    font-family: var(--display); font-weight: 700; font-size: var(--t-lg);
    color: var(--oliva-c); pointer-events: none;
  }

  .minha-linha {
    display: flex; gap: var(--e2); align-items: center; flex-wrap: wrap;
    background: var(--casco); border: 1px solid var(--linha);
    border-left: 3px solid var(--oliva-c); border-radius: var(--r-p);
    padding: .6rem .8rem; margin-bottom: .35rem; font-size: .82rem;
  }

  .minha-linha .texto { flex: 1; min-width: 12rem; color: var(--texto-2); }

  .btn-apagar {
    background: none; border: 1px solid var(--linha); color: var(--texto-3);
    border-radius: var(--r-p); padding: .3rem .6rem; cursor: pointer;
    font-family: var(--dado); font-size: .6rem; letter-spacing: .1em;
    text-transform: uppercase; min-height: 32px;
  }

  @media (hover: hover) and (pointer: fine) {
    .btn-apagar:hover { border-color: var(--brasa); color: var(--brasa-c); }
  }

  .campo-min { display: flex; flex-direction: column; gap: .25rem; }

  .campo-min label {
    font-family: var(--dado); font-size: .58rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-3);
  }

  .campo-min input {
    background: var(--breu); border: 1px solid var(--linha); color: var(--texto);
    border-radius: var(--r-p); padding: .5rem .6rem; font-family: var(--corpo);
    font-size: .85rem; min-height: 44px; min-width: 12rem;
  }

  .campo-min input:focus { outline: 2px solid var(--oliva-c); outline-offset: 1px; }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 1.25rem; }
    .filtro select { min-width: 100%; }
    .filtro { width: 100%; }
  }
</style>

<script type="module">
  import { supabase, esc, att, exigirSessao, fazerLogout, nomeDoUsuario, toast, relatar }
    from './assets/js/astral.js?v=224dc907';
  import { pdfParaLeituras, ligarArrastar } from './assets/js/pdf-para-texto.js?v=e2aa35f7';

  const $ = (id) => document.getElementById(id);

  let filtros = null;     // o que o acervo tem, vindo do servidor
  let questoes = [];      // a rodada atual
  let respostas = {};     // id da questao -> letra escolhida
  // Qual aba esta aberta. Fica no navegador so por conveniencia -- quem manda
  // no que cada um ve e a policy da tabela, nao esta variavel.
  let aba = 'acervo';
  try { aba = localStorage.getItem('astral_aba_questoes') || 'acervo'; } catch { /* aba anonima */ }

  // ── Os filtros ────────────────────────────────────────────────────────────
  function montarFiltros() {
    const mats = filtros.materias || [];
    const bancas = filtros.bancas || [];
    const anos = filtros.anos || [];

    return `
      <div class="filtros">
        <div class="filtros-linha">
          <div class="filtro">
            <label for="f-materia">Matéria</label>
            <select id="f-materia" autocomplete="off">
              <option value="">Todas</option>
              ${mats.map((m) => `<option value="${att(m.nome)}">${esc(m.nome)} (${m.quantas})</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="f-assunto">Assunto</label>
            <select id="f-assunto" autocomplete="off" disabled>
              <option value="">Escolha a matéria primeiro</option>
            </select>
          </div>
          <div class="filtro">
            <label for="f-banca">Banca</label>
            <select id="f-banca" autocomplete="off">
              <option value="">Todas</option>
              ${bancas.map((b) => `<option value="${att(b.nome)}">${esc(b.nome)} (${b.quantas})</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="f-prova">Concurso</label>
            <select id="f-prova" autocomplete="off">
              <option value="">Todos</option>
              ${(filtros.provas || []).map((p) =>
                `<option value="${att(p.nome)}" data-banca="${att(p.banca)}">`
                + `${esc(p.banca)} — ${esc(p.nome)} (${p.quantas})</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="f-ano">Ano</label>
            <select id="f-ano" autocomplete="off">
              <option value="">Todos</option>
              ${anos.map((a) => `<option value="${att(String(a))}">${esc(String(a))}</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="btn-sortear">&nbsp;</label>
            <div style="display:flex;gap:.4rem">
              <button class="btn btn-roxo btn-primary" id="btn-sortear" style="min-height:44px">Começar</button>
              <!-- Com os filtros encadeados, uma escolha esconde opcoes das outras
                   caixas: "Limpar" volta tudo para Todos de uma vez. -->
              <button class="btn btn-fantasma" id="btn-limpar" type="button" style="min-height:44px">Limpar</button>
            </div>
          </div>
        </div>
        <div class="cota" id="cota"></div>
      </div>

      <!-- 🔴 DIZER O QUE NAO TEM. Pedido dele em 22/09/2026: "caso nao tenha,
           talvez um aviso para as pessoas". Uma tela de filtros que oferece
           so uma banca, sem explicar, parece produto quebrado -- e nao e:
           e produto honesto com o material que existe de graca. -->
      <details class="convite" style="margin-bottom:var(--e4)">
        <summary style="cursor:pointer;font-family:var(--display);font-weight:700;padding-block:.4rem;margin-block:-.4rem">
          Não achou o seu concurso aqui?
        </summary>
        <div style="margin-top:var(--e3);line-height:1.6">
          O acervo tem hoje <strong>${filtros.total} questões</strong> de
          ${(filtros.bancas || []).map((b) => esc(b.nome)).join(', ')} — provas que são
          <strong>documento público</strong> e trazem o gabarito oficial no próprio arquivo.
          <br><br>
          Bombeiros, Marinha, Polícia e outras escolas publicam as provas, mas quase sempre com o
          <strong>gabarito em arquivo separado</strong>. Sem a resposta certa a questão não dá para
          estudar — e chutar seria pior que não ter. Por isso elas ainda não estão aqui:
          <strong>é honestidade, não desleixo.</strong> Estamos atrás delas.
          <br><br>
          <strong>Enquanto isso:</strong> se você tem o PDF de uma prova antiga do seu concurso,
          traga a sua em <button class="btn btn-fantasma" data-aba="minhas"
          style="padding:.3rem .7rem;font-size:.78rem">Minhas questões</button> — ela é lida no
          seu navegador e fica guardada só para você.
        </div>
      </details>

      <div id="rodada"></div>`;
  }

  /* ── FILTROS ENCADEADOS (29/09/2026) ────────────────────────────────────
     Pedido dele: "eu escolho a materia de biologia que tem apenas 18 questoes,
     eu quero que os filtros subsequentes se adequem a ele". Antes cada caixa
     listava o acervo inteiro, e dava para montar combinacao que nao existe.

     Agora o servidor manda as COMBINACOES que existem (materia, assunto, banca,
     prova, ano, quantas), e cada caixa oferece so o que casa com o que ja esta
     escolhido nas OUTRAS -- com a contagem daquele cruzamento. Uma escolha que
     deixou de existir volta para "Todos", em vez de ficar presa.

     E o assunto: materia que ainda nao tem assunto marcado nao mostra mais
     "esta materia ainda nao tem assunto" -- a caixa simplesmente some. */
  const CAMPOS = [
    ['f-materia', 'm', 'Todas'], ['f-assunto', 'a', 'Todos os assuntos'],
    ['f-banca', 'b', 'Todas'], ['f-prova', 'p', 'Todos'], ['f-ano', 'y', 'Todos'],
  ];

  function escolhido(id) { return $(id)?.value || ''; }

  function opcoesDe(chave, exceto) {
    const conta = new Map();
    const sel = Object.fromEntries(CAMPOS.map(([id, k]) => [k, escolhido(id)]));
    for (const c of filtros.combinacoes || []) {
      const casa = CAMPOS.every(([, k]) => k === exceto || !sel[k] || String(c[k] ?? '') === sel[k]);
      if (!casa || c[chave] == null) continue;
      const v = String(c[chave]);
      conta.set(v, (conta.get(v) || 0) + c.n);
    }
    return conta;
  }

  function atualizarFiltros() {
    if (!filtros.combinacoes) return atualizarAssuntos();   // servidor antigo: como antes
    // Duas voltas: uma escolha desfeita pode liberar opcoes nas outras caixas.
    for (let volta = 0; volta < 2; volta++) {
      for (const [id, k, todos] of CAMPOS) {
        const el = $(id);
        if (!el) continue;
        const atual = el.value;
        const conta = opcoesDe(k, k);
        let chaves = [...conta.keys()];
        chaves = k === 'y' ? chaves.sort((x, z) => z - x) : chaves.sort((x, z) => x.localeCompare(z, 'pt-BR'));
        if (k === 'a') {
          // Sem materia escolhida, ou materia sem assunto marcado: a caixa some.
          const bloco = el.closest('.filtro');
          const mostrar = !!escolhido('f-materia') && chaves.length > 0;
          if (bloco) bloco.hidden = !mostrar;
          el.disabled = !mostrar;
          if (!mostrar) { el.innerHTML = `<option value="">${todos}</option>`; continue; }
        }
        el.innerHTML = `<option value="">${todos}</option>` + chaves.map((v) =>
          `<option value="${att(v)}"${v === atual ? ' selected' : ''}>${esc(v)} (${conta.get(v)})</option>`).join('');
        if (atual && !conta.has(atual)) el.value = '';
      }
    }
  }

  // Mantida para o caso de a funcao do servidor ainda nao mandar `combinacoes`.
  function atualizarAssuntos() {
    const sel = $('f-assunto');
    const nome = $('f-materia').value;
    const mat = (filtros.materias || []).find((m) => m.nome === nome);
    const lista = mat?.assuntos || [];
    const bloco = sel.closest('.filtro');
    if (!nome || !lista.length) {
      sel.innerHTML = '<option value="">Todos os assuntos</option>';
      sel.disabled = true;
      if (bloco) bloco.hidden = true;
      return;
    }
    if (bloco) bloco.hidden = false;
    sel.disabled = false;
    sel.innerHTML = '<option value="">Todos os assuntos</option>'
      + lista.map((a) => `<option value="${att(a.nome)}">${esc(a.nome)} (${a.quantas})</option>`).join('');
  }

  /* 09/10/2026 (auditoria LGL-06, roadmap 3.18): a FONTE de cada questao -- banca,
     prova, ano e numero. Mostrava so "banca ano". Citar a origem e o que a Lei
     9.610 (art. 8o, IV) pede de quem reproduz texto de prova oficial, e e o que
     deixa o aluno conferir no caderno original. Questao sem banca (a que o
     proprio aluno cadastrou) nao inventa fonte. */
  function fonteDa(q) {
    if (!q.banca) return '';
    const partes = [q.banca, q.prova, q.ano].filter((x) => x != null && String(x).trim() !== '').map((x) => esc(String(x)));
    const numero = q.numero ? ` · nº ${esc(String(q.numero))}` : '';
    return `<span class="selo fonte" title="Fonte: a prova original">Fonte: ${partes.join(' · ')}${numero}</span>`;
  }

  // ── A rodada ──────────────────────────────────────────────────────────────
  function desenharQuestao(q, i) {
    const alts = Object.entries(q.alternativas || {}).sort();
    return `
      <div class="questao" data-q="${att(String(q.id))}">
        <div class="questao-topo">
          ${fonteDa(q)}
          <span class="selo">${esc(q.materia)}</span>
          ${q.assunto ? `<span class="selo assunto">${esc(q.assunto)}</span>` : ''}
          <span class="selo">questão ${esc(String(i + 1))} de ${questoes.length}</span>
          <span class="veredito" data-veredito="${att(String(q.id))}"></span>
        </div>
        ${q.texto_apoio ? `
          <details class="apoio"${q.texto_apoio.length < 400 ? ' open' : ''}>
            <summary>Texto de apoio</summary>
            <div class="apoio-texto">${esc(q.texto_apoio)}</div>
          </details>` : ''}
        ${q.imagem ? `
          <!-- 03/10/2026 (roadmap 3.4): a questao como foi IMPRESSA no caderno oficial --
               raiz, fracao, matriz e figura que o texto do PDF nao reproduz. Tocar abre maior. -->
          <a class="questao-imagem" href="${att(q.imagem)}" target="_blank" rel="noopener">
            <img src="${att(q.imagem)}" loading="lazy" decoding="async"
                 alt="Questão ${att(String(q.numero ?? ''))} da prova ${att(q.prova || '')}, como foi impressa no caderno oficial">
          </a>
          <p class="questao-imagem-nota">Imagem do caderno oficial da prova. Toque para ampliar.</p>`
          : `<div class="questao-enunciado">${esc(q.enunciado)}</div>`}
        ${q.tipo === 'certo_errado' ? `
          <div class="alts ce">
            <button class="alt" data-responder="${att(String(q.id))}" data-letra="c">Certo</button>
            <button class="alt" data-responder="${att(String(q.id))}" data-letra="e">Errado</button>
          </div>` : `
          <div class="alts">
            ${alts.map(([letra, texto]) => `
              <button class="alt${q.imagem ? ' so-letra' : ''}" data-responder="${att(String(q.id))}" data-letra="${att(letra)}"${q.imagem ? ` aria-label="Alternativa ${att(letra)}"` : ''}>
                <span class="alt-letra">${esc(letra)})</span>
                ${q.imagem ? '' : `<span>${esc(texto)}</span>`}
              </button>`).join('')}
          </div>`}
        <div data-explicacao="${att(String(q.id))}"></div>
        ${q._origem === 'minha' ? '' : `
          <div class="reportar" data-reportar="${att(String(q._idReal ?? q.id))}">
            <button type="button" class="reportar-abrir">Achou um erro nesta questão? Avise</button>
          </div>`}
      </div>`;
  }

  /* 03/10/2026 (auditoria BAN-02): "reportar erro". Um clique abre os motivos;
     o segundo grava em questoes_reportadas (uma linha por pessoa e questao).
     Os detectores da auditoria tiraram 300 questoes do ar, mas gabarito errado
     com enunciado perfeito so quem estuda percebe. O checa-saude avisa o Lucas. */
  const MOTIVOS = [['gabarito', 'Gabarito errado'], ['enunciado', 'Enunciado ou alternativas com erro'],
                   ['figura', 'Falta figura ou tabela'], ['outro', 'Outro']];
  document.addEventListener('click', async (e) => {
    const caixa = e.target.closest('[data-reportar]');
    if (!caixa) return;
    if (e.target.closest('.reportar-abrir')) {
      caixa.innerHTML = 'Qual é o problema?<div class="reportar-motivos">'
        + MOTIVOS.map(([v, r]) => `<button type="button" data-motivo="${v}">${r}</button>`).join('') + '</div>';
      return;
    }
    const b = e.target.closest('[data-motivo]');
    if (!b) return;
    caixa.querySelectorAll('button').forEach((x) => { x.disabled = true; });
    const { error } = await supabase.from('questoes_reportadas')
      .insert({ questao_id: Number(caixa.dataset.reportar), motivo: b.dataset.motivo });
    // 23505 = ja tinha avisado desta questao: para quem clicou, o resultado e o mesmo.
    if (error && error.code !== '23505') {
      relatar(error, 'banco/reportar');
      caixa.querySelectorAll('button').forEach((x) => { x.disabled = false; });
      toast('Não consegui enviar agora. Tente de novo.');
      return;
    }
    caixa.textContent = 'Obrigado — esta questão vai ser revisada.';
  });

  /* 08/10/2026 (auditoria GAM-03, roadmap 3.12): o gabarito do ACERVO nao vem mais
     junto com a questao -- quem abria o console respondia 10 de 10 de primeira. Ele
     chega na resposta do servidor (registrar_resposta), DEPOIS de a resposta estar
     gravada. A questao da propria pessoa (aba "Minhas") continua com o gabarito na
     mao: e dela, nao ha o que esconder. */
  async function responder(id, letra) {
    if (respostas[id]) return;              // já respondeu: não se muda a resposta
    const q = questoes.find((x) => String(x.id) === String(id));
    if (!q) return;
    respostas[id] = letra;

    const bloco = document.querySelector(`.questao[data-q="${CSS.escape(String(id))}"]`);
    const botoes = bloco.querySelectorAll('.alt');
    botoes.forEach((b) => { b.disabled = true; });
    const v = bloco.querySelector(`[data-veredito="${CSS.escape(String(id))}"]`);

    if (q._origem !== 'minha') {
      v.textContent = 'corrigindo…';
      v.className = 'veredito';
      const { data, error } = await supabase.rpc('registrar_resposta',
        { p_origem: 'acervo', p_id: q._idReal ?? q.id, p_letra: letra });
      // (durante a troca, o servidor antigo ainda mandava o gabarito no sorteio: vale o que houver)
      if (error || !data || !(data.gabarito || q.gabarito)) {
        // Sem a correcao do servidor nao ha veredito: a resposta NAO conta, e a pessoa tenta de novo.
        relatar(error || new Error('correcao sem gabarito'), 'banco/registrar');
        delete respostas[id];
        botoes.forEach((b) => { b.disabled = false; });
        v.textContent = 'não consegui corrigir agora — toque de novo';
        v.className = 'veredito ma';
        return;
      }
      q.gabarito = data.gabarito || q.gabarito;
      q.explicacao = data.explicacao ?? q.explicacao;
    }

    botoes.forEach((b) => {
      if (b.dataset.letra === q.gabarito) b.classList.add('certa');
      else if (b.dataset.letra === letra) b.classList.add('errada');
    });
    /* 🔴 22/09/2026: aqui saia "a certa era null". No acervo publico isso nao
       podia acontecer (questao sem gabarito nao entra), mas na aba particular
       PODE -- muita prova de banca civil publica o gabarito em arquivo
       separado, e a pessoa sobe o caderno mesmo assim. A tela tem de dizer a
       verdade nesse caso, nao imprimir "null". */
    if (!q.gabarito) {
      v.textContent = 'esta prova veio sem gabarito';
      v.className = 'veredito';
      return;
    }
    const acertou = letra === q.gabarito;
    if (q._origem === 'minha') registrarNoCaderno(q, letra);   // a do acervo ja foi gravada acima
    // Multipla: "a certa era c". Certo/Errado: "o gabarito e Errado" --
    // "a certa era Certo" soaria estranho, e o que o Cebraspe publica e o
    // gabarito do item, nao uma alternativa.
    const nomeDaCerta = q.tipo === 'certo_errado'
      ? (q.gabarito === 'c' ? 'Certo' : 'Errado')
      : q.gabarito;
    v.textContent = acertou ? 'acertou'
      : (q.tipo === 'certo_errado' ? 'o gabarito é ' : 'a certa era ') + nomeDaCerta;
    v.className = 'veredito ' + (acertou ? 'boa' : 'ma');

    /* 🔴 A explicacao so entra AGORA. Desenha-la junto com a questao, mesmo
       escondida, poria a resposta no HTML da pagina -- e quem abrisse o
       inspetor leria o gabarito sem responder. */
    if (q.explicacao) {
      const alvo = bloco.querySelector(`[data-explicacao="${CSS.escape(String(id))}"]`);
      if (alvo) {
        alvo.innerHTML = `<details class="explicacao"${acertou ? '' : ' open'}>
          <summary>Por que a resposta é ${esc(q.gabarito)}</summary>
          <div class="explicacao-texto">${esc(q.explicacao)}</div>
        </details>`;
      }
    }

    if (Object.keys(respostas).length === questoes.length) mostrarPlacar();
  }

  function mostrarPlacar() {
    // So entram na conta as que TEM resposta certa conhecida. Contar as sem
    // gabarito como erro daria uma porcentagem que nao quer dizer nada.
    const contaveis = questoes.filter((q) => q.gabarito);
    if (!contaveis.length) return;
    const acertos = contaveis.filter((q) => respostas[q.id] === q.gabarito).length;
    const pct = Math.round((acertos / contaveis.length) * 100);
    const div = document.createElement('div');
    div.className = 'placar-final';
    div.innerHTML = `
      <div class="placar-final-num">${acertos}/${contaveis.length}</div>
      <div style="font-size:.85rem;color:var(--texto-2);margin-top:.3rem">
        ${pct}% de acerto nesta rodada. ${pct >= 70
          ? 'Terreno dominado — vale trocar de assunto.'
          : 'Este assunto ainda cobra preço. Vale repetir amanhã.'}
      </div>`;
    $('rodada').prepend(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function sortear() {
    const btn = $('btn-sortear');
    btn.disabled = true; btn.textContent = 'Sorteando…';
    respostas = {};

    const { data, error } = await supabase.rpc('sortear_questoes', {
      p_materia: $('f-materia').value || null,
      p_assunto: $('f-assunto').value || null,
      p_banca: $('f-banca').value || null,
      p_prova: $('f-prova').value || null,
      p_ano: $('f-ano').value ? parseInt($('f-ano').value, 10) : null,
      p_limite: 10,
    });

    btn.disabled = false; btn.textContent = 'Sortear outras';

    if (error) { relatar(error, 'banco/sortear'); toast('Não consegui buscar as questões agora.'); return; }

    atualizarCota(data);
    questoes = data.questoes || [];

    if (!questoes.length) {
      $('rodada').innerHTML = data.acabou
        ? `<div class="card"><div class="empty-title">A amostra de hoje acabou</div>
             <div class="vazio-texto">${esc(data.motivo || '')}<br><br>
             Ela se renova amanhã. No Pro não há amostra: o acervo é liberado por inteiro,
             inclusive as provas dos últimos anos.</div></div>`
        /* 🔴 27/09/2026 -- ELE DISSE QUE O FILTRO NAO FUNCIONAVA, E FUNCIONAVA.
           Medido contra o servidor: no plano Pro todas as combinacoes devolvem
           questao. No gratis, "so Enfermagem" devolvia ZERO -- porque as 209
           questoes de Enfermagem sao de provas de 2024 a 2026, e a amostra
           gratis so mostra prova de 4 anos ou mais.

           A tela entao dizia "nao ha questao publicada com essa combinacao".
           Isso era MENTIRA: havia 209, trancadas. O servidor ja devolvia o
           numero certo em `fora_da_amostra`; a tela so nao usava. Quem ve
           "nao ha" conclui que o produto esta quebrado -- e foi exatamente o
           que o dono do produto concluiu. */
        : (data.fora_da_amostra > 0
          ? `<div class="card"><div class="empty-title">Essas questões existem — e ficam no Pro</div>
               <div class="vazio-texto">Há <strong>${data.fora_da_amostra} questões</strong> com esse
               filtro, mas todas são de <strong>provas dos últimos 4 anos</strong>. A amostra grátis
               mostra as provas mais antigas; as recentes, que são as que mais parecem com a sua
               prova, ficam liberadas no Pro.<br><br>
               Para estudar agora de graça, tente outro filtro — ou deixe o ano em "todos".</div></div>`
          : `<div class="card"><div class="empty-title">Nada com esses filtros</div>
               <div class="vazio-texto">Não há questão publicada com essa combinação. Tente afrouxar
               um dos filtros — por exemplo, deixar o ano em "todos".</div></div>`);
      return;
    }

    $('rodada').innerHTML = questoes.map(desenharQuestao).join('');
    $('rodada').querySelectorAll('[data-responder]').forEach((b) => {
      b.addEventListener('click', () => responder(b.dataset.responder, b.dataset.letra));
    });
    $('rodada').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function atualizarCota(data) {
    const el = $('cota');
    if (!data || data.limite_do_dia == null) {
      el.innerHTML = '<span>Acervo liberado por inteiro.</span>';
      return;
    }
    const usadas = data.vistas_hoje ?? 0;
    const fora = data.fora_da_amostra ?? 0;
    el.innerHTML = `
      <span><span class="cota-num">${usadas}</span> de <span class="cota-num">${data.limite_do_dia}</span> questões da amostra de hoje</span>
      ${fora > 0 ? `<span>· <span class="cota-num">${fora}</span> de provas recentes ficam fora da amostra</span>` : ''}`;
  }


  /* ══ MINHAS QUESTÕES ══════════════════════════════════════════════════════
     Pedido dele em 22/09/2026: "caso não conseguimos colocar lá e o aluno
     pense 'poxa, queria ter algo aqui para eu poder estudar', ele mesmo
     consegue adicionar, mas isso SÓ PARA ELE."

     🔴 Os dois mundos NUNCA se tocam. O que a pessoa sobe pode ser apostila
     comprada, PDF de cursinho, material com dono — publicar isso por engano
     seria distribuir o que não é nosso. A separação está no banco (tabela
     `questoes_minhas`, com policy por auth.uid()) e está na tela, em cor e
     em palavra: "só você vê". */
  let minhas = [];
  let loteMinhas = [];

  async function carregarMinhas() {
    const { data, error } = await supabase
      .from('questoes_minhas')
      .select('id,origem,materia,assunto,enunciado,alternativas,gabarito,tipo,texto_apoio,explicacao')
      .order('id', { ascending: false });
    if (error) { relatar(error, 'banco/minhas'); return; }
    minhas = data || [];
  }

  function telaMinhas() {
    return `
      <div class="minha-bancada">
        <span class="so-voce">🔒 só você vê</span>
        <div style="font-size:.85rem;color:var(--texto-2);line-height:1.5">
          Não achou a prova do seu concurso aqui? <strong>Traga a sua.</strong>
          Solte o PDF e ele é lido <strong>dentro do seu navegador</strong> — o arquivo
          não sai do seu computador. As questões ficam guardadas na sua conta, e
          <strong>ninguém mais tem acesso a elas</strong>: nem outros alunos, nem o acervo público.
        </div>
        <div class="filtros-linha" style="margin-top:var(--e3)">
          <div class="campo-min">
            <label for="m-origem">De onde é</label>
            <input id="m-origem" type="text" maxlength="80" placeholder="CBMERJ 2024, apostila do cursinho…" />
          </div>
        </div>
        <div class="solta-minha" id="solta-minha">
          <div style="font-family:var(--display);font-weight:600;margin-bottom:.3rem">Solte o PDF da prova aqui</div>
          <div style="font-size:.8rem;color:var(--texto-3)">
            ou <label for="m-pdf" style="color:var(--oliva-c);cursor:pointer;text-decoration:underline">escolha o arquivo</label>
          </div>
          <input id="m-pdf" type="file" accept="application/pdf" style="position:absolute;width:1px;height:1px;opacity:0" />
        </div>

        <!-- 🔴 Quase toda banca civil publica o gabarito em arquivo SEPARADO.
             Sem ele a questao entra sem resposta certa, e da para treinar mas
             nao da para conferir. Este segundo campo e o que fecha a conta. -->
        <div class="solta-minha" id="solta-gab" style="margin-top:var(--e2);padding:var(--e3)">
          <div style="font-size:.82rem;color:var(--texto-2)">
            <strong>Tem o gabarito?</strong> Solte-o aqui também —
            <label for="m-gab" style="color:var(--oliva-c);cursor:pointer;text-decoration:underline">ou escolha o arquivo</label>.
            Quase toda banca publica o gabarito num PDF à parte.
          </div>
          <div id="m-gab-estado" style="font-size:.78rem;color:var(--texto-3);margin-top:.35rem"></div>
          <input id="m-gab" type="file" accept="application/pdf" style="position:absolute;width:1px;height:1px;opacity:0" />
        </div>
        <div id="m-lote"></div>
      </div>

      <div class="filtros">
        <div class="filtros-linha">
          <div class="filtro">
            <label for="m-materia">Matéria</label>
            <select id="m-materia" autocomplete="off">
              <option value="">Todas</option>
              ${[...new Set(minhas.map((q) => q.materia).filter(Boolean))].sort()
                .map((m) => `<option value="${att(m)}">${esc(m)}</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="btn-estudar-minhas">&nbsp;</label>
            <button class="btn btn-roxo btn-primary" id="btn-estudar-minhas" style="min-height:44px">Estudar as minhas</button>
          </div>
        </div>
        <div class="cota">
          <span><span class="cota-num">${minhas.length}</span> questões suas guardadas</span>
          ${minhas.length >= 1800 ? '<span>· o limite por conta é 2.000</span>' : ''}
        </div>
      </div>

      <div id="rodada-minhas"></div>

      ${minhas.length ? `
        <div class="section-title" style="margin-top:var(--e5)">O que você já guardou</div>
        ${minhas.slice(0, 60).map((q) => `
          <div class="minha-linha">
            <span class="selo">${esc(q.origem)}</span>
            ${q.materia ? `<span class="selo assunto">${esc(q.materia)}</span>` : ''}
            <span class="texto">${esc(String(q.enunciado).slice(0, 90))}…</span>
            <button class="btn-apagar" data-apagar="${att(String(q.id))}">apagar</button>
          </div>`).join('')}
        ${minhas.length > 60 ? `<div style="font-size:.8rem;color:var(--texto-3);margin-top:var(--e2)">
          …e mais ${minhas.length - 60}. Todas entram no sorteio.</div>` : ''}

  /* O gabarito que o aluno trouxe. Fica guardado ate ele soltar a prova --
     a ordem nao importa, porque ninguem lembra de soltar na ordem certa. */
  let gabaritoDoAluno = null;

  async function abrirGabaritoMinhas(arquivo) {
    if (!arquivo) return;
    if (arquivo.type && arquivo.type !== 'application/pdf') { toast('O gabarito também precisa ser um PDF.'); return; }
    const estado = $('m-gab-estado');
    estado.textContent = 'lendo o gabarito…';
    try {
      const { gabaritoDeTabela } = await import('./assets/js/prova.js?v=25b893ea');
      const texto = (await pdfParaLeituras(arquivo)).join('\n');
      let g = gabaritoDeTabela(texto);

      /* 🔴 UM ARQUIVO, VARIAS PROVAS. Quando o gabarito traz TIPO A, B, C...
         com respostas diferentes, perguntar e a unica saida honesta: colar a
         resposta do tipo errado poria a resposta certa na questao errada. */
      if (g.ambiguo && g.secoes.length > 1) {
        const escolha = prompt(
          'Este gabarito tem ' + g.secoes.length + ' tipos de prova (' + g.secoes.join(', ') + ').\n'
          + 'Qual é o tipo do SEU caderno?');
        if (!escolha) { estado.textContent = 'gabarito não usado — sem saber o tipo, não dá para casar.'; return; }
        g = gabaritoDeTabela(texto, { secao: escolha.trim() });
      }

      if (g.ambiguo || !g.respostas.size) {
        gabaritoDoAluno = null;
        estado.innerHTML = '<span style="color:var(--brasa-c)">não consegui ler este gabarito'
          + (g.ambiguo ? ' — ' + esc(g.ambiguo) : '')
          + '. As questões entram sem resposta, e ainda dá para treinar.</span>';
        return;
      }
      gabaritoDoAluno = g;
      estado.innerHTML = '<span style="color:var(--oliva-c)">✔ '
        + g.respostas.size + ' respostas lidas'
        + (g.anuladas.size ? ' (' + g.anuladas.size + ' anuladas)' : '')
        + ' — solte a prova agora.</span>';
      if (loteMinhas.length) aplicarGabaritoDoAluno();
    } catch (e) {
      relatar(e, 'banco/gabarito-aluno');
      estado.innerHTML = '<span style="color:var(--brasa-c)">não consegui abrir este PDF.</span>';
    }
  }

  function aplicarGabaritoDoAluno() {
    if (!gabaritoDoAluno || !loteMinhas.length) return;
    let casadas = 0;
    loteMinhas = loteMinhas.filter((q) => {
      if (gabaritoDoAluno.anuladas.has(q.numero)) return false;   // anulada nao serve
      const letra = gabaritoDoAluno.respostas.get(q.numero);
      // A letra tem de existir entre as alternativas -- senao o casamento
      // esta errado e e melhor deixar a questao sem resposta.
      if (letra && q.alternativas && q.alternativas[letra]) { q.gabarito = letra; casadas++; }
      return true;
    });
    return casadas;
  }

  async function abrirPdfMinhas(arquivo) {
    if (!arquivo) return;
    if (arquivo.type && arquivo.type !== 'application/pdf') { toast('Isso não é um PDF.'); return; }
    if (arquivo.size > 25 * 1024 * 1024) { toast('PDF acima de 25 MB.'); return; }

    $('m-lote').innerHTML = '<div class="esqueleto-bloco" style="height:6rem"></div>';
    try {
      const { montarQuestoes } = await import('./assets/js/prova.js?v=25b893ea');
      const { classificarLista } = await import('./assets/js/assuntos.js?v=78708ba1');
      const leituras = await pdfParaLeituras(arquivo);
      // 🔴 `incluirSemGabarito: true` aqui, e NUNCA no acervo público. Muita
      // prova de banca civil publica o gabarito em arquivo separado; no acervo
      // isso seria questão sem resposta certa, mas aqui é o material da
      // pessoa, e ela sabe de onde veio.
      const r = montarQuestoes(leituras, { incluirSemGabarito: true });
      // Certo/Errado (Cebraspe) tem 2 alternativas; multipla, 4 ou mais.
      const todas = [...r.prontas, ...r.revisar].filter((q) => {
        const n = Object.keys(q.alternativas || {}).length;
        return q.tipo === 'certo_errado' ? n === 2 : n >= 4;
      });
      loteMinhas = classificarLista(todas).questoes;
      const casadas = aplicarGabaritoDoAluno();

      if (!loteMinhas.length) {
        $('m-lote').innerHTML = `<div class="convite">Não encontrei questão nenhuma neste PDF.
          Costuma ser por um destes motivos: o arquivo é digitalizado (foto das páginas, sem texto),
          ou a banca usa um formato que eu ainda não sei ler. Nada foi guardado.</div>`;
        return;
      }
      const comGab = loteMinhas.filter((q) => q.gabarito).length;
      if (casadas) console.info('gabarito do aluno casou em', casadas, 'questoes');
      $('m-lote').innerHTML = `
        <div class="convite">
          <strong>${loteMinhas.length} questões</strong> encontradas — ${comGab} com gabarito no próprio PDF.
          ${comGab < loteMinhas.length ? `As outras ${loteMinhas.length - comGab} entram sem resposta:
            dá para responder e conferir depois, comparando com o gabarito oficial.` : ''}
          <div style="margin-top:var(--e3);display:flex;gap:var(--e3);flex-wrap:wrap;align-items:center">
            <button class="btn btn-roxo btn-primary" id="btn-guardar">Guardar na minha conta</button>
            <button class="btn btn-fantasma" id="btn-descartar">Descartar</button>
          </div>
        </div>`;
      $('btn-guardar').addEventListener('click', guardarMinhas);
      $('btn-descartar').addEventListener('click', () => { loteMinhas = []; $('m-lote').innerHTML = ''; });
    } catch (e) {
      relatar(e, 'banco/minhas-pdf');
      $('m-lote').innerHTML = `<div class="convite">Não consegui ler este PDF: ${esc(String(e.message || e))}</div>`;
    }
  }

  async function guardarMinhas() {
    const origem = ($('m-origem').value || '').trim() || 'Minha prova';
    const btn = $('btn-guardar');
    btn.disabled = true; btn.textContent = 'Guardando…';

    const { data: sessao } = await supabase.auth.getUser();
    const uid = sessao?.user?.id;
    const linhas = loteMinhas.map((q) => ({
      usuario_id: uid, origem,
      materia: q.materia || null, assunto: q.assunto || null,
      enunciado: q.enunciado, alternativas: q.alternativas,
      gabarito: q.gabarito || null,
      tipo: q.tipo || 'multipla', texto_apoio: q.texto_apoio || null,
    }));

    let guardadas = 0, recusadas = 0;
    for (let i = 0; i < linhas.length; i += 100) {
      const { error } = await supabase.from('questoes_minhas').insert(linhas.slice(i, i + 100));
      if (error) recusadas += linhas.slice(i, i + 100).length; else guardadas += Math.min(100, linhas.length - i);
    }
    btn.disabled = false; btn.textContent = 'Guardar na minha conta';

    if (!guardadas) { toast('Não consegui guardar. Talvez você tenha chegado ao limite de 2.000.'); return; }
    toast(`${guardadas} questões guardadas${recusadas ? ` (${recusadas} não couberam)` : ''}.`);
    loteMinhas = [];
    await carregarMinhas();
    await desenhar();
  }

  async function apagarMinha(id) {
    const { error } = await supabase.from('questoes_minhas').delete().eq('id', id);
    if (error) { relatar(error, 'banco/apagar-minha'); toast('Não consegui apagar.'); return; }
    await carregarMinhas();
    await desenhar();
  }

  function sortearMinhas() {
    const mat = $('m-materia').value;
    const pool = minhas.filter((q) => !mat || q.materia === mat);
    if (!pool.length) {
      $('rodada-minhas').innerHTML = `<div class="card"><div class="vazio-texto">
        Você ainda não tem questão com esse filtro.</div></div>`;
      return;
    }
    // Embaralha e pega 10.
    const baralho = [...pool];
    for (let i = baralho.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [baralho[i], baralho[j]] = [baralho[j], baralho[i]];
    }
    questoes = baralho.slice(0, 10).map((q, i) => ({
      id: 'm' + q.id, _origem: 'minha', _idReal: q.id,
      banca: q.origem, prova: q.origem, ano: '', numero: i + 1,
      materia: q.materia || 'sua questão', assunto: q.assunto,
      enunciado: q.enunciado, alternativas: q.alternativas, gabarito: q.gabarito,
      tipo: q.tipo, texto_apoio: q.texto_apoio, explicacao: q.explicacao,
    }));
    respostas = {};
    $('rodada-minhas').innerHTML = questoes.map(desenharQuestao).join('');
    $('rodada-minhas').querySelectorAll('[data-responder]').forEach((b) => {
      b.addEventListener('click', () => responder(b.dataset.responder, b.dataset.letra));
    });
    $('rodada-minhas').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }


  /* ══ CADERNO DE ERROS ═════════════════════════════════════════════════════
     Pedido dele em 27/09/2026: "muitas pessoas utilizam so o caderno de erros
     para estudar". A regra: o que voce errou volta ate voce acertar.

     Toda resposta dada em QUALQUER aba (acervo, minhas, o proprio caderno) e
     mandada ao servidor -- so a LETRA. Quem decide se errou e o servidor,
     comparando com o gabarito; a tela nao tem como mentir o resultado. */
  let caderno = { total: 0, por_materia: [], questoes: [] };

  async function carregarCaderno(materia = null, limite = 1) {
    const { data, error } = await supabase.rpc('caderno_de_erros',
      { p_materia: materia, p_limite: limite });
    if (error) { relatar(error, 'banco/caderno'); return null; }
    return data;
  }

  function registrarNoCaderno(q, letra) {
    // Fora do caminho critico: a pessoa ve o resultado na hora, e a gravacao
    // acontece por tras. Se falhar, o estudo nao para -- so aquela resposta
    // nao entra no caderno.
    const origem = q._origem || 'acervo';
    const id = q._idReal ?? q.id;
    if (!q.gabarito) return;                   // sem gabarito nao ha erro a guardar
    supabase.rpc('registrar_resposta', { p_origem: origem, p_id: id, p_letra: letra })
      .then(({ error }) => { if (error) relatar(error, 'banco/registrar'); });
  }

  function telaCaderno() {
    if (!caderno.total) {
      return `
        <div class="card" style="text-align:center;padding:var(--e5) var(--e3)">
          <div class="empty-title">Seu caderno de erros está vazio</div>
          <div class="vazio-texto">
            Toda questão que você <strong>errar</strong> — no Acervo ou nas suas — entra aqui
            sozinha. E ela <strong>só sai quando você acertar</strong>. É o jeito mais eficiente
            de estudar: gastar o tempo no que você ainda não domina.
          </div>
        </div>`;
    }
    return `
      <div class="filtros">
        <div style="font-size:.86rem;color:var(--texto-2);line-height:1.5;margin-bottom:var(--e3)">
          <strong>${caderno.total} ${caderno.total === 1 ? 'questão' : 'questões'}</strong> que você errou
          e ainda não acertou. As que você mais erra vêm primeiro. Acertou na revisão, ela sai do caderno.
        </div>
        <div class="filtros-linha">
          <div class="filtro">
            <label for="k-materia">Matéria</label>
            <select id="k-materia" autocomplete="off">
              <option value="">Todas (${caderno.total})</option>
              ${(caderno.por_materia || []).map((m) =>
                `<option value="${att(m.nome)}">${esc(m.nome)} (${m.quantas})</option>`).join('')}
            </select>
          </div>
          <div class="filtro">
            <label for="btn-revisar">&nbsp;</label>
            <button class="btn btn-roxo btn-primary" id="btn-revisar" style="min-height:44px">Revisar</button>
          </div>
        </div>
      </div>
      <div id="rodada-caderno"></div>`;
  }

  async function revisarCaderno() {
    const btn = $('btn-revisar');
    btn.disabled = true; btn.textContent = 'Carregando…';
    const dados = await carregarCaderno($('k-materia').value || null, 10);
    btn.disabled = false; btn.textContent = 'Revisar outras';
    if (!dados) { toast('Não consegui abrir o caderno agora.'); return; }

    respostas = {};
    // Prefixo no id: uma questao do acervo e uma das minhas podem ter o
    // mesmo numero, e na mesma rodada uma apagaria a outra.
    questoes = (dados.questoes || []).map((q) => ({
      ...q,
      id: (q.origem === 'minha' ? 'm' : 'a') + q.id,
      _origem: q.origem, _idReal: q.id,
      ano: q.ano ?? '',
    }));
    if (!questoes.length) {
      $('rodada-caderno').innerHTML = `<div class="card"><div class="vazio-texto">
        Nada no caderno com esse filtro.</div></div>`;
      return;
    }
    $('rodada-caderno').innerHTML = questoes.map((q, i) => {
      const cartao = desenharQuestao(q, i);
      // O que diferencia a revisao: quantas vezes ja errou, e o que marcou.
      const selo = `<span class="selo" style="color:var(--brasa-c);border-color:color-mix(in srgb,var(--brasa) 45%,transparent)">errou ${q.vezes_errou}×</span>`;
      return cartao.replace('<span class="veredito"', selo + '<span class="veredito"');
    }).join('');
    $('rodada-caderno').querySelectorAll('[data-responder]').forEach((b) => {
      b.addEventListener('click', () => responder(b.dataset.responder, b.dataset.letra));
    });
    $('rodada-caderno').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Montar ────────────────────────────────────────────────────────────────
  async function desenhar() {
    const { data, error } = await supabase.rpc('filtros_de_questoes');
    if (error) {
      relatar(error, 'banco/filtros');
      // 03/10/2026 (auditoria UX-01): a tela ficava EM BRANCO, sem aviso nenhum.
      $('conteudo').innerHTML = `
        <div class="card" role="alert" style="text-align:center;padding:var(--e5) var(--e3)">
          <div class="empty-title">Não consegui abrir o Banco agora</div>
          <div class="vazio-texto">As suas respostas e o caderno de erros estão guardados — nada se perdeu.
            Pode ser a sua internet ou o servidor por um instante.</div>
          <button type="button" class="btn btn-roxo" style="margin-top:var(--e3)" onclick="location.reload()">Tentar de novo</button>
        </div>`;
      return;
    }
    filtros = data;

    // O acervo ainda está sendo montado -- dizer isso é melhor que mostrar
    // uma tela de filtros que não filtra nada.
    if (!filtros.total) {
      const { data: souAdmin } = await supabase.rpc('sou_administrador');
      $('conteudo').innerHTML = `
        <div class="card" style="text-align:center;padding:var(--e6) var(--e3)">
          <div class="empty-title">O acervo está sendo montado</div>
          <div class="vazio-texto">
            Ainda não há nenhuma prova aqui dentro. As questões vêm de provas militares
            antigas, que são documento público — e cada prova entra depois de conferida,
            uma a uma.<br><br>
            Enquanto isso, o resto do Astral continua inteiro: o edital, o cronograma,
            o progresso, as condecorações e a árvore de habilidades.
          </div>
          ${souAdmin ? `<a class="btn btn-roxo btn-primary" href="importar.html"
             style="width:auto;display:inline-flex;margin-top:1.25rem;text-decoration:none">
             Importar a primeira prova</a>` : ''}
          <div class="convite" style="text-align:left;margin-top:var(--e4)">
            <strong>Mas você não precisa esperar.</strong> Se tem o PDF de uma prova antiga do
            seu concurso, traga a sua: ela é lida dentro do seu navegador e fica guardada
            <strong>só para você</strong>.
            <div style="margin-top:var(--e3)">
              <button class="btn btn-roxo btn-primary" data-aba="minhas">Trazer a minha prova</button>
            </div>
          </div>
        </div>`;
      document.querySelectorAll('[data-aba]').forEach((b) => b.addEventListener('click', async () => {
        aba = b.dataset.aba; await desenhar();
      }));
      return;
    }

    /* ── AS DUAS ABAS ───────────────────────────────────────────────────
       "Acervo" sao as provas que nos conferimos; "Minhas questoes" e o
       material que a propria pessoa sobe. Os dois nunca se misturam -- ver o
       comentario em `telaMinhas` e a migration 20260922180000. */
    caderno = (await carregarCaderno(null, 1)) || caderno;
    $('conteudo').innerHTML = `
      <div class="abas">
        <button class="aba ${aba === 'acervo' ? 'ativa' : ''}" data-aba="acervo">
          Acervo<span class="aba-conta">${filtros.total}</span>
        </button>
        <button class="aba ${aba === 'minhas' ? 'ativa' : ''}" data-aba="minhas">
          Minhas questões<span class="aba-conta">${minhas.length}</span>
        </button>
        <button class="aba ${aba === 'caderno' ? 'ativa' : ''}" data-aba="caderno">
          Caderno de erros<span class="aba-conta">${caderno.total || 0}</span>
        </button>
      </div>
      <div id="painel"></div>`;

    document.querySelectorAll('[data-aba]').forEach((b) => {
      b.addEventListener('click', async () => {
        aba = b.dataset.aba;
        try { localStorage.setItem('astral_aba_questoes', aba); } catch { /* aba anonima */ }
        await desenhar();
      });
    });

    if (aba === 'caderno') {
      $('painel').innerHTML = telaCaderno();
      $('btn-revisar')?.addEventListener('click', revisarCaderno);
      return;
    }

    if (aba === 'minhas') {
      $('painel').innerHTML = telaMinhas();
      const campo = $('m-pdf');
      campo.addEventListener('change', () => abrirPdfMinhas(campo.files[0]));
      const campoGab = $('m-gab');
      campoGab.addEventListener('change', () => abrirGabaritoMinhas(campoGab.files[0]));
      ligarArrastar({
        aoSoltar: (arq) => {
          if (!arq) { toast('Não consegui ler o arquivo que você soltou.'); return; }
          if (aba !== 'minhas') { toast('Abra "Minhas questões" para subir um PDF.'); return; }
          abrirPdfMinhas(arq);
        },
        aoAcender: (lig) => $('solta-minha')?.classList.toggle('por-cima', lig),
      });
      $('btn-estudar-minhas').addEventListener('click', sortearMinhas);
      $('painel').querySelectorAll('[data-apagar]').forEach((b) => {
        b.addEventListener('click', () => apagarMinha(b.dataset.apagar));
      });
      return;
    }

    $('painel').innerHTML = montarFiltros();
    // O botao "Minhas questoes" dentro do aviso troca de aba como as abas do topo.
    $('painel').querySelectorAll('[data-aba]').forEach((b) => b.addEventListener('click', async () => {
      aba = b.dataset.aba;
      try { localStorage.setItem('astral_aba_questoes', aba); } catch { /* aba anonima */ }
      await desenhar();
    }));
    for (const [id] of CAMPOS) $(id)?.addEventListener('change', atualizarFiltros);
    $('btn-limpar')?.addEventListener('click', () => {
      for (const [id] of CAMPOS) if ($(id)) $(id).value = '';
      atualizarFiltros();
    });
    atualizarFiltros();
    /* 30/09/2026: o painel manda treinar a materia fraca ("?materia=Quimica").
       Vale uma vez: depois a pessoa filtra como quiser. So aplica se a materia
       existe no acervo -- valor de fora nunca vira opcao. */
    if (materiaPedida) {
      const sel = $('f-materia');
      if (sel && [...sel.options].some((o) => o.value === materiaPedida)) { sel.value = materiaPedida; atualizarFiltros(); }
      materiaPedida = null;
    }
    $('btn-sortear').addEventListener('click', sortear);
    atualizarCota(null);
    $('cota').innerHTML = `<span><span class="cota-num">${filtros.total}</span> questões no acervo.
      Escolha o terreno e comece.</span>`;
  }

  let materiaPedida = new URLSearchParams(location.search).get('materia');
  // A revisao do painel abre direto o caderno de erros (30/09/2026). So as 3 abas que existem.
  const abaPedida = new URLSearchParams(location.search).get('aba');
  if (['acervo', 'minhas', 'caderno'].includes(abaPedida)) aba = abaPedida;

  (async () => {
    const sessao = await exigirSessao();
    if (!sessao) return;
    await nomeDoUsuario(sessao);
    await carregarMinhas();
    if (materiaPedida) aba = 'acervo';
    await desenhar();
  })();

  window.fazerLogout = fazerLogout;
</script>
