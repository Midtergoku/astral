<style>










/* ── MAIN ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: calc(100vw - var(--sidebar-w));
    }

.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }





.btn-upload:hover { opacity: 0.87; transform: translateY(-1px); }

/* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

.grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

/* ── UPLOAD SECTION ── */
    .upload-card {
      border: 2px dashed var(--border);
      border-radius: 6px;
      padding: 3.5rem 2rem;
      text-align: center;
      transition: border-color 0.2s;
      cursor: pointer;
      background: var(--surface);
      margin-top: 1rem;
    }

.upload-card:hover { border-color: var(--purple); }

.upload-card.drag-over { border-color: var(--purple); background: rgba(192,138,46,0.04); }

.upload-icon {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      background: rgba(192,138,46,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }

.upload-card h3 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--white);
      margin-bottom: 0.5rem;
    }

.upload-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; max-width: 400px; margin-left: auto; margin-right: auto; }

/* ── AI PROCESSING ── */
    .ai-processing {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 3.5rem 2rem;
      margin-top: 1rem;
    }

.ai-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(192,138,46,0.12);
      border: 2px solid rgba(192,138,46,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }

@keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,138,46,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(192,138,46,0); }
    }

.ai-processing h3 {
      font-family: var(--display);
      font-weight: 700;
      color: var(--white);
      margin-bottom: 0.4rem;
    }

.ai-processing p { color: var(--muted); font-size: 0.88rem; }

/* ── DETALHES DO EDITAL ── */
    .info-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

.info-value { font-size: 1.1rem; color: var(--white); font-weight: 600; }

.section-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--white);
      margin-bottom: 1rem;
    }

/* ── MATÉRIAS E PESOS ── */
    .materia-list { display: flex; flex-direction: column; gap: 0.75rem; }

.materia-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: var(--surface2);
      padding: 1.25rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

.materia-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

.materia-nome { font-size: 0.95rem; font-weight: 600; color: var(--white); margin-bottom: 0.2rem; }

.materia-questoes { font-size: 0.75rem; color: var(--muted); }

.materia-peso { font-size: 0.95rem; font-weight: 700; color: var(--purple-lt); }

.peso-bar { background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; margin-top: 0.25rem; }

.peso-fill { height: 100%; border-radius: 999px; background: var(--purple-lt); }

.btn-danger {
      background: rgba(224,112,90,0.1);
      color: var(--red);
      border: 1px solid rgba(224,112,90,0.25);
      padding: 0.7rem 1.5rem;
      border-radius: 6px;
      font-family: var(--corpo);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 1.5rem;
    }

.btn-danger:hover {
      background: rgba(224,112,90,0.2);
    }

@media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; padding: 1.25rem; }
      .grid-2 { grid-template-columns: 1fr; }
    }

/* animacao de entrada do .main removida: o elemento tem
     view-transition-name e quem o anima e o navegador. Ter as duas fazia
     a tela piscar na troca de pagina. */

.card {
    animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }



</style>

<script type="module">
  import { supabase, esc, att, escJs, urlSegura, exigirSessao, fazerLogout, nomeDoUsuario, chamarIA, toast }
    from './assets/js/astral.js?v=bd892079';
  import { montarCronograma, gerarGuiaCompleto } from './assets/js/plano.js?v=22c00529';
  import { carregarProgresso, salvarProgresso } from './assets/js/estado.js?v=04f39c1f';

  let estado = {
    usuario: null,
    xp: 0,
    streak: 0,
    horas: 0,
    materias: [],
    cronogramaHoje: [],
    edital: null,
    badges: [],
  };

  async function init() {
    const session = await exigirSessao();
    if (!session) return;

    estado.usuario = session.user;

    // Progresso vem da conta, nao do navegador.
    const dados = await carregarProgresso(session.user.id);
    estado.xp             = dados.xp;
    estado.streak         = dados.streak;
    estado.horas          = dados.horas;
    estado.materias       = dados.materias;
    estado.cronogramaHoje = dados.cronogramaHoje;
    estado.edital         = dados.edital;
    estado.badges         = dados.badges;

    renderUI();
  }

  function detectarTipoConcurso(nomeEdital) {
    if (!nomeEdital) return 'Desconhecido';
    const nome = nomeEdital.toLowerCase();
    if (nome.includes('bomb') || nome.includes('cbm') || nome.includes('cbmerj') || nome.includes('bombeiro')) return 'Bombeiros';
    if (nome.includes('marinha') || nome.includes('naval') || nome.includes('en ') || nome.includes('eamcn')) return 'Marinha';
    if (nome.includes('aeronáutica') || nome.includes('aeronautica') || nome.includes('afa') || nome.includes('eear') || nome.includes('epcar')) return 'Aeronáutica';
    if (nome.includes('exército') || nome.includes('exercito') || nome.includes('espcex') || nome.includes('essa') || nome.includes('aman')) return 'Exército';
    if (nome.includes('policia militar') || nome.includes('polícia militar') || nome.includes(' pm ') || nome.includes('pmes') || nome.includes('pmrj') || nome.includes('pmsp')) return 'Polícia Militar';
    return 'Geral';
  }

  window.renderUI = function() {
    const nome = estado.perfil?.nome
      || estado.usuario?.user_metadata?.full_name
      || estado.usuario?.email?.split('@')[0]
      || 'Concurseiro';
    const primeiroNome = nome.split(' ')[0];
    const elName = document.getElementById('user-name');
    const elAvatar = document.getElementById('user-avatar');
    if(elName) elName.textContent = primeiroNome;
    if(elAvatar) elAvatar.textContent = primeiroNome[0].toUpperCase();

    const planoEl = document.getElementById('user-plan');
    if (planoEl) {
      const plano = estado.perfil?.tipo_plano || 'free';
      if (planoEl) planoEl.textContent = plano.toUpperCase();
      if (plano === 'beta' || plano === 'premium') { if (planoEl) planoEl.className = 'user-plan plan-beta'; }
      if (plano === 'pro') { if (planoEl) planoEl.className = 'user-plan plan-pro'; }
    }

    const topbarActions = document.getElementById('topbar-actions');
    const contentArea = document.getElementById('content-area');

    if (!estado.edital) {
      topbarActions.innerHTML = '';
      contentArea.innerHTML = `
        <div class="card upload-card" id="upload-area"
             ondragover="dragOver(event)"
             ondragleave="dragLeave(event)"
             ondrop="dropFile(event)"
             onclick="document.getElementById('file-input').click()">
          <div class="upload-icon">
            <svg width="24" height="24" fill="none" stroke="var(--purple-lt)" viewBox="0 0 24 24" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <h3>Seu edital. Seu plano. Em 30 segundos.</h3>
          <p>Cole o PDF do edital aqui. O Astral extrai as matérias, calcula os pesos e monta um cronograma personalizado para você.</p>
          <button class="btn-upload" onclick="event.stopPropagation(); document.getElementById('file-input').click()">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Analisar edital
          </button>
        </div>

        <div class="card ai-processing" id="ai-processing">
          <div class="ai-icon"><i data-icone="ia"></i></div>
          <h3 data-ai-titulo>Lendo seu edital.</h3>
          <p data-ai-detalhe>Extraindo matérias, calculando pesos e montando seu cronograma. Isso leva alguns segundos.</p>
        </div>
      `;
      return;
    }

    // Se tem edital, mostra os dados
    topbarActions.innerHTML = `
      <button class="btn-upload" onclick="document.getElementById('file-input').click()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Trocar edital
      </button>
    `;

    const matOrdenadas = [...estado.materias].sort((a, b) => b.peso - a.peso);
    const maxPeso = Math.max(...matOrdenadas.map(m => m.peso));
    const tipo = detectarTipoConcurso(estado.edital.nome);

    contentArea.innerHTML = `
      <!-- Upload Oculto mas presente para re-uso -->
      <div id="ai-processing" class="card ai-processing">
        <div class="ai-icon"><i data-icone="ia"></i></div>
        <h3 data-ai-titulo>Lendo seu edital.</h3>
        <p data-ai-detalhe>Extraindo matérias, calculando pesos e montando seu cronograma. Isso leva alguns segundos.</p>
      </div>

      <div id="edital-details">
        <div class="card">
          <div style="font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--white);margin-bottom:1.5rem;">
            ${esc(estado.edital.nome)}
          </div>
          <div class="grid-2">
            <div>
              <div class="info-label">Data da Prova</div>
              <div class="info-value">${esc(estado.edital.dataProva) || 'Não identificada'}</div>
            </div>
            <div>
              <div class="info-label">Tipo</div>
              <div class="info-value">${tipo}</div>
            </div>
            <div>
              <div class="info-label">Matérias extraídas</div>
              <div class="info-value">${esc(estado.edital.materias)}</div>
            </div>
          </div>
        </div>

        <div class="section-title">Matérias e pesos</div>
        <div class="card">
          <div class="materia-list">
            ${matOrdenadas.map(m => {
              const width = maxPeso > 0 ? (m.peso / maxPeso) * 100 : 0;
              return `
                <div class="materia-row">
                  <div class="materia-header">
                    <div>
                      <div class="materia-nome">${esc(m.nome)}</div>
                      <div class="materia-questoes">${m.questoes} questões estimadas</div>
                    </div>
                    <div class="materia-peso">${m.peso}%</div>
                  </div>
                  <div class="peso-bar">
                    <div class="peso-fill" style="width:${width}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <button class="btn-danger" onclick="removerEdital()">
          Remover edital do sistema
        </button>
      </div>
    `;
  }

  // ── UPLOAD / PROCESSAMENTO DO EDITAL ──
  window.dragOver = function(e) {
    e.preventDefault();
    document.getElementById('upload-area')?.classList.add('drag-over');
  }

  window.dragLeave = function(e) {
    document.getElementById('upload-area')?.classList.remove('drag-over');
  }

  window.dropFile = function(e) {
    e.preventDefault();
    document.getElementById('upload-area')?.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') processarEdital(null, file);
  }

  // Mesmo limite da edge function, conferido aqui para nao subir 10 MB a toa.
  const MAX_PDF_MB = 10;

  window.processarEdital = async function(event, fileOverride) {
    const file = fileOverride || event?.target?.files?.[0];
    if (!file) return;

    if (file.type !== 'application/pdf') {
      toast('Envie um arquivo PDF.', 'error');
      return;
    }
    if (file.size > MAX_PDF_MB * 1024 * 1024) {
      toast(`O PDF tem ${(file.size / 1024 / 1024).toFixed(1)} MB e o limite é ${MAX_PDF_MB} MB.`, 'error');
      return;
    }

    // Mostra processing
    const uploadArea = document.getElementById('upload-area');
    const editalDetails = document.getElementById('edital-details');
    const topbarActions = document.getElementById('topbar-actions');
    
    if (uploadArea) uploadArea.style.display = 'none';
    if (editalDetails) editalDetails.style.display = 'none';
    if (topbarActions) topbarActions.style.display = 'none';
    
    const proc = document.getElementById('ai-processing');
    if (proc) proc.style.display = 'flex';

    try {
      const base64 = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result.split(',')[1]);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });

      // Autenticado com o access_token do usuario; a edge function ja devolve
      // o objeto validado. Antes ia a chave publica e havia stringify + parse.
      const resultado = await chamarIA('processar-edital', { pdfBase64: base64 });

      estado.edital = {
        nome: resultado.concurso || file.name,
        materias: resultado.materias?.length || 0,
        dataProva: resultado.dataProva || null,
        // 04/08/2026: a IA passou a LER a forca e a patente do edital, em vez
        // de o navegador adivinhar pelo nome. Guardado aqui porque e daqui que
        // o divisa.js le. Ver o cabecalho de assets/js/divisa.js.
        forca: resultado.forca || null,
        patenteInicial: resultado.patenteInicial || null,
      };

      estado.materias = (resultado.materias || []).map(m => ({
        nome: m.nome,
        questoes: m.questoes,
        peso: m.peso,
        progresso: 0,
      }));

      // Peso E progresso, numa conta so -- ver assets/js/plano.js.
      // Antes era slice(0,3): as tres mais pesadas para sempre, e uma materia
      // de peso baixo NUNCA aparecia, nem com a pessoa zerada nela.
      estado.cronogramaHoje = montarCronograma(estado.materias);

      if (!estado.badges.includes('primeiro_edital')) {
        estado.badges.push('primeiro_edital');
        estado.xp += 100;
      }

      // await + imediato: a navegacao abaixo cancelaria um salvamento adiado,
      // e o edital recem-processado seria perdido.
      await salvarDados({ imediato: true });

      /* O GUIA DE PROFESSORES NAO SEGURA O PLANO (04/08/2026).
         Ele continua no dashboard, por tras. Medido: o cronograma fica pronto
         em 20-29s, mas cada materia de professores leva 30-41s -- com 8
         materias, prender o usuario aqui passaria dos 5 minutos que a landing
         promete. O plano e o que ele veio buscar; o guia e o extra. */
      window.location.href = 'dashboard.html';

    } catch(err) {
      console.error(err);
      toast(err.message || 'Erro ao processar o edital. Tente novamente.', 'error');
      if (proc) proc.style.display = 'none';
      if (uploadArea) uploadArea.style.display = 'block';
      if (editalDetails) editalDetails.style.display = 'block';
      if (topbarActions) topbarActions.style.display = 'flex';
      renderUI();
    }
  }

  window.removerEdital = function() {
    if (confirm('Tem certeza que deseja remover o edital atual? Isso resetará as matérias e o cronograma. Suas conquistas e XP serão mantidos.')) {
      estado.edital = null;
      estado.materias = [];
      estado.cronogramaHoje = [];
      salvarDados({ imediato: true });   // apagar o edital nao pode ficar pendente
      renderUI();
    }
  }

  function salvarDados({ imediato = false } = {}) {
    return salvarProgresso(estado.usuario.id, {
      xp:             estado.xp,
      streak:         estado.streak,
      horas:          estado.horas,
      materias:       estado.materias,
      cronogramaHoje: estado.cronogramaHoje,
      edital:         estado.edital,
      badges:         estado.badges,
    }, { imediato });
  }

  // ── LOGOUT ──
  window.fazerLogout = fazerLogout;

  // ── START ──
  init();
</script>
